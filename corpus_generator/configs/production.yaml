# Production run: paper-scale fanout. DAG-expanded: advice 24,441 requests
# (1 + 40 + 400 + 6x4,000); stories 45,051 (1 + 50 + 9,000 + 2x18,000).
# Filter thresholds FROZEN 2026-09-01 from the pilot stratified inspection.
# They are CONSERVATIVE
# FLOORS that drop ~0 pilot records, not calibrated precision cuts: the
# same-model scorer assigned no low scores anywhere at the pilot, so
# precision protection is the boolean hard gates (refusal, ai_named,
# factual_claims, trainable persona — all unconditional in code) plus
# generator quality. The production filter report surfaces the per-axis
# score distributions and below-floor drop counts so the tail can be
# hand-audited at scale.
