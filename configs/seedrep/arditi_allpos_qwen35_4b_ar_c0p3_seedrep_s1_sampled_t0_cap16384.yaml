# -- the explicit cell enumeration (ordered; the registry is EXACTLY this) ---
explicit_cells:
- none
- arditi_allpos

# THE DOSE, ITS UNIT AND THE PHASE, as data (see the header). `c` is the multiplier on the RAW
# difference of means — NOT a fraction of the residual norm, which is what the prefill-only lane's
# `alpha` is — so `dose_unit` is what stops a reader joining three method lanes from taking this
# number for that one, for the LoRA lane's write-basis multiplier or for AlphaSteer's nominal
# base_scale; `phase` is the served phase, REQUIRED beside it, and here it is the
# paper's own: prefill AND every decode step.
dose_unit: raw_coefficient
phase: both
c: 0.3

