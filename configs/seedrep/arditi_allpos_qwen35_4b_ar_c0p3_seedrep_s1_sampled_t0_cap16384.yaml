# -- the Qwen seed-replicate battery: the vendor-recommended sampler under seed base 1, read by jailbreak_run.py generate
# (--trial must equal `trial`; static_cap must equal attacks.static_max_new_tokens) and by
# served_capability_run.py (controls_gen_config); every row records `decode` + `sampling_seed` --
sampled_decode:
  arm: vendor_recommended
  trial: 0
  n_trials: 1
  seed_base: 1
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  presence_penalty: 1.5
  repetition_penalty: 1.0
  source: "Qwen/Qwen3.5-4B @ 851bf6e8: NO generation_config.json ships (.no_exist marker); model card README \"Best Practices\", instruct/non-thinking mode, GENERAL tasks -- temperature 0.7, top_p 0.8, top_k 20, min_p 0.0, presence_penalty 1.5, repetition_penalty 1.0 (the card's stated no-op value); the only preset of the four with an anti-repetition term; read on cluster A 2026-09-09 (DESIGN.md 'Verified sampler presets')"
  source_kind: model_card
  applies_to: [static_families, controls]
  static_cap: 16384
  controls_cap: 512
  # a RE-DRAW at the larger cap (same seed), never a continuation; only the base run's at-cap
  # rows are regenerated, every terminated row is copied forward (escalate_static.py)
  escalated_from:
    kind: static
    cap: 8192
    private_run: arditi_allpos_qwen35_4b_ar_c0p3_seedrep_s1_sampled_t0_cap8192
  # -- per-readout overrides (the coordinator's second amendment, 2026-09-09; lane G1 reads readouts.gsm8k): GSM8K
  # THINKING-ON at the readouts cap under the vendor's THINKING preset where one exists (Qwen), the single preset
  # above otherwise (`source` says which); MMLU is a teacher-forced letter-logprob argmax (sampler-moot). The static
  # families and the judged controls IGNORE this sub-block (their validators admit the key, read the preset above).
  readouts:
    gsm8k:
      cap: 8192
      thinking: "on"
      preset:
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 1.5
        repetition_penalty: 1.0
      source: "Qwen/Qwen3.5-4B @ 851bf6e8: model card README \"Best Practices\", THINKING mode, general tasks -- temperature 1.0, top_p 0.95, top_k 20, min_p 0.0, presence_penalty 1.5, repetition_penalty 1.0 (the card's stated no-op value); the vendor's thinking row, as reported to the project (adopted by the second amendment, 2026-09-09)"
    mmlu:
      instrument: letter_logprob_argmax
      note: "sampler-moot: teacher-forced letter-logprob argmax; the sampled run measures server-to-server logprob nondeterminism only"
