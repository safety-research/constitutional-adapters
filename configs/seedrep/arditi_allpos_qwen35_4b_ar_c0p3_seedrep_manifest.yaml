# arditi_allpos_qwen35_4b_ar_c0p3_seedrep_manifest.yaml — qwen-seedrep-native-battery: the LANE copy of Scale's Petri manifest for the Arditi
# all-positions arm (ar_c0p3). GENERATED by scripts/sdfbase/seedrep/render_arditi_seedrep_configs.py from the verbatim source copy of
# configs/capeval/manifests/arditi_allpos_qwen35_4b_ar_c0p3.yaml (source sha 0f3576f38ef7; configs/seedrep/source/) — never hand-edited.
# The source's text follows BYTE-FOR-BYTE EXCEPT: (1) `petri.serving_impl_commit` re-pinned to the roster's; (2) the
# `petri.target_decode` block; (3) the Petri fallback chains (PETRI_FALLBACK_CHAINS): the
# auditor chain re-spelled as sonnet -> grok-4.6 only and `judge_fallback_models` [grok-4.6] added. Everything else —
# audit, behaviors, cells, scenario bundle, auditor / judge models, prompt provenance, target, serving flags, prefix
# hashes, bloom_options — is Scale's, unchanged.
#
# Petri Bloom misalignment audit — the ALL-POSITIONS Arditi arm, target qwen35_4b,
# raw coefficient c = 0.3 (view `ar_c0p3`). GENERATED by scripts/arditi/make_arditi_allpos_configs.py from
# configs/arditi_allpos_roster.yaml — never hand-edited (byte-identity is tested). DERIVED from
# configs/capeval/manifests/petri_full22_qwen35_4b_it.yaml with EXACTLY three keys changed — `audit`,
# `cells` and `serving_impl_commit` — so this arm audits the same world as the wave and every leg
# is comparable.
#
# `serving_impl_commit` IS RE-DERIVED, NOT CARRIED, and that is the one place this generator
# departs from its prefill-only twin (IA16). That lane adds no file under
# src/sisteer/capeval/serving/ or tiers/petri_runner.py, so the wave's sha is still the last commit
# touching them and it carries the value verbatim. THIS arm is served on the native residual slot,
# which requires serving files the wave tree did not have — so the manifest records the commit that
# last touched those paths in the checkout the job runs from, which is exactly what
# ar_resolve_config re-derives and greps for before any standup. A later commit touching the
# serving tree therefore makes `--check` go red and these files must be regenerated: that is the
# designed signal, not a defect.
#
# cells: `none` (this view's own same-standup bare anchor) and `arditi_allpos` (a NEW bare Class B id,
# never an alias of the prefill-only `arditi`).
#
# THE DOSE UNIT AND THE SERVED PHASE ARE NOT IN THIS FILE, DELIBERATELY.
# capeval.manifest.load_petri_spec refuses unknown keys at both levels and PetriSpec has no field
# for either, so a `dose_unit` or `phase` key here would make every manifest of this arm
# unloadable; adding the fields would change a schema every campaign manifest is validated against
# and whose hash is baked into every recorded audit id — a deliberate shared change for all the
# method lanes at once, by whoever owns manifest.py, not something one arm does to itself. Both
# ride in the serve config, the roster, configs/arditi_allpos_pins.json and every object sidecar. This
# view serves c = 0.3 in units of raw_coefficient, at phase both (prefill AND every decode
# step) — the paper's own configuration.
petri:
  audit: arditi_allpos_qwen35_4b_ar_c0p3
  behaviors:
    - cyber_bio_chem_capabilities
    - self_preservation
    - delusion_sycophancy
    - defer_to_users
    - reasoning_unfaithfulness
    - instruction_evasion
  cells:
    - none
    - arditi_allpos
  scenario_bundle_hash: 8812ba083bb5473c   # durable 0700 store: $SHARED/petri/scenarios/8812ba083bb5473c (cluster A); the grading host copy $STATE/petri/scenarios/8812ba083bb5473c
  auditor_model: anthropic/claude-sonnet-5
  auditor_fallback_models:             # API-only chain, sonnet -> opus-4-8 -> grok-4.6 (order pinned); the abliterated-Qwen leg is dropped
    - anthropic/claude-opus-4-8
    - openrouter/x-ai/grok-4.6
  judge_fallback_models:               # opus-4-8 then grok-4.6 back the JUDGE too (a returned content_filter refusal switches legs)
    - anthropic/claude-opus-4-8
    - openrouter/x-ai/grok-4.6
  judge_model: anthropic/claude-opus-5
  scenarios_model: anthropic/claude-opus-4-8   # the frozen bundle's author (harness-hash input)
  prompt_provenance: override@c7fb238c0b17a812   # VERBATIM petri-bloom 0.2.6 auditor/judge bytes (configs/capeval/petri/prompts)
  target_model: Qwen/Qwen3.5-4B
  target_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  serving_backend: proxy_vllm     # committed production primary (B1)
  serving_mode: interleaved       # exact_replay dropped 2026-08-27 (see petri_twosi.yaml)
  serving_packages:               # the serving-venv pins (configs/capeval/vllm-requirements.txt)
    vllm: 0.25.1+cu129
    vllm-lens: 1.2.1
    torch: 2.11.0+cu129
  serving_launch_flags:           # applied on BOTH engines: the native default (--serving-path lora_native) strips --enforce-eager and records it as manifest_flags_dropped; the LENS escape hatch (--serving-path lens) takes them verbatim; never --enable-lora here, the native composer owns it (docs/native_multilora_serving.md §1)
    - --enforce-eager
    - --chat-template-content-format
    - string
    - --limit-mm-per-prompt
    - '{"image":0,"video":0}'
  chat_template_hash: a4aee8afcf2e0711   # sha256_hex16 of the pinned tokenizer's chat_template bytes; the standup re-hashes and refuses a mismatch
  tool_parser: qwen3_xml
  serving_impl_commit: 94e294c445dc5eec6ebe0ce3a3e25553004cd4b0   # RE-PINNED from configs/sdfbase_full22_roster.yaml (the lane's one authority, shared with the s1/s2/s3 manifests; the roster is re-pinned at landing and this file regenerated)
  prompted_prefix_hashes:         # sha256_hex16 over the EXACT SI text bytes (H8); verified per request (H8) for the prompted cell(s) prompted__safety, prompted__constitution
    safety: ac3a58f61d53cf24
    constitution: 21e06f482a6559b3
    irrelevant: 71ff67aa2bc000f1
  target_decode:                  # the vendor row on every TARGET request; a
                                  # harness-hash input (`--target-decode vendor` asserts it; `--target-seed-base <s>`
                                  # is a RUN knob, never here — one Arditi proxy serves the three seed bases, three out roots)
    mode: vendor
    policy: 'qwen35_4b_it|petri|off|vendor_preset@v1'
  bloom_options:
    max_turns: 15                 # auditor turn budget per scenario (2026-08-18)
    enable_prefill: false         # defaults pinned OFF
    enable_rollback: false
    compaction: false
    realism_filter: false
    epochs: 1                     # ~10 scenarios x 1 epoch per behavior
    seed: 0                       # the ONE audit-wide evaluation seed
