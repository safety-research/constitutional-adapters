# arditi_allpos_roster.yaml — THE cell roster of the ALL-POSITIONS Arditi arm
# ($WORK/arditi-qwen-all-positions, §5.3). The SAME shape as configs/arditi_strength_roster.yaml,
# because the SAME unmodified readers consume it: scripts/sdfbase/full22/f22_roster.py
# (served_cells / staged_cells), scripts/sdfbase/full22/make_bank_view.py (--roster / --pins /
# --bank), common.sh f22_arm_bank_view (through configs/sdfbase_full22_arms.yaml's `roster` key),
# and this lane's scripts/arditi/stage_arditi_allpos.py.
#
# GENERATED by scripts/arditi/make_arditi_allpos_roster.py from scripts/arditi/arditi_strength.py's
# raw-coefficient unit record + arditi_targets.py (the model pin is read out of the WAVE roster, so
# a model id is never typed twice). Never hand-edit: `--check` requires byte-identity.
#
# WHAT THIS ARM SERVES, AND HOW IT DIFFERS FROM `arditi` (2026-09-15). The RAW Arditi
# difference of means (arXiv 2406.11717) at coefficient `c`, added at EVERY position of EVERY
# forward — the prefill AND every decode step, which is Arditi's own ungated forward pre-hook. The
# prefill-only `arditi` arm serves the UNIT direction at a fraction of the residual norm, at the
# prefill only: two DECLARED deviations (phase and unit) that this arm CORRECTS, on one model.
# They are therefore two ARMS, not two doses of one arm — a row must be able to say which it is —
# and they share nothing but the fitted direction.
#
# THE DOSE UNIT IS THE PAPER'S RAW COEFFICIENT, and the letter says so. View `ar_c<c>` against the
# prefill-only lane's `ar_r<alpha>` (a residual-norm fraction), the LoRA lane's `ar_d` (a
# write-basis multiplier) and AlphaSteer's `lam` (a nominal base_scale): two doses of the same
# NUMBER in different units are a join that succeeds and means the wrong thing, and this campaign
# has already paid for that once. On top of the letter, `dose_unit` rides at the top level here, on
# EVERY view, in configs/arditi_allpos_pins.json and in every object sidecar.
#
# c = 1.0 IS SPELLED `ar_c1`, NOT `ar_c1p0` (arditi_strength.format_strength): the lane's own
# parser REFUSES a non-canonical spelling, so a view named `ar_c1p0` resolves no bank dir at all.
#
#   c      view        staged id                    what it is
#   0.10   ar_c0p1     ar_c0p1__arditi_allpos       the floor — below the prefill-only arm's own
#                                                   operating point (alpha 0.05 == c 0.142), so
#                                                   the budget crossing is bracketed
#   0.20   ar_c0p2     ar_c0p2__arditi_allpos
#   0.30   ar_c0p3     ar_c0p3__arditi_allpos
#   0.50   ar_c0p5     ar_c0p5__arditi_allpos       ~the prefill-only 20 pp ceiling's equivalent
#   1.00   ar_c1       ar_c1__arditi_allpos         THE PAPER'S NOMINAL — filed as a measured,
#                                                   labelled second point on the ladder leg, never
#                                                   as the arm
#
# THE DOSE IS BAKED INTO THE BYTES, never a serve-time flag: the served OP_ADD_VECTOR carries
# coeff 1.0, so a rung is `vectors[12] <- c * r_raw` and each rung is its own sha.
#
# THE STORED LAYER IS THE SERVED LAYER, THE INVERSE OF THE PREFILL-ONLY LANE'S. A `vector_all` blob
# stores the SERVED block-output layer and `_adapt_vector_all` serves it AS STORED; a `static_r`
# blob at site="pre" stores the FIT layer and the adapter shifts it. On qwen35_4b the fit layer is
# 13 and the served block output is 12, so these rungs key `vectors` by 12 where the prefill-only
# rungs key `rs` by 13. Getting it backwards steers a block early or late with every other signal
# healthy, so the pins carry the fit record's ABSOLUTE layers and every serve-time gate holds the
# object to them (arditi_strength.RAW_PIN_LAYER_KEYS).
#
# THE APPROVED FIT IS DECLARED IN THE ARMS TABLE, not here: configs/sdfbase_full22_arms.yaml
# arms.arditi_allpos.fits.<target> names the ONE fit record this arm may be baked from, and every
# pins entry is held to it BEFORE the pins certify any object.
#
# SERVED NATIVELY IN EVERY LEG. The arms table declares `serving_path: lora_native`: the lens WOULD
# serve a vector_all blob, so a leg that inherited `F22_SERVING_PATH=lens` would complete and file
# LENS numbers under this arm's name — a different measurement, not a failure.
#
# THREE KEYS THIS ROSTER DELIBERATELY DOES NOT CARRY (see scripts/arditi/make_arditi_allpos_roster.py's
# docstring for the reasoning): `serving_impl_commit` (the raw unit derives it from the checkout
# the job runs from, IA16), `lens_reduction_mode` (this arm is native; its grades record null), and
# `alpha_equiv` (a bake output that divides by the measured ||h||_ref; it rides on the pins and the
# sidecars with the sentence that labels it arithmetic).
#
# IDENTITY SIDECAR: fit_provenance.json, not train_budget_meta.json. These objects were FITTED,
# never trained, so they have no training budget by construction.
#
# CELL ID: `arditi_allpos`, a NEW Class B id (defense_cells.SERVED_ONLY_CLASS_B_IDS), never an
# alias of `arditi` — the prefill-only cells keep their identity and nothing aliases two
# interventions under one name across the export's supersession mechanisms. `none` is the
# same-standup bare anchor: in every config's explicit_cells, never a roster cell (no object),
# never in the bank view or the pins. EVERY VIEW CARRIES ITS OWN `none`: a dose curve whose points
# are measured against different anchors is not a curve.
#
# The object identity of every served cell is PINNED in configs/arditi_allpos_pins.json, a
# GENERATED file (scripts/arditi/stage_arditi_allpos.py writes it from the VERIFIED staging
# records, so no sha is ever typed by hand). make_bank_view.py refuses a staged object whose sha
# differs from its pin, and refuses an unpinned object outright.
wave: arditi_allpos
bank_root: exp/objects/arditi_allpos          # under $SHARED on either cluster (our own root)
bank_subdir: ladder                              # the per-target bank is <bank_root>/<target>/ladder
staging_manifest: exp/objects/arditi_allpos/ladder_staging_manifest.json
# the attacker's serving defaults, IDENTICAL to the wave's
attacker_prefix_caching: true
attacker_quantization: none

# No lanes in this campaign. The key is present (empty) so f22_roster.lane_flags / lanes_of read
# the same shape they read on the wave roster.
lane_flags: {}

dose_unit: raw_coefficient
dose_unit_description: >-
  c = the multiplier on the RAW Arditi difference of means: the served vector is c * r_raw at the served layer, with c = 1.0 the paper's nominal (arXiv 2406.11717; verified in their code, where select_direction returns the candidate unmodified and only the ABLATION hook normalises). Unlike residual_norm_fraction this is NOT normalised by ||h||, so the same c on two models is two different interventions -- which is why this unit is served on ONE model.
# THE SERVED PHASE, a REQUIRED row field beside dose_unit. Here it is the paper's
# own: prefill AND every decode step.
phase: both
kind: vector_all
positions: all
skip_bos: false
fit_positions: all
expect_served_coeff: 1.0
deviations_from_the_paper:
  rendering: >-
    apply_chat_template through the harness's one renderer (sisteer.models.build_chat_prompt), not their hardcoded per-family template strings.
cross_model_caveat: >-
  Served in the paper's own configuration -- the raw difference-of-means vector at coefficient c, added at every position of every forward (prefill AND decode). The other families' Arditi arms are served PREFILL-ONLY at alpha, a fraction of the residual norm. The two are not the same intervention and their doses are not the same quantity.
coeffs: [0.1, 0.2, 0.3, 0.5, 1]

targets:
  qwen35_4b:
    model: Qwen/Qwen3.5-4B
    model_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
    # the wave's config/manifest for this target's PAPER LANE: the pair every
    # generated serve config of this arm derives from, and the `none` anchor it pairs with
    body_config: configs/sdfbase_full22_qwen35_4b_it.yaml
    body_manifest: configs/capeval/manifests/petri_full22_qwen35_4b_it.yaml
    paper_view: it
    off_roster: false
    # THE DECODE CAPS ARE THIS BODY'S (the canonical instrument), read here and never typed
    static_max_new_tokens: 4096
    target_max_new_tokens: 4096
    controls_max_new_tokens: 512
    bon_max_new_tokens: 512
    bon_route: climb_512_to_4096
    views:
      ar_c0p1:
        c: 0.1
        dose_unit: raw_coefficient
        phase: both
        config: configs/arditi_allpos_qwen35_4b_ar_c0p1.yaml
        manifest: configs/capeval/manifests/arditi_allpos_qwen35_4b_ar_c0p1.yaml
        cells: {arditi_allpos: ar_c0p1__arditi_allpos}
      ar_c0p2:
        c: 0.2
        dose_unit: raw_coefficient
        phase: both
        config: configs/arditi_allpos_qwen35_4b_ar_c0p2.yaml
        manifest: configs/capeval/manifests/arditi_allpos_qwen35_4b_ar_c0p2.yaml
        cells: {arditi_allpos: ar_c0p2__arditi_allpos}
      ar_c0p3:
        c: 0.3
        dose_unit: raw_coefficient
        phase: both
        config: configs/arditi_allpos_qwen35_4b_ar_c0p3.yaml
        manifest: configs/capeval/manifests/arditi_allpos_qwen35_4b_ar_c0p3.yaml
        cells: {arditi_allpos: ar_c0p3__arditi_allpos}
      ar_c0p5:
        c: 0.5
        dose_unit: raw_coefficient
        phase: both
        config: configs/arditi_allpos_qwen35_4b_ar_c0p5.yaml
        manifest: configs/capeval/manifests/arditi_allpos_qwen35_4b_ar_c0p5.yaml
        cells: {arditi_allpos: ar_c0p5__arditi_allpos}
      ar_c1:
        c: 1
        dose_unit: raw_coefficient
        phase: both
        is_paper_nominal: true       # filed as a labelled second point, never as the arm
        config: configs/arditi_allpos_qwen35_4b_ar_c1.yaml
        manifest: configs/capeval/manifests/arditi_allpos_qwen35_4b_ar_c1.yaml
        cells: {arditi_allpos: ar_c1__arditi_allpos}
