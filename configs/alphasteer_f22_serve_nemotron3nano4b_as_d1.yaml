# SERVING config for target nemotron3nano4b, strength view `as_d1` (nominal base_scale 1.0; the
# strengths are read as NOMINAL base_scale, not as multiples of any selected rung; nominal strengths are not
# comparable across object types and need not be, the realised dose is measured separately). The multi-layer
# AlphaSteer Class B cell of the campaign's Phase B lambda=1 PARENT fit, THE PARENT OBJECT ITSELF: base_scale 1.0, the cell dir symlinks its object.pt (scripts/alphasteer_f22/bake_strength.py bake_anchor), never re-saved, never re-scaled,
# served on the vLLM lens target under the STACKED reduction mode next to a FRESH same-standup bare anchor.
# GENERATED by scripts/alphasteer_f22/make_strength_configs.py --lane alphasteer_f22 — never hand-edited; the test
# requires byte-identity. DERIVED from configs/alphasteer_f22_serve_nemotron3nano4b.yaml (the campaign's serving config for this target, itself the full22 wave's `main` config + [none, alphasteer]): every key below is that file's,
# byte-for-byte as data, EXCEPT —
#
#   * `defenses_dir` names the lane's OWN bank view, $SHARED/exp/objects/alphasteer_f22/nemotron3nano4b/strength/cells_view/as_d1
#     (bake_strength.py --lane alphasteer_f22 lays cells/as_d1__alphasteer/ out; scripts/sdfbase/full22/make_bank_view.py builds
#     the view with configs/alphasteer_f22_strength_roster.yaml + configs/alphasteer_f22_strength_pins.json; on the
#     cluster the job's TT_TWO_SI_DEFENSES_DIR export resolves it — the defenses-dir order). Nothing of the parent lane's
#     cells/, cells_view/, ladder/, selected__alphasteer, lambda_ladder.json, roster or pins is a write target.
#   * out_dir / private_run get the `alphasteer_f22_nemotron3nano4b_as_d1` namespace (Tag = <lane>_<target>_<view>; the dose parses
#     from the view name: strip `as_`, drop `d`, `p` -> `.`, leading `m` -> `-`).
#   * `bon.max_new_tokens` = 512, the campaign's value (superseding a native-4096 override): BoN is the 512
#     STORE the campaign's 512 -> 4,096 climb tooling then escalates, so the frontier's three method lanes share
#     ONE best-of-N estimand (a native 4,096 pass for one method next to a climb counterfactual for another would
#     make the methods incomparable — the one comparison Figure 5 exists to make). A 512 store is NOT the final
#     reading: this view expects a row in the climb's lanes manifest (NOTES_strength.md section 9).
#     `attacks.static_max_new_tokens` (4096) and `attacks.target_max_new_tokens` (512) are
#     UNCHANGED, so the static families and multi-turn keep the campaign's caps.
#
# `explicit_cells` is [none, alphasteer]: `none` first is the same-standup bare anchor; `alphasteer` is the bare
# Class B id served from <defenses_dir>/alphasteer/object.pt with fit_provenance.json (the PARENT's, byte-identical)
# as its ONE identity sidecar. The path-matched no-op twin `none__lens0` is DERIVED by defense_cells.enumerate_cells.
# The LAYER SET is the parent's as fit: the object's as fit. The bake asserts
# every copy's layer list equals the parent's element for element; this lane never re-bakes a layer set, so the
# strength ladder measures THIS layer set.
#
# Serving manifest: configs/capeval/manifests/alphasteer_f22_nemotron3nano4b_as_d1.yaml (same generator; its cells are
# EXACTLY these explicit_cells in the harness vocabulary — scripts/sdfbase/mt_serving_up.py refuses a mismatch).
