# -- full22 SAMPLED re-run (DESIGN.md): the vendor-recommended sampler, read by jailbreak_run.py generate
# (--trial must equal `trial`; static_cap must equal attacks.static_max_new_tokens) and by
# served_capability_run.py (controls_gen_config); every row records `decode` + `sampling_seed` --
sampled_decode:
  arm: vendor_recommended
  trial: 1
  n_trials: 2
  seed_base: 20260909
  temperature: 0.8
  top_p: 0.6
  top_k: 2
  repetition_penalty: 1.1
  source: "zai-org/GLM-4.6V-Flash @ 411bb4d7: the model card's \"Evaluation Settings\" (vLLM backend; \"top_p: 0.6, top_k: 2, temperature: 0.8, repetition_penalty: 1.1, max_generate_tokens: 16K\") plus the shipped generation_config.json @ 411bb4d7 which carries the first three (do_sample: true; temperature 0.8, top_p 0.6, top_k 2; no penalty term in the file); the vendor's max generation length is 16K while this run's ladder ceiling stays 8192 by the stated bound; read on cluster A 2026-09-09"
  source_kind: model_card
  applies_to: [static_families, controls]
  static_cap: 16384
  controls_cap: 512
  # a RE-DRAW at the larger cap (same seed), never a continuation; only the base run's at-cap
  # rows are regenerated, every terminated row is copied forward (escalate_static.py)
  escalated_from:
    kind: static
    cap: 8192
    private_run: sdfbase_full22_glm46vflash_dm1_sampled_t1_cap8192
  # -- per-readout overrides (the coordinator's second amendment, 2026-09-09; lane G1 reads readouts.gsm8k): GSM8K
  # THINKING-ON at the readouts cap under the vendor's THINKING preset where one exists (Qwen), the single preset
  # above otherwise (`source` says which); MMLU is a teacher-forced letter-logprob argmax (sampler-moot). The static
  # families and the judged controls IGNORE this sub-block (their validators admit the key, read the preset above).
  readouts:
    gsm8k:
      cap: 8192
      thinking: "on"
      preset:
        temperature: 0.8
        top_p: 0.6
        top_k: 2
        repetition_penalty: 1.1
      source: "zai-org/GLM-4.6V-Flash @ 411bb4d7: no thinking-specific vendor row exists for this model: GSM8K thinking-on reuses the single vendor preset of this config (the coordinator's second amendment, 2026-09-09) -- the preset that runs (temperature 0.8, top_p 0.6, top_k 2, repetition_penalty 1.1; source_kind model_card)"
    mmlu:
      instrument: letter_logprob_argmax
      note: "sampler-moot: teacher-forced letter-logprob argmax; the sampled run measures server-to-server logprob nondeterminism only"
