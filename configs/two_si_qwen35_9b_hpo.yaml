# two_si_qwen35_9b_hpo.yaml — INTERIM, hand-derived from
# two_si_llama3b_hpo.yaml (the gemma4e2b_probe.yaml / llama3b precedent:
# NOT generated by make_fit_configs, whose byte-pin covers only the
# production configs; regenerate properly via derive_model_config.py
# before any FIT wave). Purpose: the Qwen3.5-9B (thinking-off) psr_kl_all
# safety lane — an 8-trial Sobol lr x clip HPO (safety_refusal only),
# launched via scripts/modal/qwen35_9b_hpo.py (app safetysi-qwen35-9b-hpo,
# volume twosi-fits, pool/qwen35_9b/).
#
# Changes from the llama3b HPO config: model/revision swapped to
# Qwen/Qwen3.5-9B @ c202236 (the pool's tokcache header pins exactly
# this identity — models.py pins enable_thinking=False on this template,
# hence "thinking-off"); layer 13/28 -> 15/32 (round(0.469 x 32), the
# derive_model_config.py LAYER_FRAC; inert for the all-layer psr arms);
# teacher_prefix_cache true -> FALSE (the qwen38_27b/gemma4e4b
# evidence-forced deviation, 2026-08-25: TeacherPrefixCache crashes on
# qwen3_5's LinearAttentionLayer cache entries at ANY prefix — flip only
# after prefix_cache.py supports the hybrid layout AND the
# onboard_model_smoke.py equivalence gate passes);
# batch_size_by_arm -> sentinel (measure with the app's hpomem ladder —
# the sweep passes --batch-size explicitly; 9B > 3B so the 3B's bs does
# NOT carry); train_kwargs.psr_kl_all lr/clip -> sentinel (a fit launched
# before the 9B winner folds fails loudly). Everything else
# (max_len_by_si: safety 8192, epochs 10, warmup_cosine, patience 3,
# holdout 0.1, T=1/wd=0.01 pinned) carries the 3B safety-lane regime
# unchanged — the recipe is identical to the 3B except the model and a
# WIDER lr box.
#
# model: Qwen/Qwen3.5-9B @ c202236 (Qwen3_5ForConditionalGeneration,
#   hybrid linear/full attention, nested text_config, 32 text layers;
#   reasoning template pinned off via enable_thinking=False in models.py)
# pool: $HOME/twosi_qwen35_9b_off/pairs/ — the FROZEN pool (frozen
#   2026-08-28: manifest_sha256 b09a316c7d9ce7db..., regime
#   matched_intersection, 10586 pairs/SI) -> twosi-fits volume
#   pool/qwen35_9b/ (pairs_safety_refusal.jsonl sha ba63468e01b4...,
#   + the pre-tokenized .tokcache.npz sidecar built with the pool —
#   reused, never rebuilt; its header model id/revision AND pool sha
#   match). Longest safety row 4102 tokens, so max_len 8192 truncates
#   nothing.
# degenerate rows: KEPT (safety pos/neg flagged 37 = 0.17% of 22343
#   completions) — no sibling fit (8B/3B/E4B/E2B/27B) filters them, so
#   keeping preserves cross-model comparability, and the rate is
#   negligible. The Pair loader reads named keys only, so the flags
#   ride the jsonl without touching the fit.
# Sweep box (NO Qwen3.5-9B prior — deliberately WIDE): eff batch 64,
#   lr [1e-4, 4e-3] x clip [0.02, 0.5] log-space, wf fixed 0.15,
#   T/wd pinned 1.0/0.01.
