    the seed-replicate over-refusal controls (see meta.additions). `misalign_seedrep` (added 2026-09-21) is the registry's PROVISIONAL spelling for the three-seed family's agentic-misalignment stores (see meta.additions). `mmlu_full` (added 2026-09-21) is the registry's PROVISIONAL spelling for the Qwen MMLU read at the full 1,531-item width (see meta.additions). `misalign_16k` (added 2026-09-21) is the registry's PROVISIONAL
    spelling for the 16,384-step re-draws of the agentic-misalignment ladder (see meta.additions). `misalign_ladder` (added 2026-09-22) is the registry's PROVISIONAL spelling for the completion-cap MERGES of the agentic-misalignment ladder (see meta.additions). `misalign_paired_allmodels` (added 2026-09-22) is the registry's PROVISIONAL spelling for the paired-write difference-ReLU agentic roots of the other model families
    (see meta.additions). `bon_native4096:llama8b_relu_paired` (added 2026-09-22) is the registry's PROVISIONAL spelling for the Llama paired-write native 4,096 best-of-N grades (see meta.additions). `ctl_neg1` (added 2026-09-25) is the registry's PROVISIONAL spelling for the control-negative battery -- the batch-64 seed CONTROL objects at -1 on qwen35_4b, steered-only standups anchored on the seed standups' `none` (see
    meta.additions). `static_padding` (added 2026-09-23) is the registry's PROVISIONAL spelling for the padded static single-shot conditions on qwen35_4b, filed on padded instruments (migration 0012; see meta.additions). `em/organisms/qwen35_4b_org` and `em/organisms/qwen35_4b_org_vendor` (added 2026-09-17) are the only names here the PAPER has not declared: the registry declares them provisionally so the Qwen EM organism
    rows are attributable, and their `meta.additions` entries carry `provisional: true` with `paper_build_commit: null` instead of a pin that would not be evidence about them.

