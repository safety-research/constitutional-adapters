  # paper-companion-repo PIPELINE-TEST models (the authors' rule for the served
  # ids): the model KEY is the served model_id itself (view_legacy_prefix; the served gemma id is `gemma4_31b`, no `_it` suffix), the fit
  # checkpoint is `<key>_base` (transfer_kind base_to_instruct), and the PHASE VIEWS the roster carries for a test model register under
  # `<key>_<view>` (scripts/sdfbase/full22/common.sh f22_registry_register key_tag=$KEY_$VIEW): `u0` (the unsteered-first wave: none + the two
  # prompted instructions), `s1` (the LoRA group), `s2` (the residual group: the refusal direction + the three ReLU steers), `d0p75` /
  # `d0p75_relu` (the strength ladder at 0.75 -- the LoRA family / the relu_steer family, each in its own unit). `s1` / `s2` here are STANDUP
  # GROUPS (the two-server topology for MLP-bearing LoRA sets), NOT fit seeds -- the opposite reading from `qwen35_4b_s<s>` above; this
  # work fits ONE seed, so every fitted object the s1 / s2 / d0p75 views serve is seed 1 (fit_replicate_label s1; u0 serves no fitted object).
