# ---------------------------------------------------------------------------------------------------- fit-target overrides (si_id -> fit_target_kind + role; PR-3d fit_sidecars reads `fit_target_overrides`)
# the 24 `candsi__{A10,B3,C16}__*` objects are KL distillations from a CANDIDATE system
# instruction (train_budget_meta.json si_id + teacher_forward precomputed_topk, no data_mode) -- an earlier draft wrongly listed
# candsi A10 as a document corpus. Their teacher texts are not on main: si_texts.yaml `candidate_texts` seeds A10 / B3 /
# C16 from the candidate-si-screen snapshot (text_source block; file sha256 ba8efe82ece5a35a97e558e31ca9c2660c220bc3677a02193e4b4a126560d60e).
# `object_role` follows each text's OWN category in that snapshot (A10 safety, B3 constitution, C16 irrelevant) -- the
# same rule the paper's SIs use (si_kind -> role) -- rather than the shorthand `role safety` for all three: the
# candidate-SI screen ran one winner per category, and filing a constitution / irrelevant teacher's distillation as
# `safety` would be a wrong fact no test catches (recorded in the landing report; a one-field edit here overrules it).
fit_target_overrides:
  - {legacy: "A10 | candsi__A10", fit_target_kind: system_instruction_distillation, fit_teacher_si_id: A10, object_role: safety, paper_label: other, citation: "candsi A10|B3|C16 -> system_instruction_distillation; candidate_sis.snapshot.json entry A10 category safety, family hierarchy_attack_shaped (the candidate-SI sweep's safety winner; paperlib ARMS si_safety note: 're-basing on the sweep winner A10')"}
  - {legacy: "B3 | candsi__B3", fit_target_kind: system_instruction_distillation, fit_teacher_si_id: B3, object_role: constitution, paper_label: other, citation: "candsi A10|B3|C16 -> system_instruction_distillation; candidate_sis.snapshot.json entry B3 category constitution, family values_and_why (a 166-word compression carrying the priority structure); role from the snapshot's category, not the mapping's shorthand"}
  - {legacy: "C16 | candsi__C16", fit_target_kind: system_instruction_distillation, fit_teacher_si_id: C16, object_role: irrelevant, paper_label: other, citation: "candsi A10|B3|C16 -> system_instruction_distillation; candidate_sis.snapshot.json entry C16 category irrelevant, family comparisons_and_recommendations; role from the snapshot's category, not the mapping's shorthand"}

