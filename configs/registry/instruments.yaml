# configs/registry/instruments.yaml -- seed of the results registry's `instrument` table (database schema >
# `instrument`: the DECLARED measurement setting per eval). ONE canonical entry per eval.
# The eval battery comprises the canonical runs only (the authors' rule; every number verified against
# code, run records or server logs on 2026-09-11), PLUS the known superseded instruments, each `paper_status:
# superseded` with the ruling that retired it.
#
# Citation convention: see models.yaml header. instrument_id here is a DESCRIPTIVE seed id; the schema's PK is the
# sha256 of the canonical fields, derived by the adapter.
#
# Decode columns point at decode_policy_seed.yaml by `policy_ref` (one per served model; the instrument itself is
# model-independent in its declaration, the policy row supplies the numbers) -- `decode_policy_refs` lists the
# refs the instrument resolves per model. `token_cap_ladder_json` is the ladder the instrument climbs;
# `ladder_promotion_rule` quotes cap_ladder.TRIGGER_RULE; `read_at` says which rung the paper reads.
#
# Vocabulary additions this seed needs (README known gaps): scoring_rule `ifeval_checker` (rule checker, not one of
# the spec's nine), `judge_score_mean` (Petri 1-10 mean); harness `bespoke_sisteer` used for the served
# static / BoN / over-refusal drivers and the MMLU letter read.

schema_version: 1
seed_of: instrument
base_commit: 1d2da110
ladder:
  rungs: [512, 1024, 2048, 4096, 8192, 16384]
  ceiling: 16384
  trigger: "escalate iff n_truncated / n > 0.01 and cap < 16384; truncated = at cap AND not degenerate (loop: 4-gram repetition ratio > 0.5 over the whole text or the last 200 whitespace tokens) AND no sibling draw terminated; loops are NEVER redrawn"
  trigger_history: "the GSM8K paper-object wave's 3 % exception was REVOKED by the authors on 2026-09-11 and its (1 %, 3 %] cells re-laddered; any artifact predating that states which trigger produced it"
  source: "src/sisteer/capeval/tiers/cap_ladder.py CAP_LADDER (l.149), CAP_CEILING (l.150), AT_CAP_SHARE_THRESHOLD 0.01 (l.152), TRIGGER_RULE (l.164-165); docs/cap_ladder.md"

