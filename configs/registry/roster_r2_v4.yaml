      CLOSED BY ENTRIES ON A COMPARISON FAMILY OF THEIR OWN (lever B). control_relu / constitution_relu (object_kind relu_steer) were
      fitted and run on all four families, but v1-v3 declared them on qwen35_4b_it's figQ blocks only (v3 gap_4(d): PSR out of the main
