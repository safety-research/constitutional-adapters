# roster_r2_v4.yaml — roster v4 for paper round r2 (2026-09-21). v3 plus (a) 252 ADDITIVE entries on a comparison family of their own:
# ten `figR_<panel>_absolute/{transfer_kind}` blocks (+ their base->instruct companions) declaring the ReLU-steer objects control_relu +
# constitution_relu on gemma4e4b_it / llama8b_it / nemotron3nano4b, for the registry notebook's all-model appendix (v3 kept them Qwen-only,
# gap_4(d); Qwen's own ReLU-steer cells are already selected under the figQ_* comparisons and stay there); and (b) TWO
# instrument-selector corrections to the live instrument facts: evals.bigcodebench_200 (harness evalplus -> inspect_evals; + item_set
# bigcodebench_200, caps [4096, 16384]) and evals.math500 (harness inspect_evals -> inspect_ai; + item_set math500_500). A selector is part
# of an entry's uuid5 identity, so the 372 v3 entries carrying those two evals are re-minted and their v3 ids stay behind as stale entries
# (the stale-entry class; no version / withdrawal on roster_entry). The rulings file (rulings_r2_v4.jsonl) is v3's byte for byte - in particular
# the authors' six-arms exclude r2v1-exclude-relu_steer-main-figures is untouched: it names the comparisons a ReLU-steer run may
# not enter (fig1..fig5, figA_*_absolute/*, figS_*, gap_map), which is WHY the new entries live under figR_* and not on the figA_* blocks
# (a draft on figA_* matched 343 runs and selected none; lever B). Provenance: the authors' request
# with cell-level evidence. What v4
# adds, what it corrects, what it measured in a dry run against the live database, and what it deliberately does NOT do is in
# meta.addendum_2026_09_21_v4. Everything below that block is v3's.
#
# roster_r2_v3.yaml — roster v3 for paper round r2 (2026-09-20). v2 (= v1 with roster_version v2, loaded live 2026-09-20 01:31Z) plus 202
# ADDITIVE entries that close the paper-frame selection gaps: no v2 entry changes identity (0 new
# phantom gaps; the 84 stale v1 entries remain), the rulings file is v2's with ONE machine-match correction (rulings_r2_v3.jsonl:
# r2v1-exclude-fig5-defence-axis-bon-multiturn gains match.eval_ids; see meta.addendum_2026_09_20_v3.ruling_match_correction),
# and every new block / sub-block carries `reason` + `extra_json.why` naming the gap it closes and the ruling or pin line that justifies
# it. What v3 adds, and what it deliberately does NOT (gaps whose lever is a ruling or an adapter, not a roster entry), is in
# meta.addendum_2026_09_20_v3. Everything below that block is v1's transcription of the paper build at 409972276032d945db6a3a43da57bb8921dd65e1.
#
# roster_r2_v1.yaml — roster v1 for paper round r2. LOADABLE: `registry roster load` expands it (adapters/roster.py).
#
# Made loadable from the 2026-09-16 draft: the schema-gap items of roster_transcription_notes.md §8 are mapped onto the schema
# additions — strength_rule `ladder:<record_id>` (the AlphaSteer rungs), `drawn` (gap-map-required but not drawn), transfer_kind
# `not_applicable` (the EM organisms), object_role `baseline_published` (Arditi / AlphaSteer); eval ids are written in the paper's
# spelling here and mapped to the registry's by `vocabulary.eval_id_from_eval_legacy` at load. The rulings seed is rulings_r2_v1.jsonl.
#
# TRANSCRIBED FROM THE PAPER BUILD AT ONE SHA, read from the COMMIT (git show), never the working tree:
#   paper checkout : paper/  (branch paper-figures; read-only, another session's)
#   sha read       : 409972276032d945db6a3a43da57bb8921dd65e1   (committed 2026-09-16T22:00:19Z)
#   read at        : 2026-09-16T22:29:20Z   (working tree was DIRTY: config.py/figs.py/load.py/make_paper_notebook.py modified,
#                    lane_strength_mmlu.py untracked - see roster_transcription_notes.md §0 and §7)
#   registry tree  : 1d2da110 (origin/main)
#   procedure      : roster_transcription_notes.md (symbols read, column mapping, disagreements, expansion rule)
#
# SHAPE. Declarative: each `comparisons[]` block is ONE figure call of make_paper_notebook.py at that sha, and its roster_entry set is the
# cross product  models x objects x evals x strength_rules  of the block, modified by its `exceptions[]`. This is exactly how the build
# enumerates its own required cells (paperlib/gaps.py required_cells), and the expanded totals reproduce GAPS.md's counts at this sha
# (fig1 320, fig2 320, fig3 288). The section-5.1 tool expands the blocks into roster_entry records (uuid5 over the canonical entry
# payload) at the sha named for the parity check. Vocabulary is the registry schema's (model / object / eval / instrument /
# judgment); the paper's own words live only in *_legacy fields.
#
# Every block carries source_citation (paperlib symbol @ sha) and inferred. inferred: true at block level means every expanded entry
# is inferred; inferred: true on an objects[]/evals[]/exceptions[] item means only the entries it touches. Each inferred item names its
# reason; the notes' §1 lists the disagreements first, §6 the rest.

