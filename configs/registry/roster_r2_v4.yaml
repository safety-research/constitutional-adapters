      draft of v4 put a `relu_steer_all_families` sub-block on the ten figA_* blocks; the dry run showed those entries MATCH 343 of the 575
      ReLU-steer runs on the three families (463 run-entry pairs) yet every run kept reading not_in_roster with comparison_ids_json [] -
