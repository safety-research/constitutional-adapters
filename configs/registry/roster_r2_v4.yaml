      roster entry cannot outrank a comparison-scoped exclude and a comparison-scoped include is inert in the flag (`decisive` skips
      comparison scopes). THE LEVER: that ruling is the authors' and stays byte-identical; its own scope_note says it decides WHICH
      COMPARISONS the covered runs enter, never a run's paper flag - and the all-model appendix is a comparison the authors asked for, so
      it gets an id family of its own, outside every glob: figR_attacks_absolute, figR_overrefusal_absolute, figR_petri_absolute,
      figR_capability_absolute, figR_misalignment_absolute, each as `/{transfer_kind}` over the three families' paper-lane rows (gemma /
