      llama base_to_instruct, nemotron carried; sets.relu_appendix_companion_models) - fifteen ids in all. QWEN IS NOT IN THIS SET: the
      registry notebook's main-figure reader filters on selection_state alone, so a new Qwen ReLU-steer selection here would add rows to
      arms it already draws and silently move their values; Qwen's control_relu / constitution_relu cells are already selected under the
      figQ_* comparisons (187 runs live), and the appendix asks for the three other families' cells - a first cut of this family carried
      Qwen on both variants and the dry run showed 6 Qwen runs newly selected, which this removes. `R` is the ReLU-steer set, on the figQ_
      pattern (a set with its own roster that the paper's own notebook does not draw); `_absolute` because these are the appendix's
      absolute panels, the figA_* shapes. tests/test_registry_roster.py evaluates every figR_* id against every comparison glob of every
      comparison-scoped exclude in rulings_r2_v4.jsonl with SQLite's own GLOB (the matcher `matched` / `covered` use), so a rename cannot
      fall back under the exclude unnoticed. Objects [control_relu, constitution_relu]; strength operating_point; a fitted object's entry
      names the transfer kind the run was served under, and the families differ - gemma carries both instruct_direct and base_to_instruct
      fits; llama carries base_to_instruct only (r2_export view llama8b, relu_native llama8b_base) plus instruct_direct em/agentic rows;
      nemotron its one chat_checkpoint - hence both a paper-lane block and a companion per panel (the notebook pulls the other transfer
      kind's rows when the paper lane has none). Evals per panel are the figA panel's, with two deliberate edges: figR_petri_absolute adds
      petri_pooled (the pooled score is fig3_misalign's column and the appendix table reads it); figR_capability_absolute lists [mmlu,
      gsm8k] only - the two capability evals run for the ReLU steer on every family; math500 / ifeval / bigcodebench_200 / bfcl_200 were
      never run for these objects (absent) and declaring them would add gap entries for cells nobody plans. common_exceptions apply
