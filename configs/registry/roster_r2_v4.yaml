      the floor rows. Roster entries select through the evals' instrument selectors and leave the floor rows to their rulings - confirmed
      in the dry run below. PIN EVIDENCE EITHER WAY: paperlib.config @ c53ae173 keeps ctl_psr / const_psr in NEVER_DRAWN_ARMS and out of
      FIG2_ARMS (assert 'PSR is out by default'), so no figure of the paper's own notebook draws them; the figR_* comparisons are the
      registry notebook's (paper/notebooks/registry_nb.py, the all-model appendix cells @ d98d6907), which gates rows on selection_state
      (registry_nb.in_view), never on comparison ids. Rulings decide before roster matches, so every standing exclude / hold-out /
      supersede over these objects stays in force.
    gap_2_bigcodebench_selector: >
      SELECTOR CORRECTION (evals.bigcodebench_200.instrument_selector_json). v1-v3 said harness evalplus (the transcription named the
      sandbox scorer's lineage, not the runner) while every bigcodebench run in the registry - adapters/bcb_bfcl.py l.343, lane sources
      bcb_bfcl_200 / bcb_bfcl_200_widen, seed instrument bigcodebench_200_protocol_greedy_4096 - carries harness inspect_evals, item_set
      bigcodebench_200, scoring_rule pass_at_1_sandbox, thinking off, at token cap 4096 (gemma / qwen; llama instruct_direct) or 16384
      (nemotron; llama base_to_instruct), so no bigcodebench run matched any entry and the complete four-model-figure cells read
      not_in_roster (gemma x six arms on instruct_direct; difference_lora + none on llama, nemotron, qwen: 12 cells in the table of cells
      the notebook could not draw, 13 in the earlier count). v4 sets harness inspect_evals, adds item_set bigcodebench_200 and caps
      [4096, 16384] (the two caps the live rows carry - a cap outside the list is a new instrument decision and reads as a gap, never a
      silent admission), keeps scoring_rule and thinking_mode. bfcl_200's selector (harness bfcl_eval, its own override) already matched
      and is unchanged. Registry selector after the correction: {harness: inspect_evals, item_set_id: bigcodebench_200, scoring_rule:
      pass_at_1_sandbox, thinking_mode: off, token_cap_tokens: [4096, 16384]}. Rows the entries match but that stay out by other rules:
      gemma's base_to_instruct fitted rows (r2v1-supersede-instrument-coding-modelcard matches every gemma base_to_instruct bigcodebench
      / bfcl run, decode source or not); the first-lane model_card rows; a re-run's earlier attempt (lifecycle superseded, placeholder:*
      run-scoped supersessions); qwen's base_to_instruct difference_lora (r2v1-exclude-qwen-batch8-base-checkpoint-originals). The qwen x
      difference_lora x bigcodebench_200 hold-out stands.
    gap_3_math500_selector: >
      SELECTOR CORRECTION (evals.math500.instrument_selector_json). v1-v3 said harness inspect_evals (the task is inspect_evals' `math`,
      but the registry's harness vocabulary names the RUNNER, and adapters/math500.py l.200 stamps inspect_ai, as does the seed
      math500_inspect_thinking_on_16384_onepass). Every math500 run in the registry - gemma / qwen / nemotron / llama alike (and the
      descoped glm46vflash) - carries harness inspect_ai, item_set math500_500, cap 16384, scoring_rule sympy_equiv, thinking on (llama
      not_available), so the spelling does NOT differ by model and ONE selector serves all four: v4 sets harness inspect_ai and adds
      item_set math500_500; caps [16384] and scoring_rule stay; thinking_mode stays the prose note (llama's rows carry not_available; a
      filter would drop them), so it is not a selector field. This gap was first scoped to nemotron3nano4b's 6 cells (the only math500
      cells the four-model figures drew), but math500 was not_in_roster on EVERY model for the same reason (the scoped notebook-gap
      table: gemma 6, qwen 6, nemotron 6, llama 6 cells), and the one correction admits them all. Registry selector after the
      correction: {harness: inspect_ai, item_set_id: math500_500, scoring_rule: sympy_equiv, token_cap_tokens: [16384]}.
    not_a_roster_matter: >
      Gap 4 (strongreject_bon from bon_stores: fitted-object rows carry is_operating_point NULL at strength 1.0, so the operating_point
      rule fails them - 4 four-model-figure cells) is a reader stamp in the bon_stores adapter (v3 gap_4(b) class); no entry here can
      admit a run whose is_operating_point is NULL. Likewise the llama r2_export xstest / or_bench_hard judgments of the ReLU-steer
      objects carry n_items_judged NULL (the emission defect v3 gap_3 named for petri), so those 4 cells cannot meet the coverage
      predicate whatever the roster says.
    dry_run_2026_09_21: >
      MEASURED against the LIVE database read-only (head 146,449; 10,412 runs). Method: a scratch root (init, migrate, dimensions load,
      roster load --version v4: 5,738 of the 6,370 entries land; the 632 pinned-object entries of alphasteer_rebake and the batch-64
      constitution_lora dependency-block on object rows a seedless root lacks and were inserted from the loader's payloads so the
      comparison is clean), its roster_entry table ATTACHed to a read-only connection of the live database, and the live v_roster_match /
      v_paper_current SQL re-created as TEMP views with `roster_entry` swapped for the scratch table; runs, rulings, judgments and the open
      round the live ones; the live v_paper_current materialised at the same head as the baseline. Baseline (live): 2,896 runs selected.
      v4: 3,075 selected (29,821 run-entry matches). PER-RUN DIFF live vs v4: 457 runs change state, every one of them a ReLU-steer run on
      gemma / llama / nemotron (343: 141 not_in_roster -> selected, 202 -> superseded) or a bigcodebench / math500 run (114: 38 ->
      selected, 68 -> superseded, 8 -> excluded); 0 runs selected live lose selection; 0 runs outside those two sets change. QWEN: 0 figR_*
      match rows on any Qwen run; Qwen's ReLU-steer runs are IDENTICAL live and v4 (selected 187, excluded 62, not_in_roster 165,
      superseded 131, withdrawn 48); the only Qwen runs that change are the selector corrections' - bigcodebench: none x2 and
      difference_lora (instruct_direct) -> selected, difference_lora (base_to_instruct) -> excluded (batch-8 ruling), 6 earlier attempts ->
      superseded; math500: none / safety_si / constitution_si -> selected, constitution_lora / control_lora / difference_lora
      (base_to_instruct) -> excluded (batch-8 ruling), arditi -> superseded (phaseG), alphasteer_rebake -> excluded (out of round), 7
      earlier attempts -> superseded. GAP 1: 115 of the 124 target cells select (gemma 40, llama 38, nemotron 37; 0 selected cells outside
      the target list; the selected runs carry the figR_* comparison ids only, nemotron's both its chat_checkpoint and companion id). The 9
      misses are reader matters: 4 strongreject_bon cells (gemma x2, nemotron x2) whose cap-4096 bon_stores rows carry is_operating_point
      NULL while their cap-512 floors read superseded; 4 llama xstest / or_bench_hard cells whose r2_export judgments carry n_items_judged
      NULL (v3 gap_3's emission defect), so the coverage predicate cannot be met; 1 nemotron constitution_relu gsm8k cell that exists only
      as greedy-512 rows (superseded by r2v1-supersede-instrument-gsm8k-greedy512; no thinking-on run). FLOOR ROWS of the ReLU set on the
      three families: the greedy-512 / greedy-4096 static and the cap-512 BoN rows read 60 superseded, 114 not_in_roster, 30 withdrawn -
      NONE selected; by decisive ruling: static-greedy 33 superseded / 24 not_in_roster, overrefusal-greedy512 20 / 30 (+20 withdrawn),
      bon-512-floor 7 / 7, multiturn-greedy512 0 / 33 (cap 512 is outside the multi-turn selector's caps, so they never match). All 575
      ReLU runs on the three families: 141 selected, 202 superseded, 192 not_in_roster, 40 withdrawn. GAP 2: 12 of the 12 bigcodebench
      (model, object) cells in the table of cells the notebook could not draw select (17 runs: gemma's six on instruct_direct; llama none
      at cap 4096 (instruct_direct) AND 16384 (base_to_instruct), the two transfer kinds' own anchors, and difference_lora on both kinds;
      nemotron none + difference_lora at 16384; qwen none on both kinds + difference_lora on instruct_direct); earlier attempts superseded
      (placeholder:* run-scoped supersessions), gemma's base_to_instruct difference_lora superseded by
      r2v1-supersede-instrument-coding-modelcard. An earlier count gave 13 cells; the CSV carries 12. GAP 3: math500 selects 6 of 6
      shared-arm cells on gemma4e4b_it, llama8b_it and nemotron3nano4b each and 3 on qwen35_4b_it (none, safety_si, constitution_si; the
      fitted objects excluded by r2v1-exclude-qwen-batch8-base-checkpoint-originals). ROSTER GAPS: 2,418 of v4's 6,370 entries have no
      selected run and no disposition (82 of them figR_*: the 9 misses' cells across both transfer kinds, the transfer kinds a family has
      no ReLU fit on, and evals never run for an object), against 2,562 live today for v3's entries; after the load the 372 re-minted v3
      ids join the 84 earlier stale entries.
  expansion_rule: >
    entries(block) = { (comparison_id(model), model, object, eval, strength_rule) : model in block.models, object in block.objects,
    eval in block.evals, strength_rule in block.strength_rules } with block.exceptions applied (remove / add / override / annotate),
    where comparison_id(model) = block.comparison_id_template with {transfer_kind} = the model's transfer_kind in this block.
    instrument_selector_json and judge_selector_json come from evals.<eval_id> (below) unless the block's eval item overrides them.
