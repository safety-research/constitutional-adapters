      relu_steer_distilled_difference], paper_labels [control_relu, constitution_relu, difference_relu, safety_relu], comparison_ids
      [fig1_headline/*, fig2_jailbreak/*, fig3_misalign/*, fig4_transfer, fig4_organism, fig5_frontier/*, figA_*_absolute/*, figS_*,
      gap_map]}) removes every matched comparison whose id GLOBs one of those patterns from a ReLU-steer run in v_paper_current's `matched`
