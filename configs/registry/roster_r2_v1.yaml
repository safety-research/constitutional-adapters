# roster_r2_v1.yaml — roster v1 for paper round r2. LOADABLE: `registry roster load` expands it (adapters/roster.py).
#
# Made loadable from the 2026-09-16 draft: the schema-gap items of roster_transcription_notes.md §8 are mapped onto the schema
# additions — strength_rule `ladder:<record_id>` (the AlphaSteer rungs), `drawn` (gap-map-required but not drawn), transfer_kind
# `not_applicable` (the EM organisms), object_role `baseline_published` (Arditi / AlphaSteer); eval ids are written in the paper's
# spelling here and mapped to the registry's by `vocabulary.eval_id_from_eval_legacy` at load. The rulings seed is rulings_r2_v1.jsonl.
#
# TRANSCRIBED FROM THE PAPER BUILD AT ONE SHA, read from the COMMIT (git show), never the working tree:
#   paper checkout : paper/  (branch paper-figures; read-only, another session's)
#   sha read       : 409972276032d945db6a3a43da57bb8921dd65e1   (committed 2026-09-16T22:00:19Z)
#   read at        : 2026-09-16T22:29:20Z   (working tree was DIRTY: config.py/figs.py/load.py/make_paper_notebook.py modified,
#                    lane_strength_mmlu.py untracked - see roster_transcription_notes.md §0 and §7)
#   registry tree  : 1d2da110 (origin/main)
#   procedure      : roster_transcription_notes.md (symbols read, column mapping, disagreements, expansion rule)
#
# SHAPE. Declarative: each `comparisons[]` block is ONE figure call of make_paper_notebook.py at that sha, and its roster_entry set is the
# cross product  models x objects x evals x strength_rules  of the block, modified by its `exceptions[]`. This is exactly how the build
# enumerates its own required cells (paperlib/gaps.py required_cells), and the expanded totals reproduce GAPS.md's counts at this sha
# (fig1 320, fig2 320, fig3 288). The section-5.1 tool expands the blocks into roster_entry records (uuid5 over the canonical entry
# payload) at the sha named for the parity check. Vocabulary is the registry schema's (model / object / eval / instrument /
# judgment); the paper's own words live only in *_legacy fields.
#
# Every block carries source_citation (paperlib symbol @ sha) and inferred. inferred: true at block level means every expanded entry
# is inferred; inferred: true on an objects[]/evals[]/exceptions[] item means only the entries it touches. Each inferred item names its
# reason; the notes' §1 lists the disagreements first, §6 the rest.

meta:
  schema: sisteer.registry.roster/1
  roster_version: v1
  round_id: r2
  paper_round:
    round_id: r2
    opened_utc: "2026-09-10T00:00:00.000Z"      # the paper's one-lane-per-family rule by the authors and the first figure roster (config MODELS comment, 2026-09-10); date-only in the source
    opened_utc_precision: date
    closed_utc: null
    description: "constitutional-adapters paper, round 2 (full22 wave + lanes); roster v1 transcribed from paper-figures"
    paper_build_commit: "409972276032d945db6a3a43da57bb8921dd65e1"
  paper_build_branch: paper-figures
  paper_build_commit_utc: "2026-09-16T22:00:19Z"
  transcribed_utc: "2026-09-16T22:29:20Z"
  read_method: "git show 409972276032d945db6a3a43da57bb8921dd65e1:paper/<path>"
  registry_worktree_sha: "1d2da110c361d17b1cf57792d7bb8ac5a8317bd4"
  r2_export_seen_at_read:
    note: "the build reads whichever export is live (load_r2 refuses a torn pair but pins no build); the parity gate must pin one"
    sources_json_built_utc: "2026-09-16T21:56:26Z"
    n_rows: 10742
    n_sources: 241
    gaps_md_at_sha_built_from: { built_utc: "2026-09-16T00:30:22Z", n_rows: 10295 }
  producer_records_read:
    - { path: "$GRADE/alphasteer_f22_defense/alphasteer_operating_points.json", sha256: "282c864486928e668335d58ab611e762d3028f3af48d95e97c2f4becd1dd0025", mtime_utc: "2026-09-14T21:44:43Z" }
    - { path: "$GRADE/arditi_strength/battery_curves.json", sha256: "e0952334c2e237b248db7cac9f930dd95bdcea2705a1c5de9ac3d1f15367ea8e", bytes: 448689 }
  addendum_2026_09_17:                          # the authors' paper-inclusion criteria - rulings_r2_v1.jsonl
    post_pin_additions_f33dca5d: [r2v1-exclude-not_run_by_design-qwen-alphasteer_rebake-agentic_leaking, r2v1-include-qwen-b2i-leaking-cross-engine-admission-native-relu,
                                  r2v1-include-qwen-arditi_allpos-ar_c0p3-served-operating-point]   # + the fig5 source-preference ruling's scope text refreshed for strength_lane_base2it_native_mmlu; catchup.md item 3
    rulings_added: [r2v1-exclude-qwen-batch8-base-checkpoint-originals, r2v1-exclude-qwen-distilled-relu-difference-pending-relu-comparison,
                    r2v1-include-qwen-batch64-seed-replicates-fitted, r2v1-include-qwen-batch64-seed-replicates-derived,
                    r2v1-operating_point-qwen-arditi_allpos-c0p3-user-override, r2v1-exclude-qwen-arditi_allpos-other-rungs,
                    r2v1-include-qwen-bon-vendor_preset-new-instrument, decode-qwen-vendor-preset-bon-multiturn-petri-2026-09-17]
    seed_replicates_need_no_new_entries: >
      the roster keys an object by (paper_label, object_kind, transfer_kind [, object_role, fit_model_id, object_id_prefix]) - never by
      fit_replicate_label - so the fifteen batch-64 Qwen seed replicates (base64s<s>__{constv2-mix-full,constv2ctl2-full}__{lora_r4_ce,psr_ce_all},
      derived_base64s<s>__constv2-mix-full__lora_r4_ce_minus_ctl; s in 1..3) match the EXISTING qwen35_4b_it base_to_instruct entries of every
      block (constitution_lora / control_lora / difference_lora / constitution_relu / control_relu) once their object rows carry those labels; each
      seed is its own object, so the per-seed rows are distinct runs on one entry (v_seed_spread groups them on fit_replicate_label). Their matched
      arms (none, safety_si, constitution_si at s = 1..3) match the same entries as today's.
    arditi_allpos_not_a_roster_object: >
      the paper at 5884fbb6 draws `arditi_allpos` ("Refusal steer", object_type vector, cell arditi_allpos) and RETIRED the prefill-only
      `arditi` arm (2026-09-17); `arditi_allpos` is not a PAPER_LABELS value at this tree, so it is not an `objects:` entry here (the loader
      refuses a label outside the vocabulary); its c = 0.3 operating point rides `objects.pins.arditi_allpos_operating` and an annotation on
      the qwen35_4b_it `arditi` entries below, and the rulings match it on object kind (vector_all | vector). Re-transcribe at the gate sha.
  expansion_rule: >
    entries(block) = { (comparison_id(model), model, object, eval, strength_rule) : model in block.models, object in block.objects,
    eval in block.evals, strength_rule in block.strength_rules } with block.exceptions applied (remove / add / override / annotate),
    where comparison_id(model) = block.comparison_id_template with {transfer_kind} = the model's transfer_kind in this block.
    instrument_selector_json and judge_selector_json come from evals.<eval_id> (below) unless the block's eval item overrides them.
  entry_id_rule: >
    roster_entry_id = uuid5(NAMESPACE_ROSTER, canonical JSON of {round_id, comparison_id, model_id, object_id | object_selector_json,
    eval_id, instrument_id | instrument_selector_json, judge_selector_json, strength_rule}); the tool mints it, the draft carries none.
