    fig5_frontier/base_to_instruct: 462
    figA_attacks_absolute: 256
    figA_attacks_absolute/base_to_instruct: 256
    figA_overrefusal_absolute: 64
    figA_overrefusal_absolute/base_to_instruct: 64
    figA_petri_absolute: 192
    figA_petri_absolute/base_to_instruct: 192
    figA_capability_absolute: 192
    figA_capability_absolute/base_to_instruct: 192
    figA_misalignment_absolute: 76
    figA_misalignment_absolute/base_to_instruct: 64
    figQ_jailbreak: 200                          # both lanes
    figQ_misalignment_capability: 180            # both lanes; 100 drawn + 80 gap-map-only capability columns
    figQ_transfer: 228
    figQ_frontier/instruct_direct: 168
    figS_bon_curves: 32
