    "chat-ckpt": chat_checkpoint
    "base→instruct": base_to_instruct
    "prompted-only": prompted_only               # the export's lane for llama8b_shortconst / _fullconst; R2_VIEW_TO_PAPER_LANE re-stamps shortconst to instruct-direct for si_constitution
    "em-organism": not_applicable                # the EM organisms are checkpoints, not model+object
  paper_label_from_arm_legacy:                   # legacy_spellings; config.ARMS keys
    none: none
    si_safety: safety_si
    si_constitution: constitution_si
    si_constitution_full: constitution_si_full
    ctl_lora: control_lora
    const_lora: constitution_lora
    diff_lora: difference_lora
