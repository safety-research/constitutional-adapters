# Registry-side declaration of graded multi-turn roots no producer lane file names (multiturn_grades adapter, EMISSION_VERSION 4).
#
# The `multiturn_grades` reader enumerates roots from the producer's lane files (`transfer_stats_full22_*.json` meta.roots); a root
# the producer never wrote into a lane file is invisible to it. This file is the registry's own declaration of such roots: it is read
# as a sha'd input of the `_lane_files` group (a change here republishes the declared groups), never edits anything on the mirror, and
# every root it declares is REFUSED by name if a lane file also names it (each root is declared by exactly one file).
#
# A declared root whose store's grading_provenance.json carries a REFUSED harness attacker-identity check is filed ONLY under a
# ruling: `attestation.ruling_id` must be a ruling on the registry's record log (`<root>/rulings/`), `attestation.kind` must be
# `independent`, and the store's own independent check must be UNIFORM and attest the same attacker quantization the declaration
# names. Every row the reader files from such a root carries `extra.attacker_attestation` (source independent, the ruling id, the
# evidence below) and the attacker fields' `field_confidence_json` entries marked `attested_independently`.
#
# The authors' rule: the two run-2 cells are accepted via a ruling -- filed
# the ruling that accepts the independent attestation (attacker quantization 'none', UNIFORM across shards, from
# configs/sdfbase_full22_<target>.yaml's attacker block + WAVE_MANIFEST.json attacker_pool) over the harness's REFUSED
# attacker_identity_check (attacker_quantization 'unrecorded', a pre-cutover sidecar), and declare the two roots so the
# multiturn_grades reader discovers them ... carry the provenance on the rows (attested independently, not by the harness) so a
# reader can see it."
#
# Paths under `run_state` are relative to the run-state root (`$STATE/run-state/full22`); cluster
# paths are spelled `<cluster>:<absolute path>`.
