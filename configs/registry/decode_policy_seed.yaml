# configs/registry/decode_policy_seed.yaml -- seed of the results registry's `decode_policy` table (database
# schema" > `decode_policy`: THE authority for sampling parameters) and of the `sampling_mode_policy` mapping
# not published
#
# ONE ROW PER (model, eval-or-category, thinking_mode, sampling MODE) the harness resolves today. Every number traces
# to a citation; none is invented. `policy_ref` = `<model_id>|<eval_or_category>|<thinking>|<mode>`; exactly one row
# per (model, eval-or-category, thinking) carries `is_default_for_lookup: 1` (`resolve(mode=None)` returns it; an
# eval row wins over a category row -- C18).
#
# `decode_source` uses the SPEC vocabulary (generation_config | vendor_recommendation | model_card | vllm_default |
# greedy | grandfathered_T1 | runner_forced_T1 | unverified). The plan's extra label `legacy_contracts_row` (Qwen's
# 0.7 / 0.95 / 20 `card` row that matches no vendor row) is carried as `legacy_contracts_row: true` on a
# `model_card` row, never as a new source value (README vocabulary notes).
#
# `seed_rule` uses DECODE_SEED_RULES (vocab.py): the label names the CLOSURE the decode seed is derived from -- `per_item`,
# `per_draw`, `per_goal_turn` (the multi-turn target: (seed_base, goal, turn)), `per_scenario_turn` (Petri's target turns:
# (seed_base, behaviour, scenario_id, turn)), `per_response` (the misalignment runner: (seed_base, family / behaviour, item,
# sample)), `fixed`, `none`, `unverified`. Strictness
# a label naming the closure beats `per_item` + a free-text `seed_rule_detail`; a `seed_rule_detail`
# carries provenance (the seed base, the row's scope, history), never the rule itself.
#
# `params_not_sent` lists every sampler key the request OMITS and what the engine resolves it to (spec
# `params_not_sent_json` / `decode_resolved_json`). vLLM 0.25.1 fills an omitted temperature / top_p / top_k / min_p /
# repetition_penalty from the served model's generation_config.json or the composed --override-generation-config,
# else its neutral defaults (temperature 1.0, top_p 1.0, top_k 0 = disabled, min_p 0.0, repetition_penalty 1.0);
# presence_penalty and frequency_penalty are OpenAI-protocol fields defaulting to 0.0 and can never be a server
# default (contracts.SERVER_DEFAULTABLE_SAMPLING_KEYS). At temperature 0 vLLM resets top_p / top_k itself.
#
# Wildcard rows (`model_id: "*"`) are the harness's MODEL-INDEPENDENT settings (contracts.GREEDY_SAMPLING is one row
# for every model; PROTOCOL_SAMPLING_BY_TASK is per task and model-independent): the adapter expands `*` over every
# model in models.yaml with paper_status in_paper or descoped.
#
# `effective_from_utc` carries the RULING DATE at midnight UTC with `effective_from_confidence: date_only` -- the
# tree records dates, not times, for these rulings.

schema_version: 1
seed_of: decode_policy
base_commit: 1d2da110

rulings:
  decode-bon-T1-grandfathered-2026-09-11: "BoN at temperature 1.0 (with generation_config top_p / top_k) is grandfathered: the estimand is a function of sampling diversity across 75 draws and every family's store was drawn at 1.0 (configs/sdfbase_full22_roster.yaml bon_climb_temperature 1.0)"
  decode-nemotron-top_p-1.0-static-2026-09-14: "Nemotron's user-supplied top_p 1.0 in the static and over-refusal sampled lanes is canonical; the shipped 0.95 is what NEW work (IFEval) uses; the paper's decode column shows two labelled presets and owes no reconciliation. Plan §4.1 names this ruling id with date 2026-09-14; configs/sdfbase_sampled_decode.yaml records 'ruled canonical 2026-09-11' and configs/sdfbase_shipped_generation_config.json _doc 'Why this exists (2026-09-11)' -- the id is the plan's, the date discrepancy is recorded in README"
  decode-qwen-server-default-2026-09-11: "Qwen3.5's instruct-general vendor row is pinned as the vLLM SERVER DEFAULT (contracts.SERVER_DEFAULT_SAMPLING_BY_MODEL -> --override-generation-config, PR #34) so an omitted key resolves the same way on every model; presence_penalty rides per request only"
  decode-agentic-runner-T1-2026-09-11: "the agentic-misalignment runner's explicit temperature 1.0 is the grandfathered instrument: fine as run, no rerun"
  decode-generation-config-default-2026-09-11: "Decode at the model's shipped generation_config.json, pinned by revision; never an invented number; a sent key beats the file, the file fills only what the request omits (the authors' rule; sisteer.eval.sampled_decode makes the vendor preset the drivers' default)"
  decode-multiturn-cap4096-generation-config-2026-09-11: "the 4,096-cap multi-turn re-runs send nothing per turn but max_tokens -- each model's own shipped decode as a MECHANISM, never a per-model table in the driver (src/sisteer/eval/attacks/target_decode.py docstring)"
  decode-thinking-card-rows-2026-09-09: "thinking_card = the vendor's shipped generation_config.json where one exists, Qwen's thinking 'precise' row where none ships; general = Qwen's thinking 'general' row; battery = the live sampled battery's presets (contracts.py THINKING_SAMPLING_BY_MODEL_KEY comment block)"
  decode-protocol-rows-2026-09-11: "Each benchmark's OWN reference decoding, per task and model-independent (BigCodeBench greedy T 0; BFCL T 0.001 under the pinned clamp override)"
  decode-vendor-preset-mode-2026-09-12: "ifeval-canonical-battery P3 / P4 / P43: vendor_preset = the shipped decode row per model, RE-READ 2026-09-12 from the cluster A cohort cache; nemotron runs the shipped 0.95 (P43 SETTLED)"
  decode-bon-vendor-preset-2026-09-17: "Best-of-N decodes at EACH SERVED MODEL'S VENDOR PRESET -- the same row the sampled static lane sends (Qwen's presence_penalty 1.5 rides the request; it can never be a server default) -- replacing the grandfathered temperature 1.0 for every NEW draw (the authors' rule). The per-draw seed rule (bon_seed) and the augmentation are untouched: the attack's diversity is the augmentation, not the temperature. Every existing store was drawn at 1.0 under the <model>|bon|off|grandfathered_T1 rows, which are SUPERSEDED (retrievable by explicit reference, never the default: bon_served.BON_HARNESS_DEFAULT names them to finish such a store); a climb re-draws at the sampler its 512 store records (bon_climb.CLIMB_DECODE as_drawn; the roster's bon_climb_decode), never a constant, and a native pass draws at the vendor preset like any new store, so a store and its climb are never at different samplers"
  decode-nemotron-vendor-preset-0.95-2026-09-17: "Nemotron's vendor preset is the SHIPPED generation_config.json row (temperature 1.0, top_p 0.95): counting the instruments where a Nemotron cell is compared across the arms the paper contrasts (no intervention, the two system-instruction arms, refusal steering), 0.95 is used by six (multi-turn, Petri, IFEval, GSM8K, MATH-500, capability) and 1.0 by two (the sampled static jailbreaks, over-refusal). Nemotron is NOT re-run: an AUTHORITY / LABEL change, not a re-measurement -- 0.95 is the family's preset for anything new (the nemotron3nano4b|bon|off|vendor_preset row restates it), and the two existing panels keep 1.0 as a DECLARED DEPARTURE rather than as the preset's definition. The static / over_refusal defaults are RE-POINTED (vendor_preset@v1 -> @v2, 2026-09-17, under the authors' rule that a decode-policy row is the default for NEW work while what a run sent belongs to the run and the instrument -- the instrument refs pin @v1 explicitly, so no run is re-described); configs/sdfbase_sampled_decode.yaml's preset row is PENDING a schema follow-up (configs/registry/README.md 'Pending 2026-09-17'): the yaml's deliberate_departure machinery declares a PRESET's departure from the shipped file and refuses a declaration whose preset equals the file (tests/test_preset_vs_shipped_generation_config.py test_a_stale_declaration_fails), and the sixteen main-view sampled configs are the frozen instrument of runs that happened at 1.0 (tests/test_sdfbase_full22_sampled.py MAIN16_SHA256_LIVE)"
  decode-qwen-vendor-preset-bon-multiturn-petri-2026-09-17: "The native seed-replicate battery sends the Qwen vendor instruct row (temperature 0.7 / top_p 0.8 / top_k 20 / min_p 0.0 / repetition_penalty 1.0 / presence_penalty 1.5, all six per request plus a per-request seed) on every TARGET request. This ruling binds the two TARGET rows the battery adds beside the filed stores' defaults: the 4,096-cap multi-turn targets (crescendo / pair / actorattack; the attackers keep their own rows) and Petri's target turns (1024 per turn; auditor / judge on their own rows). As first bound, neither was the default for its key (the server_default and vllm_default rows stayed the defaults of the filed stores); a same-day amendment makes BOTH the defaults for their keys (is_default_for_lookup 1) and the old defaults, qwen35_4b_it|multi_turn|off|server_default and qwen35_4b_it|petri|off|vllm_default, superseded (is_default 0, superseded_by_policy_id -> the vendor row), kept by name so every filed store still reads its own row by_ref; a reading across a filed store and a vendor-row run is a sampler_check DIFFER, never a pooling. Best-of-N at the vendor preset is the same day's decode-bon-vendor-preset-2026-09-17 (every served model's <model>|bon|off|vendor_preset row, THE default for strongreject_bon), which binds qwen35_4b_it|bon|off|vendor_preset ONCE; the reading of that row as a NEW instrument (max_tokens 4096, no 512 store / climb, 100 goals x 75 draws, a per-draw replicate_v1 seed; NOT comparable with the grandfathered T = 1.0 rows) is the include ruling r2v1-include-qwen-bon-vendor_preset-new-instrument. Ruling row decode-qwen-vendor-preset-bon-multiturn-petri-2026-09-17 in rulings_r2_v1.jsonl (provenance relayed)"
  decode-vendor-preset-default-2026-09-17: "The authors' rule (the registry's reading not yet confirmed by the authors): the vendor presets are always used unless specifically instructed otherwise. A STANDING rule over every decode default: an is_default_for_lookup 1 row is mode vendor_preset unless a ruling id on the row instructs otherwise -- tests/test_registry_decode_defaults_vendor.py enumerates the instructed exceptions (the thinking_card rows of decode-thinking-card-rows-2026-09-09, the protocol rows of decode-protocol-rows-2026-09-11, the agentic runner's grandfathered T = 1.0 of decode-agentic-runner-T1-2026-09-11, the multi-turn sends-nothing generation_config rows of decode-multiturn-cap4096-generation-config-2026-09-11, Qwen's server-default route of decode-qwen-server-default-2026-09-11, the MMLU greedy letter-logprob read of the canonical battery) and lists BY NAME the defaults that are neither vendor nor excused (the `card` rows, the Petri generation_config rows, the Llama em_organism T = 1.0 row), which stay as filed until the authors rule per row. First bound row: qwen35_4b_it|em8q|off|vendor_preset@v1, THE default for the EM MODEL ORGANISMS panel's em8q family (three Qwen3.5-4B organisms x the campaign's objects, lens path). The finding that motivated it: em8q silently kept T = 1.0 while the agentic families moved to the vendor preset (misalign_proxy.sbatch vendor mode explicitly skipped em8q); on the T = 1.0 organisms panel (qwen35_4b_org) the CLEAN model hit the 600-token cap on 57.8 % of answers and the steered arms read 17-51 % of answers at judge coherence <= 50 with no organism present -- object damage and decode damage not separable. Vendor and T = 1.0 get SEPARATE ROOTS ($SHARED/exp/misalign_org_vendor/<target> vs $SHARED/exp/misalign_org/<target>): a decode change is a different measurement, never a rerun into the same tree; the switch is EM_ORG_SAMPLER (default vendor; t1 reproduces the record rung, whose row qwen35_4b_it|em8q|off|t1_record@v1 is SUPERSEDED, non-default, retrievable by name). Ruling row decode-vendor-preset-default-2026-09-17 in rulings_r2_v1.jsonl"
  decode-llama-thinking-not-available-2026-09-18: "the authors ruled that, for a model with no thinking channel, a Llama-8B run filing thinking_mode not_available and a decode_policy row keyed thinking_mode off are matched, with any resulting true duplicates or ambiguity to be reported. Expressed as DATA, never as a matcher rule: every llama8b_it row keyed `off` (the nine explicit rows and the seven wildcard rows expanded onto llama8b_it) gains a sibling row identical in every parameter (the six numbers, params_sent / params_not_sent, seed_rule, max_new_tokens_rule, decode_source, is_default_for_lookup, effective_from_utc, supersession) keyed `not_available`, policy_ref <model>|<eval-or-category>|not_available|<mode>, same_values_as the `off` row (loader-checked), bound to this ruling. The matcher (v_run_decode_policy_match) keeps comparing thinking_mode strictly; the 320 Llama runs that filed not_available against off-keyed rows (sdfbase_full22 180, alphasteer_f22_rebake 79, relu_native 36, arditi_strength 25 on the 2026-09-18 dry run) match their twin. Duplicates / ambiguity: a twin is in scope only for runs filing not_available, its `off` row only for runs filing `off`, so no run sees both; within the not_available key the twins mirror the `off` key's one-candidate structure with ONE named exception -- the IFEval twin llama8b_it|ifeval|not_available|vendor_preset shares its key's scope with the pre-existing CATEGORY row llama8b_it|capability|not_available|card (same 0.6 / 0.9, per_item), so a Llama IFEval run filing not_available has two in-force candidates and the matcher (which weighs an eval row and a category row equally, unlike resolve() where the eval row wins) reads ambiguous; no live run hits it on 2026-09-18 and the `off` arm has no such pair (tests/test_registry_decode_llama_thinking_na.py enumerates the twins, proves one candidate per probe for the other fifteen in both arms, and pins this one by name as KNOWN_AMBIGUOUS; it is the same eval-row-vs-category-row structure behind the 50 pre-existing MATH-500 ambiguous runs and is a matcher-level question). Dry run over the live database (7,345 runs, read-only): exact 3,673 -> 4,030, ambiguous 50 -> 50 (no new pair), no_match 460 -> 103. tests/test_registry_decode_defaults_vendor.py judges a twin as its `off` row (the twin is the same decode decision re-keyed, never a new default): the unexcused-default list is unchanged. Ruling row decode-llama-thinking-not-available-2026-09-18 in rulings_r2_v1.jsonl (provenance user_direct)"
  decode-vendor-default-all-evals-2026-09-21: "The authors' rule: the existing misalign jobs may continue at T = 1, but treating T = 1 as the default misreads the rule -- the vendor preset is the default unless the authors explicitly overrule it. So the VENDOR PRESET is the default decode for EVERY eval family, agentic misalignment included: the agentic-misalignment runner's T = 1.0 default (decode_source runner_forced_T1, ruling decode-agentic-runner-T1-2026-09-11) was a MISINTERPRETATION of the 2026-09-17 standing rule, not an exemption from it. Applied as DATA, never as a relabel or a re-run: (1) every `<model>|agentic|<thinking>|vendor` row is THE default for its key (is_default_for_lookup 1) -- the qwen35_4b_it and qwen35_9b_it rows are flipped, and rows are ADDED for gemma4e4b_it, glm46vflash, nemotron3nano4b and llama8b_it (+ the Llama not_available twin), each stating the six numbers its `<model>|static|off|vendor_preset` row already carries (same_values_as, loader-checked; Nemotron: the @v2 shipped 0.95 of decode-nemotron-vendor-preset-0.95-2026-09-17), the misalign runner's spelling `vendor` (SAMPLER_VENDOR resolves `<model>|agentic|<thinking>|vendor@v1` by exact ref); (2) every `<model>|agentic|<thinking>|runner_forced_T1` row is NON-DEFAULT (is_default_for_lookup 0) but NOT superseded and NOT deleted: it remains the recorded policy every existing agentic run matched by parameters (temperature 1.0 alone sent; no top_p / top_k), keeps matching them (v_run_decode_policy_match reads no default flag), and the existing T = 1 jobs may finish under it; (3) the same by analogy for em_organism (instruments.yaml cites the T1 rows 'by analogy'): llama8b_it|em_organism|<thinking>|vendor is the default, llama8b_it|em_organism|<thinking>|runner_forced_T1 non-default. A future vendor agentic run is a NEW root ($SHARED/exp/misalign_vendor/<target>), never a re-run into the T1 tree; the misalign_seedrep instruments (minted from the record with runner_forced_T1) are untouched; nothing is re-run or relabelled. Legibility: the paper views carry decode_family_default_policy_id / decode_is_family_default beside decode_policy_match (migration 0009), so a T1 run reads 'exact, non-default'. Ruling row decode-vendor-default-all-evals-2026-09-21 is filed with `registry ruling add`; the T1 ruling's own text stands (fine as run, no rerun) -- what it no longer does is name a default"
  decode-bon-canonical-T1-pipeline-test-models-2026-09-29: "The two PIPELINE-TEST models follow the PAPER's canonical best-of-N -- the grandfathered temperature-1.0 512-store + 4,096-climb instrument bon_512store_4096climb_T1, the ONE canonical strongreject_bon instrument the roster's `bon` selectors name (the authors' rule) and the shape reproduce/06_eval_waves.sh submits (target_static.sbatch families=bon -> the 512 store; bon_climb.sbatch -> the 4,096 climb). Each served test model therefore gets a `<model>|bon|off|grandfathered_T1` row mirroring qwen35_4b_it's (temperature 1.0 sent; top_p / top_k from the shipped generation_config.json; params_sent [temperature, max_tokens, seed]; decode_source grandfathered_T1), referenced from that instrument's decode_policy_refs, so job-start registration of a BoN run binds a canonical instrument instead of refusing by name. Like the paper models' rows since decode-bon-vendor-preset-2026-09-17 the row is NON-default and superseded by the model's `<model>|bon|off|vendor_preset` row (THE default for new draws; retrievable by explicit reference as bon_served.BON_HARNESS_DEFAULT). For THESE two models the two samplers coincide numerically: the harness default sends temperature 1.0 and lets top_p / top_k resolve from generation_config.json ({0.95, 20} / {0.95, 64}), which is exactly the vendor-preset row -- so the wave's default `--bon-decode-preset vendor_preset` draws the canonical instrument's sampler and files the vendor row's id; the two vendor-preset BoN instruments (bon_native4096_vendor_preset, bon_512store_4096climb_vendor_preset) stay `sensitivity` (r2v1-include-qwen-bon-vendor_preset-new-instrument is not overruled). Supersedes the 2026-09-29 seed's 'no grandfathered_T1 sibling' note on the two vendor rows."
  decode-qwen35-35b-a3b-shipped-generation-config-2026-09-29: "The two PIPELINE-TEST models decode at THEIR OWN shipped generation_config.json, pinned by revision, under the repo's standing rule (decode-generation-config-default-2026-09-11: decode at the model's shipped generation_config.json, pinned by revision, never at an invented number) and the standing vendor-preset default (decode-vendor-preset-default-2026-09-17; decode-vendor-default-all-evals-2026-09-21). Qwen/Qwen3.5-35B-A3B @ 59d61f3ce65a6d9863b86d2e96597125219dc754 SHIPS one -- unlike the 4B: temperature 1.0, top_p 0.95, top_k 20, do_sample true, and NO presence_penalty / repetition_penalty / min_p key (a row carries EXACTLY the keys the file names, so the 4B's card rows with presence_penalty 1.5 are the 4B's, never this model's); google/gemma-4-31B-it @ 842da3794eaa0b77d5f08bae87a17459d91ff475 (served model_id gemma4_31b) ships temperature 1.0, top_p 0.95, top_k 64 (byte-identical to gemma-4-E4B-it's file). Both read from the primary cluster's shared HF cache on 2026-09-29 (sha256 in configs/sdfbase_shipped_generation_config.json; the same three keys in configs/sdfbase_sampled_decode.yaml presets.qwen35_35b_a3b / presets.gemma4_31b). Rows per model: `<model>|{static, over_refusal, multi_turn, petri}|off|vendor_preset` (category rows), `<model>|bon|off|vendor_preset` (eval strongreject_bon), `<model>|agentic|off|vendor` (the misalign runner's exact-ref spelling, runner.vendor_policy_ref), `<model>|gsm8k|on|vendor_preset` (GSM8K is the battery's one thinking-ON eval; the same file -- the vendor publishes no thinking-specific row for these checkpoints, so thinking-ON reuses it exactly as gemma4e4b_it|gsm8k|on|thinking_card reuses gemma's single preset), and EXPLICIT `<model>|mmlu|off|greedy` / `<model>|bigcodebench|off|protocol` / `<model>|bfcl|off|protocol` rows stating the wildcard rows' numbers (same_values_as a served model's expanded row, loader-checked) because the adapter expands `*` over in_paper / descoped served models ONLY (dimensions.served_model_ids) and these models are paper_status reference. Deliberately NOT seeded: an IFEval row (not in the pipeline test's battery); `card` / `thinking_card` / `general` / `battery` rows (the 4B's vendor-card readings; nothing comparable was published for these checkpoints and nothing is invented); sampling_mode_policy rows (the contracts.py tables are the legacy tinycap route these models never take, and tests/test_registry_decode_policy_entry_points.py pins those tables to their oracle -- the pipeline resolves decode from the registry). No run has been drawn under any of these rows at seeding time; stage 06 draws them"
  decode-multiturn-vendor-row-sends-six-keys-2026-09-30: "For the qwen35_35b_a3b pipeline test (re-scoped 2026-09-30): the two PIPELINE-TEST models' `<model>|multi_turn|off|vendor_preset@v1` rows STATE and SEND all six sampling keys. The multi-turn TARGET's registry path (src/sisteer/eval/attacks/target_decode.py registry_vendor_row -- the seed-replicate battery's contract, VENDOR_ROW_SENT_KEYS = decode_policy.PARAM_KEYS) refuses a vendor row that does not send every one of temperature / top_p / top_k / min_p / repetition_penalty / presence_penalty: presence_penalty is not a server-defaultable key (contracts.SERVER_DEFAULTABLE_SAMPLING_KEYS -- the OpenAI-protocol field defaults to 0.0 and vLLM never fills it from a generation config), so a request that omits a key is pinned by the server's configuration, not by the row. Every multi-turn target unit of the first qwen35_35b_a3b launch died after its ~20-minute standup (2026-09-30 16:02Z): first on the job plan's unversioned ref (the stage-06 fix: the job plan composes the ref through target_decode.vendor_preset_policy_ref), and behind it -- surfaced by that fix's execution-form test -- on this row's five-key params_sent ('does not SEND [min_p, repetition_penalty, presence_penalty]'). The ingest matcher (README 'decode_policy match'; decode_match.no_match_reasons) has the mirror rule: a run that sends a key the row leaves null matches nothing, so a six-key-sending driver could never match a three-pinned row. RESOLUTION -- an in-place edit of @v1, no new version: the three keys the shipped generation_config.json does NOT name (re-read 2026-09-30 over ssh from EVERY cached snapshot of both models on the primary cluster: Qwen/Qwen3.5-35B-A3B sha256 4f25002776b741773666203dcea8f54619f177ace3ae483d311102092a4658e0 and google/gemma-4-31B-it sha256 d4226bbe3117d2d253ba4609720ba82c6c4ce4627a9a6ae05387c78983ac03de each name exactly temperature / top_p / top_k / do_sample) are stated and sent at the values the engine resolves when a request omits them -- the values these rows already recorded under params_not_sent: min_p 0.0 and repetition_penalty 1.0 (vLLM's neutral defaults; contracts.GREEDY_REFERENCE_RESOLVED / check_protocol_effective) and presence_penalty 0.0 (the OpenAI-protocol default). No number is invented and no decoded sampler changes: a request carrying the six keys decodes at exactly the numbers a five-key request did on this vLLM; what changes is that the request, not the server, now pins them. Why an EDIT of @v1 and not a @v2: (a) no run was ever drawn under either row (every multi-turn driver refused before writing a byte; the job-start registrations of those units are re-minted by the funnel); (b) the six decoded numbers are unchanged, and the one precedent bump (nemotron3nano4b|static|off|vendor_preset@v2, 2026-09-17) was minted because a NUMBER moved after panels had run under @v1; (c) the battery contract pins the exact ref `...@v1` (target_decode.VENDOR_PRESET_POLICY_VERSION = 1), so a @v2 row would be unreachable by the driver's composer and would leave @v1 refused as superseded. The temperature / top_p / top_k provenance stays the 2026-09-29 ruling's (the shipped file). `same_values_as` the static row is dropped from these two rows: the loader compares all six stated numbers, and the static / over_refusal / bon / petri / agentic / gsm8k rows keep the file's three (their harnesses send what their rows say; this model's completed static t0 / t1 runs are registered under the static row and are not re-described). The other served models' multi-turn rows are untouched: qwen35_4b_it's already sends the six (its card's numbers), and the paper models' sends-nothing generation_config rows are what their filed waves sent. Pinned by tests/test_registry_multiturn_vendor_row_sends_six_keys.py: the driver's own resolver on the job plan's exact ref against the committed export, for both test models and for qwen35_4b_it; the unversioned and a foreign model's ref still refused by name"
  decode-thinking-card-mapping-pipeline-test-models-2026-09-30: "For the qwen35_35b_a3b pipeline test (2026-09-30): the two PIPELINE-TEST models get a `sampling_mode_policy` entry (model_key, thinking_card) -> `<model>|gsm8k|on|vendor_preset`, because the GSM8K front door (scripts/sdfbase/gsm8k/g8k_cells.py front-door facts: arm `on` -> sampling_mode `thinking_card`, the row from reproduce/models.yaml serve.generation_config) launches scripts/served_capability_run.py with `--sampling thinking_card`, and the driver resolves the row ITSELF through contracts.sampling_for -> THINKING_SAMPLING_BY_MODEL_KEY = this table's thinking_card mapping; a model with no mapping refuses by name ('has no verified sampling row'), which is what all three gsm8k units of the first qwen35_35b_a3b launch died on (809518 / 809522 / 809525) once the driver's model-key pin was fixed to read geometry.ONBOARDED_MODEL_HF_IDS. WHICH row: the thinking_card rule (decode-thinking-card-rows-2026-09-09) takes the vendor's shipped generation_config.json where one exists and Qwen's thinking 'precise' card row only where none ships; both test models SHIP one (sha256 in the rows), so the row is the shipped file's -- the existing `|gsm8k|on|vendor_preset` row, no new policy row, no new number. THE CARDS WERE READ (2026-09-30, hub README.md at each pinned revision, sha256 in the rows): the Qwen3.5-35B-A3B card DOES state thinking-mode sampling (general 1.0/0.95/20/min_p 0.0/presence_penalty 1.5/repetition_penalty 1.0; precise coding 0.6/0.95/20/0.0/0.0/1.0), which CORRECTS the 2026-09-29 prose 'the vendor publishes no thinking-specific row for this checkpoint' -- recorded on the row, numbers unchanged, the card's presence_penalty 1.5 NOT taken under the rule; the gemma-4-31B-it card states one configuration across all use cases (1.0/0.95/64 = the file). The planner's row (models.yaml serve.generation_config) and the registry row state the same three numbers, so the front door's --expect check and the driver's hashed identity agree. An in-place addition to the mapping table (no policy row changes version; no run was drawn under either row before the mapping). The rows' ruling_id stays decode-qwen35-35b-a3b-shipped-generation-config-2026-09-29 (the numbers' ruling)."
  decode-qwen35-4b-demo-mirrors-4b-rows-2026-10-09: "Ruling of 2026-10-09: the public reproduction recipe's worked example declares no eval and no preset of its own -- it is the paper's Qwen3.5-4B checkpoint under the same pins (models.yaml qwen35_4b_demo re-pins qwen35_4b_it's repo and revision), so it runs the paper's instruments (the sampled static families, best-of-N, the three multi-turn attacks, over-refusal, the Petri instruments, GSM8K including its thinking-ON row) under the paper's presets. Applied as DATA, never as a matcher rule: every explicit `qwen35_4b_it|...` row gains a `qwen35_4b_demo|...` twin identical in every parameter (the six numbers, params_sent / params_not_sent, seed_rule, max_new_tokens_rule, decode_source, is_default_for_lookup, effective_from_utc; a superseded 4B row's twin is superseded by the twin of the same successor), same_values_as the 4B's row (loader-checked), bound to this ruling; every instruments.yaml decode_policy_refs entry naming a 4B ref names the twin beside it, so jobplan.canonical_instrument mints the SAME instrument record for the worked example (a twin states the 4B's sent numbers, so its instrument record hashes to the 4B's identity and the loader merges the two into one record whose extra.model_ids lists both keys); the five (qwen35_4b, mode) sampling_mode_policy entries gain (qwen35_4b_demo, mode) twins so contracts.sampling_for resolves the key's modes (the GSM8K front door's thinking_card). The `*` wildcard rows still expand over the served models only (paper_status in_paper / descoped), so this `reference` key gets nothing from them; of the wildcard-bound evals the recipe runs only MMLU (reproduce/lib/stage.py FAMILIES; a front-door key registers it natively under mmlu_letter_prefill_full_1531), so the key carries ONE explicit greedy row `qwen35_4b_demo|mmlu|off|greedy` (same_values_as the served models' expansion, as the two pipeline-test models' rows do), named by the full 1,531-item instrument only -- never the 200-item one, so the key stays unambiguous where the paper's served models are not; the greedy controls and the BigCodeBench / BFCL protocol rows have no twin and the planner refuses them by name (BigCodeBench / BFCL are not in the recipe's families). Tests: tests/test_registry_seeds_demo_instruments.py"
  decode-bon-canonical-T1-live-non-default-2026-10-14: "the authors: canonical best-of-N STAYS the temperature-1.0 512-store + 4,096-climb instrument bon_512store_4096climb_T1 (the authors' rule; configs/registry/instruments.yaml, unchanged). Therefore the nine `<model>|bon|{off,not_available}|grandfathered_T1` rows -- the five served models', the two pipeline-test models', the worked example's twin and the Llama not_available twin: the rows that instrument's decode_policy_refs name and whose numbers its draws send (temperature 1.0 alone; top_p / top_k from the served model's generation config) -- are LIVE and NON-DEFAULT: superseded_by_policy_id cleared, is_default_for_lookup 0 kept, so every `<model>|bon|off|vendor_preset` row stays THE default resolve() returns (bon_served.bon_policy) and a vendor-preset draw keeps matching it. Why: the 2026-09-17 supersession (decode-bon-vendor-preset-2026-09-17; restated for the test models by decode-bon-canonical-T1-pipeline-test-models-2026-09-29 and for the twins by their rulings) made the matcher (v_run_decode_policy_match: a superseded row is a candidate only for a run generated before its successor took effect) read every draw of the canonical instrument after that date as no_match once its sent set is recorded -- decode HISTORY applied as a matcher rule. Applied as DATA, never as a matcher rule or a relabel, on the precedent of the agentic runner_forced_T1 rows (decode-vendor-default-all-evals-2026-09-21: non-default, NOT superseded, the recorded policy every existing run matched by parameters; the matcher reads no default flag; new work resolves the vendor sibling): no view, migration, instrument or run changes; a run matching a grandfathered row reads exact with decode_is_family_default 0 (migration 0009), a vendor-preset draw exact with 1; decode_precedence (ruling r2v4-reference-bon-climb-decode-precedence-vendor-preset-over-t1) reads the same kinds as before, from the matched policy id. Paper selection never reads decode_policy_match (v_paper_current only projects it), so no paper row moves. The loader now STATES superseded_by_policy_id on every decode_policy row (null where the seed names none), because the reducer keeps a column an event omits -- before this, dropping the pointer from the seed changed nothing in the database. Tests: tests/test_registry_decode_history.py"

