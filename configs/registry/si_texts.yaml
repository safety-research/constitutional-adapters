# Known-but-unresolvable here (README known gaps):
#   * candidate-SI texts A1 / A2 and the other 54 screen entries (`candsi` lane): loaded from the snapshot above under the
#     env-guarded loader SISTEER_LOAD_CANDIDATE_SIS -> sisteer.data.candidate_sis on the candidate-si-refit lineage (origin/
#     candidate-si-refit), NOT on main (configs/sdfbase_full22_roster.yaml lane_flags.candsi.blocker); the lane flag is
#     OFF, so no full22 cell serves them. A1 IS safety_refusal (paperlib: 'both ... use instruction A1'; the snapshot's A1
#     hashes to its sha). A10 / B3 / C16 -- the three that objects distil -- are rows (`candidate_texts` above); the
#     other entries have no object and no row, so their prefix hashes met in a manifest REFUSE by name.
#   * the document-corpus pseudo-instructions (constv2-mix-full, constv2ctl2-full, ...): registered through the SI slot
#     of the `<si>__<arm>` cell grammar (instructions.py l.505-520) but 'NOT system instructions: their text is never
#     rendered into any example ... never used as a prompted baseline' -- they are `fit_corpus_id` values on `object`,
#     not `si_text` rows (fit_target_kind corpus_document_fit).
#   * anti_safety_refusal (SAFETY_SI.anti_text): a pseudo-SI id used only as the two_si generation's `neg`; not a row.
