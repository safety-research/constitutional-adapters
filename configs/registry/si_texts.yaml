# configs/registry/si_texts.yaml -- seed of the results registry's `si_text` table
# `si_text`: every system instruction or constitution text an object distils or a prompted object declares; the
# text itself lives at `source_uri`, not in the row).
#
# Citation convention: see models.yaml header. `si_text_sha256` is the sha256 of the EXACT rendered text bytes
# (utf-8 of `Instruction.text`), computed 2026-09-16 on the grading host from src/sisteer/data at base_commit 1d2da110
# (`PYTHONPATH=src .venv/bin/python -c 'from sisteer.data import instructions as I; ...'`); the
# 16-hex prefix of each equals the `prompted_prefix_hashes` every Petri manifest pins (H8: the served path
# verifies the SI bytes per request), which is the cross-check that these are the bytes the stores saw.
# `si_token_count_by_model` holds only counts RECORDED in the tree (C27); every other model's count is
# `unverified` until a CPU tokenisation pass fills it.
#
# Source-file shas on disk NOW (sha256sum, 2026-09-16):
#   src/sisteer/data/instructions.py    540c9703066e14617f44ba7e2e818cd60904ab45a1761cf410bf06294803ad5c
#   src/sisteer/data/safety_texts.py    ee14ba6d63e58d93bcd20d56c0e225d60998fabf305372bf2e0766adde206a9c
#   src/sisteer/data/constitution_full.md 82f88c5532e4939e1f9f8494c22917f5ca38fb846dfefc97867bd72fa001c3e7

