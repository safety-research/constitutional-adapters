    dataset_version: "JailbreakBench/JBB-Behaviors@886acc352a31533ffbcf4ef22c744658688086fc"
    n_items: 100
    items_sha256: unverified
    source_uri: "configs/sdfbase_full22_gemma4e4b.yaml bon.goal_subset: jbb (l.350); datasets.jbb (l.273-277)"
    item_id_scheme: "JBB behaviour id"
    subsample_rule: fixed_ids_file
    pairing_note: "the JBB half of the 259-goal eval set ('--confirmatory still sizes it (100 ...)', config l.347); BoN's value is diversity across 75 draws, so it runs on 100 goals rather than 259 at best-of-29 for the same spend (config l.334-339)"
    held_out_of_fit: 1
    confidence: inferred
    inferred_reason: "n=100 (100 JBB goals) from the config comment; datasets.jbb.harmful_subset reads 50 -- how 50 becomes the 100-goal BoN subset is not read from code (possibly 50 per stratum x 2, or the full 100 harmful behaviours); listed as a contradiction in README"
