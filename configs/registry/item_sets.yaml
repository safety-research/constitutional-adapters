  # The FULL-suite siblings (capeval-full-tasks;
  # sources `bigcodebench_full` / `bfcl_full`, adapters/bigcodebench_full.py / bfcl_full.py). Each is the WHOLE population of its 200 sibling's
  # pin, no seed, pinned by id in its own file (configs/capeval/tasks/bcb_full.json / bfcl_full.json at the producer tree 8ba0b48cf; the file sha256
  # below). NEW item sets, so NEW instruments (bigcodebench_full_protocol_greedy_4096 / bfcl_full_protocol_T0001_1024): never pool or difference a
  # 200 row with a full row. `items_sha256` here is contracts.ids_sha256(pin["ids"]) -- the sha256 of the canonical JSON list of the pin's ids in pin
  # order, the digest the store's manifest.tinycap.<key>_full_item_set.ids_sha256 carries -- NOT cellstore's newline rule (mmlu_1531) and NOT the pin
  # file's bytes; a reader compares the mirrored pin's digest and count to these two values and refuses every store on a disagreement.
  - item_set_id: bigcodebench_full_1140
    eval_id: bigcodebench
    dataset_version: "bigcode/bigcodebench@b74c0d0bf70d2c0bc459be537895cca163007f1a, split v0.1.2 COMPLETE: every one of the 1,140 rows (ids BigCodeBench/0..1139; the 148 Hard ids INCLUDED, listed beside in the pin)"
    n_items: 1140
    items_sha256: c309c92f137762955c16f8546e0ff9b1e84577f854fbba022904e493e3198a07
    items_sha256_rule: "contracts.ids_sha256(pin['ids']): sha256 over the canonical JSON list of the pinned ids in pin order (the manifest's tinycap.bcb_full_item_set.ids_sha256; NOT the newline rule mmlu_1531 uses, NOT the pin file's bytes); computed from configs/capeval/tasks/bcb_full.json at 8ba0b48cf (2026-09-24)"
    pin_file: "configs/capeval/tasks/bcb_full.json @ 8ba0b48cf (contracts.BCB_FULL_PIN_PATH); mirrored beside the stores as records/bcb_full.json and named by records/item_sets.json"
    pin_file_sha256: 1aa5f1e4f6476dabad879e5fe8d5ad5eeaa01debd7f693a335d53d5651c4c9f2
    source_uri: "contracts.py CONTROL_BIGCODEBENCH_FULL, BCB_FULL_PIN_PATH, IDENTITY_KEY_BCB_FULL_ITEM_SET, item_set_identity (seed null), load_bcb_full_pin (the producer tree 8ba0b48cf; capeval-full-tasks); tiers/inspect_served.py TaskPlan(item_set='full')"
    item_id_scheme: "BigCodeBench/<n> (position == id suffix); the rows and the outcome record carry the log id str(n)"
    subsample_rule: full
