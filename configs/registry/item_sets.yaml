# configs/registry/item_sets.yaml -- seed of the results registry's `item_set` table
# `item_set`: the exact prompt set, version + subsample).
#
# Citation convention: see models.yaml header. `items_sha256` (over the ordered item ids) is `unverified`
# everywhere: it needs the item files, which live on the clusters / Modal / the paper checkout; the adapter fills it.
# `dataset_version` is `<repo>@<40-hex revision>` where the tree pins one (configs/capeval/pins.yaml, the full22
# config's `datasets` block), else the repo with `revision: unverified`.
#
# subsample_rule vocabulary (spec): full | fixed_ids_file | seeded_sample:<seed> | paired_with:<item_set_id>.
# Two sets need a compound rule (GSM8K paired-200; the 259-goal confirmatory pool); those carry the compound in
# `subsample_rule_compound` and the closest spec value in `subsample_rule`.

schema_version: 1
seed_of: item_set
base_commit: 1d2da110

item_sets:

  # ------------------------------------------------------------------ jailbreak goal pools
  - item_set_id: jailbreak_goals_259
    eval_id: null            # shared by the four static families and the three multi-turn attacks (one row per eval below points here)
    dataset_version: "mariagrandury/harmbench@4aa1f46a9d43e441e238c1d01dc52413094fc84e (test split, standard functional, exclude_copyright) + JailbreakBench/JBB-Behaviors@886acc352a31533ffbcf4ef22c744658688086fc (harmful_subset 50, stratify_seed 0)"
    n_items: 259
    items_sha256: unverified
    source_uri: "configs/sdfbase_full22_gemma4e4b.yaml datasets.{harmbench,jbb} + category_holdout (seed 0, frac 0.33); selection code two_si_run._goal_subset (not read)"
    item_id_scheme: "goal id (harmbench id / JBB id); renellm's corpus keys on 'the original 259 test+JBB goal ids' (static_common.py l.683)"
    subsample_rule: fixed_ids_file
    subsample_rule_compound: "harmbench test (standard, non-copyright) held-out categories under category_holdout seed 0 frac 0.33, UNION the JBB harmful subset -> the 259-goal confirmatory pool"
    pairing_note: "the held-out goal split is frozen at seed 0; re-rolling is a different measurement"
    held_out_of_fit: 1
    confidence: inferred
    inferred_reason: "the 259 count is recorded in many places (configs/sdfbase_full22_gemma4e4b.yaml header, sweep.py l.311, bites_policy.py l.111); the COMPOSITION rule is read off the config's dataset keys, not from the selection code"
    source: "configs/sdfbase_full22_gemma4e4b.yaml l.2 ('over the 259-goal confirmatory pool'), l.266-283 (datasets, category_holdout); static single-shot (259 confirmatory goals) and multi-turn (259 goals)"

  - item_set_id: jbb_goals_100
