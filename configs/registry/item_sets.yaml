    dataset_version: "cais/mmlu@c30699e8356da336a370243923dbaf21066bb9fe ('all' validation: the whole pinned pool, 1,531 rows; the pins name validation + dev, the test split is not in the corpus)"
    n_items: 1531
    items_sha256: 5b1153eae340d07f94c48f6d00ef2ac386842d53db1b70f2bf5fa68453b0fe11
    items_sha256_rule: "sha256 over the ordered item ids joined by a newline (no trailing newline), computed from manifest.mmlu_item_set.item_ids of every one of the 45 served stores of 2026-09-21 (identical in all 45); a reader compares a store's ids to this value and refuses a disagreement (cellstore.mmlu_item_set_attestation)"
    source_uri: "src/sisteer/capeval/tinycap/contracts.py MMLU_FULL_N 1531 / mmlu_item_set(full=True) = {item_set: full, n: 1531, seed: 0, of: 1531} / FLAG_MMLU_FULL (PR #326, tree c326f847eca92c3f850d44b3e3e0c1ae6f83745d); scripts/served_capability_run.py generate --controls mmlu --mmlu-full; the stores' manifest.mmlu_item_set.item_ids"
    item_id_scheme: "m<index>-<content hash>: the index is the item's position in the seed-0 permutation of the pinned pool (m0000-a4973c11, m0001-8d968f47, m0002-0c8338c9, ...); the SAME ids mmlu_200 uses for its first 200"
    subsample_rule: full
    pairing_note: "the head of this list, item for item, IS mmlu_200 (contracts.mmlu_item_set: one permutation, two widths; the head's newline-joined ids hash to 373f1258bf4fcafc..., a prefix of this list). The 200-item read and the 1,531-item read are two instruments on two item sets: never pool them and never difference them"
    head_of:
      item_set_id: mmlu_200
      n_head: 200
      head_ids_sha16: 373f1258bf4fcafc
      rule: "mmlu_200 = the first 200 ids of mmlu_1531 in order (verified 2026-09-21 against the Llama controls mirror's 200-item rows and the 45 full stores' manifests); a consumer must never pool or difference the two sets"
    held_out_of_fit: 1
    source: "contracts.py MMLU_FULL_N / mmlu_item_set / IDENTITY_KEY_MMLU_ITEM_SET / MANIFEST_KEY_MMLU_ITEM_SET (PR #326); the durable mirror's PROVENANCE.md ($STATE/run-state/full22/mmlu_full/)"

