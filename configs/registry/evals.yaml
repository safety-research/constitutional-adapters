# configs/registry/evals.yaml -- seed of the results registry's `eval` table (database schema > `eval`:
# the BENCHMARK only, never a variant of it; every version of GSM8K that ever ran is the SAME eval_id with a
# different item_set_id / instrument_id).
#
# Citation convention: see models.yaml header. `producer_spellings` lists EVERY legacy id found in the tree or the
# paper build, so `identity.split_producer_key` can map a store's eval string onto one eval_id.
#
# `eval_category` vocabulary used here: static | bon | multi_turn |
# over_refusal | capability | petri | agentic | em_organism. paperlib spells the same set as its `component`:
# static / bon / multi-turn / over-refusal / capability / petri / misalignment / em_organism
# (paper/paperlib/config.py::EVALS, EVAL_COMPONENT) -- the hyphenated forms
# and `misalignment` are legacy spellings (legacy_spellings.yaml).
#
# `headline_metric_id` / `metric_direction` follow paperlib/config.py::HEADLINE (per component) and
# src/sisteer/capeval/tinycap/ifeval_contracts.py::PRIMARY_VALUE_KEY_IFEVAL; `paper_status` follows EVALS /
# CATEGORIES.mean_over / the "DROPPED" list.
#
# `headline_metric_ids` (optional, ORDERED; lands in `eval.extra_json`) lists every ACCEPTED spelling of the headline
# when producers file the same estimand under more than one metric id: a consumer takes the FIRST the run files, else
# `headline_metric_id` (paper.headline_metric_ids / paper.run_headline_metric_id; v_item_headline in SQL).
# `headline_metric_id` stays the one declared id (NOT NULL, CHECK-guarded) and should lead the list.

schema_version: 1
seed_of: eval
base_commit: 1d2da110
paper_build_commit_read: "paper working tree (read-only, 2026-09-16); the roster's sha is pinned separately"

