# configs/registry/judges.yaml -- seed of the results registry's `judge` table (`judge`:
# judge_id = sha256 over model, rubric sha, protocol sha, threshold rule; here a human-legible seed id, the adapter
# derives the hash).
#
# Citation convention: see models.yaml header. Two hash conventions exist in the tree and are kept apart:
#   * `rubric_sha16` / `protocol_sha16` -- `sisteer.capeval.manifest.sha256_hex16(canonical_json(...))`, the
#     16-hex digests the over-refusal judge cache rows carry (judging.Rubric.sha, judging.protocol_sha), pinned
#     golden by tests/test_capeval_judging.py::GOLDEN_RUBRIC_SHAS / GOLDEN_PROTOCOL_SHAS.
#   * `rubric_sha256` -- the spec's 64-hex column; `unverified` wherever only a 16-hex pin or no pin exists.
#   * StrongREJECT: the rubric identity is sha256 of the PROMPT CONSTANT's utf-8 text --
#     scripts/judge_batch.py STRONGREJECT_PROMPT (1,182 chars) 282b79aa0a40d816506b70290e878c68d775da11a8c380a38b8569f273ba1778
#     (the sha16 282b79aa0a40d816 is its prefix) and STRONGREJECT_PROMPT_V2 (2,973 chars)
#     c8c98abbac0df19e782466c9d2ffec1a37be2e2f0e37698106b351e52c9d484f; computed 2026-09-17 on the grading host from
#     scripts/judge_batch.py at sha256 7f9aea7ba4d3ad9e9c13b7b284d85c0d1a055f7668a2b73db9b99508035cbbd5 (the text
#     of the constant, not `canonical_json` of a Rubric object -- a different convention from the over-refusal 16-hex pins).
#     The same rubric bytes on two judge models are two `judge` rows that share `rubric_sha256`.
# `judge_role` is the spec's (judge | auditor). The Petri SCENARIO AUTHOR (claude-opus-4-8) is not a judge and is
# recorded on item_sets.yaml petri_scenarios_6x10 instead.

schema_version: 1
seed_of: judge
base_commit: 1d2da110

judges:

