# configs/registry/models.yaml -- seed of the results registry's `model` table (spec
# `model`; `adapters/dimensions.py`).
#
# ONE ROW PER CHECKPOINT AT A PINNED REVISION: the closure over every model an in-scope object or run references
# the paper's eight (four families as instruct + base, nemotron chat, GLM descoped) PLUS the
# two-SI-era fit models and the HPO model, each `paper_status: reference`.
#
# CITATION CONVENTION (every file under configs/registry/): every value carries `source:` = file path + symbol or
# line (repo-relative, at base commit origin/main 1d2da110), or a ruling id / date. A value that is
# INFERRED rather than read from a record carries `confidence: inferred` and `inferred_reason:`; a value nobody has
# recorded is the literal string `unverified` (admitted only with a reason).
#
# SCHEMA NOTES (for the adapter, not resolved here):
#   * `chat_template_sha256` in the spec is a 64-hex sha256 of the template bytes; what the tree RECORDS everywhere
#     (configs/sdfbase_full22_pins.json, every Petri manifest, endpoint.json) is `sisteer.models.chat_template_hash`,
#     a 16-hex `sha256_hex16` digest. Seeded here as `chat_template_hash16`; the 64-hex column is `unverified` until
#     a tokenizer read fills it (the grading host CPU pass, no GPU).
#   * `family` vocabulary in the spec is {gemma4, qwen35, nemotron3, llama31, glm46v}; the closure needs THREE more
#     values (qwen36 for the attacker, qwen38 for the HPO model, llama32 for the two-SI 3B model) -- listed in
#     README.md "known gaps" as vocabulary additions, never silently folded into a neighbour.
#   * `generation_config_json` is the VERBATIM shipped file's sampler keys as pinned in
#     configs/sdfbase_shipped_generation_config.json (read on cluster A 2026-09-11; sha256 + etag recorded there);
#     this seed never re-reads the cluster (task rule: no ssh).
#   * `hf_revision` is the 40-hex snapshot sha; `unverified` where no pin exists in the tree.

