    exclude: [__pycache__, /.pytest_cache, /wandb]
    authority: grading_host_copy
    origin: mixed
    note: "relu_paired.RUN_STATE_ROOT: Modal serving records, the cluster B sampled store, the grading host grades and transcripts (38,387 MB / 87,235 files; caches and wandb logs excluded)"
