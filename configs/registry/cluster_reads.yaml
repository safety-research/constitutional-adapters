# cluster_reads.yaml -- the store COMPONENTS every registered adapter reads, the AUTHORITY of each component's canonical copy, and
# the shard count per adapter.
# Read by `sisteer.registry.stores` (`registry stores mirror|check|status|revalidate|coverage`) and by the cluster-read window.
#
# AUTHORITY (the freshness contract, spec "Interfaces and contracts"; the three values `stores.AUTHORITIES`):
#   cluster_a        the canonical copy IS the generation tree $SHARED/registry/stores/gen/<slug>/current on cluster A, written only by
#                    `registry stores push` (the producer's own push, the transitional carry, or the one-time verified move) and read in
#                    place by the shards through the window's home tree. The grading host holds a VERIFIED MIRROR at `grading_host_mirror` (default:
#                    the base -- a grading host producer's own tree, a frozen store's existing copy, or a registry-owned pull target). Such a
#                    component names its `producer` (grading_host:<session> | cluster | frozen) and, while a grading host producer has not adopted
#                    the push tool, `transitional_carry: true` + `carry_deadline: YYYY-MM-DD`; a producer that writes every few minutes
#                    may declare `min_publish_interval_s`. Components flip to this value only after the one-time move verified them
#                    (a verified-move record per slug) -- NONE has yet (2026-10-04).
#   cluster_a_origin the canonical copy is the producer's ORIGINAL on cluster A and the grading host holds a read-only mirror of it; no copy:
#                    `registry stores check` compares the grading host mirror's manifest with a manifest of the original built on the cluster.
#                    MUST name `original`. Kept as a valid value; no member today.
#   grading_host_copy      the canonical copy is the grading host tree the registry reads today. `registry stores mirror` carries it to cluster A as
#                    an immutable, manifest-addressed GENERATION, verified in full by store_verify.sbatch before `current` is renamed
#                    onto it; a read pins one generation and re-validates the grading host copy against its manifest at admission. Valid during
#                    the transition to `cluster_a`; absent from this file once the transition completes.
#
# COMPONENT SHAPE: `base` (the directory: a site placeholder -- $STATE, $STAGE, $GRADE or $WORK, the site config's value, expanded by
# sisteer.site -- or a home path, `~` = the grading host home), optional `members` (glob patterns relative to base; default the whole
# base), optional `exclude` ("/rel/path" anchored at the base, or a basename pattern matched at any depth), `origin` (where the bytes were
# produced; informational), `note`; for `cluster_a`: `producer`, `grading_host_mirror`, `transitional_carry`, `carry_deadline`,
# `min_publish_interval_s`. Two components may share a base with disjoint members (run-state/full22 and $GRADE below).
# The generation holds the members at their base-relative paths; `home_rel` (base relative to the home) tells the cluster-read task
# where to mount it in the relocated home tree. Unknown keys are refused by name.
#
# ADAPTER ENTRIES: EVERY registered adapter has one -- `shards` + `components`, or `cluster: refused` + `reason` (an adapter that
# cannot read on the cluster; none today). Optional `volatile_roots: [{root, reason}]` names a declared root OUTSIDE the home that
# no component can hold (a /tmp working tree, a volume peek). The component set is DERIVED, never guessed: `registry stores coverage`
# constructs every registered adapter, reads its declared `roots` (never discover(), never a listing) and maps each root to the
# component holding it -- `covered` (inside a member), `restricted` (above the members: the shard's own discovery is the exact check),
# `retired` (outside the home, dropped by the adapter's own inputs_retired), `volatile` (declared here), or UNCOVERED;
# tests/test_registry_store_coverage.py pins this file at zero UNCOVERED, every adapter declared, no entry missing a component.
#
# SHARDS: the six heavy adapters keep the counts measured for their throughput (a shard per 3 min). Every other adapter is sized by the
# rule over its OWN declared roots: >= 4 GB or >= 10,000 files -> 8; >= 500 MB -> 4; else 1 (sizes: a
# one-pass stat walk on 2026-10-04; noted per entry as "<MB> MB / <files>"). A reasoned override is
# noted where it departs from the rule. THE RNG RULE OUTRANKS THE SIZE RULE: an adapter that declares `rng_scope = "reader_traversal"`
# (one shared RNG over its whole traversal) reads as ONE shard whatever its size -- the shard runner admits such an adapter at K = 1
# only (runner.py run_pass) and any larger count crashes every task before a summary is written (the first post-cutover read:
# alphasteer_rebake at 8, arditi_strength and ctl_neg1_static at 4 all died that way). The traversal adapters today: alphasteer_rebake,
# arditi_allpos, arditi_strength, ctl_neg1_static (inherits sampled_static's), overrefusal_items, sampled_controls, sampled_static;
# tests/test_registry_store_coverage.py pins every registered reader_traversal adapter at shards: 1.
#
# PINS COME FROM THE ENTRY ALONE: the plan pins exactly the components an adapter's entry names (cluster_reads.plan_window),
# and the shard's escape refusal admits an input only from a generation pinned by THIS adapter -- so an entry must name EVERY component
# the adapter opens, not only the ones holding its declared roots (the window's home tree is the union of every cluster-routed
# adapter's pins, which served undeclared dependencies silently until an adapter was alone in needing one). The census of 2026-10-07
# mapped every accepted head revision's inputs onto the components; every holder is in its adapter's entry, and every opened root is a
# member of exactly one component (two claimants on one path refuse the whole window: cluster_reads.home_tree_spec).
#
# WHAT IS DECLARED, AND WHY NO COMPONENT IS cluster_a_origin TODAY (2026-09-28; read-only survey, see the operations doc):
#   Three cluster-A-origin candidates were proposed. None survives the code and the disk:
#   - run-state/full22/misalign and misalign_16k: the grading host trees carry the judge outputs (judge_provenance.json, store/,
#     analysis/, judge_cache.jsonl) that exp/misalign* on cluster A lack (80 vs 53 files for misalign/qwen35_4b_s1; 64 vs 36 for
#     misalign_16k/qwen35_4b_s1), and the pulls excluded serving/vllm_server.log; the em_misalign reader needs the grading host tree.
#     misalign_ladder is a grading host MERGE (paired_allmodels_post.sh merge) with no cluster A original at all.
#   - relu_paired/anchors_strength (a faithful rsync -rlt mirror of the login host's exp/sdfbase_full22_native/transcripts_results/
#     sdfbase_full22_qwen35_4b_d0p75_distdiff64s1/{actorattack,crescendo}/none/): no registry adapter opens it (relu_paired's
#     discovery globs grades_*paired*_s*, sampled/grades_sampled/... and transcripts_<tag>/...). Not a component.
#   - run-state/full22/sampled_native: read by degeneracy_union only (declared under `full22_degeneracy` below), not by sampled_static.
#
# SIZES. The first 14 components: 183,036 regular files / 120,498 MB (112.2 GiB; `registry stores mirror --dry-run`, 2026-09-28).
# The components added for the other 49 adapters' roots: ~79 GB more (full22_seedrep 14.7 GB, hpo_r1 12.4 GB, grade_strength
# 9.7 GB, fullscale_consolidated 9.5 GB, full22_shared 7.9 GB, grade_regrade 2.2 GB -- its first declaration was 33.4 GB, see the
# entry -- ...). Escaping symlinks found by the survey are excluded where the adapter never opens them (`wandb`, `logs`); a component
# whose manifest would still refuse is a move-time fact. The census of the first post-cutover read (2026-10-07) added five
# components (~780 MB: full22_transcripts 722 MB, petri_llama8b 44 MB, full22_native_mmlu 13 MB, the degeneracy CSVs and the three
# petriwave_state files), re-based one (hpo_reseed_eb64 onto reseed_eb64, taking in its 1 MB recon sibling) and widened four members
# (~1.3 GB: arditi_allpos_mt4kap 800 MB, the five degeneracy_* stores 480 MB, petri_stats_halfdose and three top-level run-state files).
schema: cluster_reads/2
written_utc: "2026-10-07T07:20:00Z"

destinations:
  # Each destination is named by a cluster's registry label. A destination that spells neither `host` nor `shared` takes its login host,
  # its shared root ($SHARED) and its repo mirror from the registry configuration's [[clusters]] entry of the same name (`host`, `shared`,
  # and `remote_src` without its /src, else <shared>/repos/<the directory name of [repo] checkout>); `registry stores --dest <label>`
  # refuses a label that entry does not name. A destination may still spell `host`, `shared` and `repo_rel` itself.
  cluster_a:
    stores_rel: registry/stores             # $SHARED/registry/stores/gen/<slug>/<content_sha8>/
    sbatch_rel: scripts/registry/landing/store_verify.sbatch   # the verifier, in the repo mirror the verify job imports sisteer.registry.stores from
    verify_cpus: 16
    verify_mem: 32G
    verify_rate_mb_s: 100                   # the --time estimate's rate until a VERIFIED report has measured the slug's own
    verify_min_time_s: 600
    verify_max_time_s: 14400
    rsync_timeout_s: 21600
    watch_max_hours: 4
    watch_poll_s: 30

adapters:
  # ---- the six heavy adapters (shards measured; the window's default cluster set) ------------------------------------
  relu_paired:
    shards: 8
    # `sampled`: the controls index relu_paired.CONTROLS_INDEX_REL (under sampled/report/analysis/) it reads for its control
    # groups lives under that component; a stale or absent index refuses the adapter's cluster route
    # the multi-model declaration (relu_paired_sidecars' mm_paired_d1.json) names EXTERNAL passthrough `none` MMLU anchor stores and their
    # corroborating stores in four more components: run-state/full22_native/sampled/mmlu (full22_native_mmlu), full22/relu_native/
    # controls_llama8b_anchor (full22_relu_native), $GRADE/arditi_strength/* and alphasteer_f22_defense/controls/* (grade_arditi,
    # grade_alphasteer) (the census of 2026-10-07 over every accepted head)
    components: [relu_paired_run_state, relu_paired_manifests, petri_native_ledger, petri_drive, relu_paired_sidecars, sampled, full22_native_mmlu, full22_relu_native, grade_arditi, grade_alphasteer]
  multiturn_grades:
    shards: 8
    # the declaration files name grades roots in two more components: transfer_stats_full22_all.json's namespace directory `grades`
    # (full22_regrade_siblings' grades/gemma4e4b + grades/qwen35_4b -- `grades` is not `grades_*`) and the cap4096 / llama8b files'
    # relu_native/grades_relu_native_bu_* (full22_relu_native)
    components: [multiturn_run_state, object_bank_full22, petri_manifests, full22_regrade_siblings, full22_relu_native]
  bfcl_full:
    shards: 6
    components: [bfcl_full]
  bigcodebench_full:
    shards: 6
    components: [bigcodebench_full]
  em_misalign:
    shards: 6
    components: [misalign_panels, misalign_run_state, misalign_grades, relu_paired_manifests]
  sampled_static:
    shards: 1
    components: [sampled]
  # ---- every other registered adapter (shards by the size rule over the adapter's own roots) ----------------------------------
  alphasteer_rebake:
    shards: 1
    # OVERRIDE of the size rule (5,190 MB / 10,514 files -> 8): the adapter declares rng_scope = reader_traversal, so ONE shard (the RNG
    # rule in the header -- at 8 every task crashed before a summary). Its one-shard wall time against read_array.sbatch's limit
    # is unmeasured. It also opens $GRADE/strength/graded_reread.json (alphasteer_rebake.GRADED_REREAD, the XSTest ladder):
    # grade_strength's, pinned here (the census of 2026-10-07; the adapter never read on the cluster before)
    components: [grade_alphasteer, grade_arditi, grade_strength]
    note: "5,190 MB / 10,514 files: alphasteer_f22_{rebake,defense,refit} + arditi_strength/orb_grades_alphasteer; one shard (reader_traversal RNG)"
  arditi_allpos:
    shards: 1
    # reader_traversal RNG: one shard (the header's RNG rule). Besides its grade root it opens the mt4kap multi-turn run under
    # run-state/full22/arditi_allpos_mt4kap (full22_regrade_siblings: goalsets/, transcripts_mt4kap_*/, grades_mt4kap_*/), the anchor
    # record transfer_stats_full22_cap4096.json + the two anchor grades roots grades_anchor4096*_qwen35_4b_it (multiturn_run_state) and
    # degeneracy_union/degeneracy_mt_cap4096_union.v2.json (full22_degeneracy)
    components: [grade_arditi, full22_regrade_siblings, multiturn_run_state, full22_degeneracy]
    note: "404 MB / 951 files"
  arditi_strength:
    shards: 1
    # OVERRIDE of the size rule (2,265 MB -> 4): rng_scope = reader_traversal, so ONE shard (the header's RNG rule)
    components: [grade_arditi]
    note: "2,265 MB / 7,287 files; one shard (reader_traversal RNG)"
  arditi_vendor_mt:
    shards: 1
    components: [arditi_allpos_ladder]
    # its /tmp/phaseA/arditi_mt and /tmp/phaseA/arditi_rep_t<T> working trees are declared RETIRED by the adapter itself
    # (inputs_retired): `stores coverage` reads that declaration; nothing to name here
    note: "429 MB / 681 files under ~/results/arditi-allpos-ladder (mt_grades, transcripts_results, replicate_grades)"
  bcb_bfcl:
    shards: 1
    components: [grade_tinycap, bcb_bfcl_200_specs]
    note: "12 MB / 51 files: tinycap/bcb-bfcl-200 + the two specs' analysis/paper_rows_*.parquet"
  bfcl_allmodels:
    shards: 1
    components: [full22_allmodels]
    note: "124 MB / 571 files"
  bfcl_full_shared:
    shards: 4
    # the shared readers compare against the SOLO mirror: _bcbw_common._discover_solo_inputs opens full22/bfcl_full (the bfcl_full
    # component) beside the shared root, so both are pinned (the same for _l2, _l3 and the three bigcodebench readers)
    components: [full22_shared, bfcl_full]
    note: "2,026 MB / 1,126 files (+ the solo mirror it compares against)"
  bfcl_full_shared_l2:
    shards: 4
    components: [full22_shared, bfcl_full]
    note: "1,559 MB / 983 files (+ the solo mirror)"
  bfcl_full_shared_l3:
    shards: 1
    components: [full22_shared, bfcl_full]
    note: "383 MB / 221 files (+ the solo mirror)"
  bfcl_seedrep:
    shards: 1
    components: [full22_seedrep]
    note: "211 MB / 921 files"
  bigcodebench_allmodels:
    shards: 1
    components: [full22_allmodels]
    note: "162 MB / 791 files"
  bigcodebench_full_shared:
    shards: 4
    # as bfcl_full_shared: the solo mirror full22/bigcodebench_full (the bigcodebench_full component) is read for the comparison
    components: [full22_shared, bigcodebench_full]
    note: "2,026 MB / 1,126 files (+ the solo mirror it compares against)"
  bigcodebench_full_shared_l2:
    shards: 4
    components: [full22_shared, bigcodebench_full]
    note: "1,559 MB / 983 files (+ the solo mirror)"
  bigcodebench_full_shared_l3:
    shards: 1
    components: [full22_shared, bigcodebench_full]
    note: "383 MB / 221 files (+ the solo mirror)"
  bigcodebench_seedrep:
    shards: 1
    components: [full22_seedrep]
    note: "211 MB / 921 files"
  bon_native4096:
    shards: 1
    components: [full22_bon]
    note: "1 MB / 4 files (bon_native4096_relu_paired_llama8b/grades)"
  bon_stores:
    shards: 4
    # the producer's root manifest under bon_cap4096/cluster/manifests/ registers the BoN store records (bon_served_manifest.json,
    # bon_served_run.json) under roots in three OTHER components' subtrees: transcripts_rest/, transcripts_glm/, transcripts_prompted/,
    # transcripts_nemotron_complete/ (multiturn_run_state), relu_paired/transcripts_paired_d1_s{1,2,3}/ (relu_paired_run_state) and the
    # unsuffixed transcripts/ (full22_transcripts -- `transcripts` is not `transcripts_*`) -- all pinned here
    components: [full22_bon, multiturn_run_state, relu_paired_run_state, full22_transcripts]
    note: "1,932 MB / 1,009 files (bon_cap4096 + bon_siconst) + the store records under the registered transcript roots"
  cap4096_lane:
    shards: 1
    components: [multiturn_run_state]
    # its root is the whole run-state/full22 directory; what it OPENS is the declaration file transfer_stats_full22_cap4096.json and
    # grades_*/*/grading_provenance.json -- members of multiturn_run_state (`restricted` in the coverage report, by design)
    note: "the cap-4096 multi-turn declarations: one file + the per-root grading_provenance.json files"
  cellstore:
    shards: 1
    components: [grade_alphasteer, paperlib_llama8b_controls, arditi_allpos_ladder, grade_arditi]
    note: "136 MB / 465 files: the controls_cap* / orb_cap* directories under four roots"
  ctl_neg1_controls:
    shards: 1
    components: [full22_ctl_neg1]
    note: "108 MB / 214 files (ctl_neg1/sampled/controls_sampled)"
  ctl_neg1_multiturn:
    shards: 1
    components: [full22_ctl_neg1]
    note: "9 MB / 43 files (ctl_neg1/mt/grades)"
  ctl_neg1_static:
    shards: 1
    # OVERRIDE of the size rule (2,789 MB -> 4): CtlNeg1StaticAdapter inherits sampled_static's rng_scope = reader_traversal, so ONE shard
    # like sampled_static (the header's RNG rule)
    components: [full22_ctl_neg1]
    note: "2,789 MB / 1,719 files (ctl_neg1/sampled); one shard (reader_traversal RNG)"
  degeneracy_union:
    shards: 4
    # besides its union / Petri stores and the two sampled analysis indexes it opens the cap-4096 multi-turn declaration file
    # transfer_stats_full22_cap4096.json (multiturn_run_state) and the three degen_*_over1pct.csv exports of 2026-09-14
    # (degeneracy_csv_2026_09_14, its CSV_DIR_DEFAULT)
    components: [full22_degeneracy, sampled, multiturn_run_state, degeneracy_csv_2026_09_14]
    note: "1,184 MB / 3,322 files: degeneracy_union, degeneracy_petri, sampled_native/report/analysis + sampled/report/analysis; + one declaration file and three CSVs"
  gsm8k_p200:
    shards: 4
    components: [grade_tinycap]
    note: "1,453 MB / 6,475 files (tinycap/gsm8k)"
  gsm8k_paired_allmodels:
    shards: 1
    components: [full22_allmodels]
    note: "13 MB / 228 files"
  gsm8k_seedrep:
    shards: 1
    components: [full22_seedrep]
    note: "83 MB / 840 files"
  hpo_logs:
    shards: 8
    # hpo_reseed_eb64 holds the reseed root AND its recon sibling (members [hpo, recon]): the adapter derives
    # `<dirname(hpo root)>/recon/recon_clip_<key>_<object>.json` for every reseed sweep
    components: [hpo_reseed_eb64, hpo_llama, hpo_rehpo, hpo_sync, hpo_r1]
    note: "15,075 MB / 656 files over the five HPO roots (hpo-r1 12.4 GB, hpo-llama 2.6 GB) + reseed_eb64/recon"
  ifeval_seedrep:
    shards: 4
    components: [full22_seedrep]
    note: "779 MB / 1,691 files"
  legacy_glm:
    shards: 1
    # its four FILES: glm_errored117/comparison.json + controls_glm/controls_table_glm.json (full22_glm), transfer_stats_full22_glm.json
    # (multiturn_run_state) and petri_stats/petri_full22_glm.json (full22_petri_stats)
    components: [full22_glm, multiturn_run_state, full22_petri_stats]
    note: "65 MB / 188 files (glm_errored117 + controls_glm) + two declaration files in two other components"
  llama8b_wave:
    shards: 1
    components: [llama8b_stage, paperlib_llama8b_controls]
    note: "14 MB / 636 files"
  math500:
    shards: 4
    components: [grade_tinycap]
    note: "1,602 MB / 4,207 files (tinycap/math500)"
  math500_seedrep:
    shards: 4
    components: [full22_seedrep]
    note: "575 MB / 1,011 files"
  mmlu_full:
    shards: 1
    components: [full22_mmlu_full]
    note: "64 MB / ~190 files (mmlu_full + arditi_allpos/controls/.../mmlu_full)"
  objects_bank:
    shards: 4
    components: [object_bank_full22, fits_mirror, grade_objects, stage_objects]
    note: "2,307 MB / 3,053 files over the four object banks"
  orxs_seedrep:
    shards: 8
    components: [full22_seedrep]
    note: "4,393 MB / 2,700 files"
  overrefusal_items:
    shards: 1
    components: [grade_sdfbase_controls, fullscale_consolidated, full22_controls_halfdose]
    # OR_ROOTS[1], fullscale/consolidated/judge (7 files), moved WHOLE to fullscale/_retired/judge/ on 2026-10-07 (bytes
    # unchanged): outside fullscale_consolidated's base, so it is no longer carried. The adapter declares the OLD root RETIRED
    # (overrefusal_items.RETIRED_JUDGE_ROOT, inputs_retired) and OR_ROOTS keeps the spelling for paperlib parity (discovery skips a missing
    # root), which is why the entry still names fullscale_consolidated: `stores coverage` holds the declared root there (under the home, so
    # `covered`, never `retired`: that state is for roots outside the home)
    note: "433 MB / 678 files on 2026-10-04, 7 of them (consolidated/judge) since moved to fullscale/_retired/judge/ and retired: sdfbase_full22/controls, controls_halfdose"
  petri_stats:
    shards: 8
    components: [full22_petri_stats, fullscale_consolidated]
    note: "9,514 MB / 3,931 files (the consolidated tree is 9.5 GB)"
  r2_export:
    shards: 1
    # the export's sha-pinned provenance sources (data/sdf_base_steering_r2_sources.json: 246 files) lie in twelve other components, every
    # one pinned here so the adapter's own admission guards them instead of the window's union. Holders, by file count:
    # multiturn_run_state 67, grade_sdfbase_controls 46, sampled 41, full22_degeneracy 30, full22_glm 17, full22_relu_native 16,
    # full22_petri_stats 11, fullscale_consolidated 8, full22_controls_halfdose 6, full22_bon 2, petri_native_ledger 1, petri_llama8b 1
    components: [r2_export_data, multiturn_run_state, grade_sdfbase_controls, sampled, full22_degeneracy, full22_glm, full22_relu_native, full22_petri_stats, fullscale_consolidated, full22_controls_halfdose, full22_bon, petri_native_ledger, petri_llama8b]
    note: "342 MB / 351 files + the 246 pinned sources in twelve other components"
  regrade_twin:
    shards: 8
    components: [grade_regrade, full22_regrade_siblings, full22_relu_native, grade_alphasteer, grade_arditi, multiturn_run_state, sampled]
    # discover() opens, under the twin root, README.md (it REFUSES without it), ledger.jsonl, the eight manifests/ files of
    # regrade_twin.MANIFEST_FILES and journal/harvest/*.jsonl -- grade_regrade holds exactly those -- then the Swap-A SIBLING verdict
    # files the harvest journal's destinations name BESIDE the Haiku originals in OTHER stores (regradelib.sibling_names), and those
    # originals. The read-only survey of the journal (2026-10-04: 231 files, 1,771,536 rows,
    # 397 destinations in 198 directories) finds 165 `live_two_si_grade_cache.claude-sonnet-5.jsonl` siblings: 162 in directories the
    # five components named after grade_regrade hold (multiturn_run_state 57, sampled 63, grade_arditi 21, grade_alphasteer 20,
    # full22_relu_native 1) and 3 in directories no other component held (full22_regrade_siblings); zero Swap-B siblings
    # (`judge_items.claude-opus-5.jsonl`: Swap B's verdicts went to sqlite caches under regrade/swapB, which the adapter never opens).
    # The plan's coverage check (cluster_reads.input_coverage, the adapter's own discovery against the pinned generations) is the exact
    # check every window; a sibling written anywhere else routes the adapter to the grading host naming the root. Shards: the size rule over
    # the declared root (52.9 GB / 20,331 files -> 8).
    note: "the twin's own inputs (grade_regrade, 2,208 MB / 472 files) + the 165 Swap-A sibling files and their Haiku originals in six other components"
