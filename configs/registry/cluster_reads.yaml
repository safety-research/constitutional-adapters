    shards: 4
    components: [full22_seedrep]
    volatile_roots:
      - root: /tmp/launch_vol_peek
        reason: "the volatile Modal-volume peek the carried stores were copied from (seedrep_statics.VOLATILE_PEEK_DEFAULT); absent on the grading host since the copy, never on a cluster node; the carried copy under seedrep_battery is what is read"
    note: "2,762 MB / 8,047 files (seedrep_battery)"
  seedrep_petri:
