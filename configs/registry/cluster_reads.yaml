  grade_regrade:
    base: $GRADE/regrade
    # the twin root is 52.9 GB with 22,233 links that escape the base (swapA/, swapB/, canonical_export_snapshot_*/ are link farms into
    # the home). The members are EXACTLY what the adapter opens under its root (regrade_twin.discover / WorklistA / load_harvest):
    # README.md -- discover() refuses without it (the first declaration carried manifests/ + journal/ and would have
    # refused every shard) -- ledger.jsonl, the eight manifests/ files of regrade_twin.MANIFEST_FILES (S_A.parquet is also the worklist)
    # and journal/harvest/ (the .jsonl rows and their .DONE marks). Not read, so not members: manifests/_gen*/ and _parts_*/, the
    # `*.pin-*` copies and the DIFF/GENERATION files, journal/claims_*.sqlite (4.7 GB, with a live -shm/-wal pair), journal/live|writes.
    # tests/test_registry_store_coverage.py pins MANIFEST_FILES and journal/harvest against these members by path algebra;
    # tests/test_registry_cluster_read.py stages a synthetic twin root through this declaration and runs the adapter's real discovery
    members: [README.md, ledger.jsonl, manifests/S_A.parquet, manifests/S_B.parquet, manifests/drawn_rows.parquet, manifests/units_A.json, manifests/units_B.json, manifests/counts_A.json, manifests/counts_B.json, manifests/drawn_rows.meta.json, journal/harvest]
    authority: grading_host_copy
    origin: grading_host
    note: "regrade_twin: the twin's README, ledger, the eight worklist and count manifests, the harvest journal (2,208 MB / 472 files; no link inside the members)"
