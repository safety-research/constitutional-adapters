# two_si_gemma4e4b.yaml — DERIVED, do not hand-edit.
# (ONE staged exception, 2026-08-28: class_b.layer 15 -> 20, see the
#  comment at that key. The deriver copies the class_b block VERBATIM
#  from the Llama base, so regenerating REINTRODUCES the Llama layer
#  until derive_model_config.py rescales it.)
# Regenerate: uv run --no-sync python scripts/derive_model_config.py --models gemma4e4b
# (--hpo-results <winners.json> to fold HPO winners into train_kwargs.<arm>.)
#
# model:    google/gemma-4-E4B-it @ ee0ef6023621cff504d758262d4e04895a5af4a2
# layer:    round(0.469 x 42) = 20 (bidpo only; all-layer arms ignore it)
#
# max_len_by_si derived per SI from THIS tokenizer (train_budget.derive_max_len:
#   rendered teacher prompt + 1024 attack allowance + 512 completion + 1 EOS, next pow2):
#   safety_refusal: 101 rendered -> 1638 required -> 2048
#   si_constitution: 6041 rendered -> 7578 required -> 8192
#   si_irrelevant: 6574 rendered -> 8111 required -> 8192
# counts measured: live tokenizer at the pinned revision (scripts/derive_model_config.py)
#
# batch_size_by_arm: PLACEHOLDERS on purpose — no width for this
# model is measured yet, and resolve_batch_size int()s the value,
# so a wave submitted before Phase D's memprobe table lands FAILS
# LOUDLY instead of silently training at the module default. The
# committed Llama two_si_budget_measured.json is invalid here by
# construction (measurement_inputs_sha hashes the model pin), so
# the consumption gates refuse it too.
#
# teacher_prefix_cache: false — DEVIATION from the intended true,
# forced by evidence (2026-08-25, CPU, tiny real-class instances,
# transformers 5.14.1): TeacherPrefixCache crashes on qwen3_5's
# LinearAttentionLayer cache entries (any prefix) and on gemma4's
# DynamicSlidingWindowLayer once the prefix exceeds
# sliding_window=512 (35/42 E4B layers slide; the long SIs render
# ~6k tokens). Flip per model only after prefix_cache.py supports
# the layout AND onboard_model_smoke.py's equivalence gate passes
# on the pod. Tests: tests/test_model_onboarding.py pins the
# never-silently-wrong contract.
si_ids:
# REDUCED RUN originally listed safety_refusal + si_constitution only.
# si_irrelevant RESTORED 2026-08-28: the wave is a
# three-SI comparison ({safety_refusal, si_constitution, si_irrelevant} x
# {psr_kl_all, lora_r4} + baselines = 10 cells per model), and
# registry_from_cfg enumerates cells from THIS list — without
# si_irrelevant the three gemma si_irrelevant cells silently did not
# resolve (7/10 wave cells; a prior session worked around it with an
# out-of-repo config copy). The pool machinery (PoolSpec, matched_pool.py)
# HARD-REQUIRES >=2 si_ids; with three, the matched intersection runs over
# all three SIs, exactly like the Llama config. The config's own
# max_len_by_si / pos_runs / pos_candidates blocks already carried
# si_irrelevant entries in anticipation.
- safety_refusal
- si_constitution
- si_irrelevant
defenses_dir: out/two_si/defenses/cells
class_a_arms:
# REDUCED RUN: the four distillation arms only. bidpo deferred — it needs
# a generate-anti-neg leg and its effective-batch-128 floor is degenerate on the
# ~25-158-pair reduced pool; its F1/F6 fixes are unit-validated. Do bidpo in the
# full run.
- psr_kl_all
- psr_mse_all
# lora_r4 (renamed from lora_r1_all, 2026-08-28 user instruction: the
# staged objects are rank 4; "all" is implicit). Staged legacy
# `<si>__lora_r1_all/` dirs keep loading via methods.LEGACY_ARM_ALIASES.
- lora_r4
- token_faithful
# psr_xfer_from_e2b (2026-08-28, psr-transfer behavioral eval): the
# CROSS-MODEL TRANSFERRED PSR unit — an E2B-fit safety_refusal psr_kl_all
# unit mapped into THIS model's basis by the psr-transfer step. Ordinary
# PSRObject blob (kind 'psr'), positions_at_fit=response, H=3; NEVER
# trained in-repo (the methods trainer refuses). Only e2b-source transfers
# belong on the E4B config — a from_e4b arm here would be a self-transfer.
# _rw1 = the ridge-ablation variant (registered now so its ablation cell
# resolves without another config edit; a missing artifact refuses at use).
- psr_xfer_from_e2b
- psr_xfer_from_e2b_rw1
class_b_arms:
- antidote
- alphasteer
- caa_static_r
class_c_arms:
- psr_kl_all
- psr_mse_all
- lora_r4    # renamed from lora_r1_all (2026-08-28); same arm, canonical name
class_b:
  benign_prompts_path: $SHARED/exp/jailbreak/contrast/benign_alphasteer.json
  harmful_prompts_path: $SHARED/exp/jailbreak/contrast/harmful_alphasteer.json
  benign_sha256: 24f1a69fcb46d8eaac0993be9365268d59c3ea910feb4044a3897cb0fa242298
  harmful_sha256: 7c6983fca61e13181613c14b18753ecae10cfd2b156f0a4b0104136fb641c5cf
  min_prompts: 500
  # STAGED FIX (2026-08-28): arrived as layer: 15 — the deriver copies
  # the class_b block verbatim from the Llama base config, and 15 is the
  # Llama-3.1 comparability pin (15/32 = 0.469 relative depth). On E4B's
  # 42 layers, 15 sits at 0.357 — an inherited Llama layer, not a Gemma
  # choice. fit_class_b.class_b_layer prefers THIS key over the shared
  # top-level layer, so a Class B fit launched off the copied value
  # would silently run off-anchor. 20 = round(0.469 x 42), the same
  # anchor the top-level layer carries. (No Class B object is in the
  # 6-cell gemma generation wave; this bites only when class-B fits run.)
  layer: 20
model: google/gemma-4-E4B-it
model_revision: ee0ef6023621cff504d758262d4e04895a5af4a2
dtype: bfloat16
attn_implementation: sdpa
layer: 20
scale: 1.0
max_len: 8192
# completion_tokens 512 -> 2048 (pt829 truncation fix, 2026-08-28): at 512
# the undefended grok420 arm hit the cap on ~90% of responses (median/p99
# both pinned at 512) and pasttense ~34%, and the undefended arm truncated
# 2-4x MORE than defended arms — compressing the very none-vs-defended gap
# StrongREJECT measures. A cap PILOT at 2048 (job 234789, gemma4e2b/none,
# the worst arm) put grok420 p99 at 1734 with 0.5% at-cap and pasttense at
# 0% — bias resolved; 4096 would recover a negligible 0.5% at 2x cost.
# All three cap fields move together (this, attacks.target_max_new_tokens,
# bon.max_new_tokens) so every leg shares one cap. The 512 wave is KEPT for
# truncation-robust metrics (refusal/benign, decided in the first tokens).
completion_tokens: 2048
teacher_prefix_cache: false
max_len_by_si:
  safety_refusal: 2048
  si_constitution: 8192
  si_irrelevant: 8192
batch_size_by_si: {}
# eval_gen_batch_size (2026-08-28, pt829 wave): the EVAL-side HF generation
# width for the non-BoN JB legs (static/held-out) and the benign controls
# (judged + gsm8k parity). EVAL-side only — fit-time widths stay in
# batch_size_by_arm below. batch_size is RECORDED serving identity, not a
# pairing axis (sweep.py), so raising it is a throughput choice: a peer
# measured 5x wall-clock (GPU duty 60-70% -> 98-100%) moving HF generation
# width 1 -> 64 with no comparability cost; BoN already runs 64
# (DEFAULT_BON_BATCH_SIZE). One width for every cell of a wave.
eval_gen_batch_size: 64
batch_size_by_arm:
  psr_kl_all: UNMEASURED_RUN_PHASE_D_MEMPROBE_FIRST
  psr_mse_all: UNMEASURED_RUN_PHASE_D_MEMPROBE_FIRST
  lora_r4: UNMEASURED_RUN_PHASE_D_MEMPROBE_FIRST   # renamed from lora_r1_all
  token_faithful: UNMEASURED_RUN_PHASE_D_MEMPROBE_FIRST
  bidpo: UNMEASURED_RUN_PHASE_D_MEMPROBE_FIRST
