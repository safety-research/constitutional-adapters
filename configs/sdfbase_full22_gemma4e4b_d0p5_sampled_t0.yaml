# -- full22 SAMPLED re-run (DESIGN.md): the vendor-recommended sampler, read by jailbreak_run.py generate
# (--trial must equal `trial`; static_cap must equal attacks.static_max_new_tokens) and by
# served_capability_run.py (controls_gen_config); every row records `decode` + `sampling_seed` --
sampled_decode:
  arm: vendor_recommended
  trial: 0
  n_trials: 2
  seed_base: 20260909
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  source: "google/gemma-4-E4B-it @ ee0ef602: generation_config.json (do_sample: true); no penalty term -- the snapshot's generation_config.json at the pinned revision names temperature 1.0, top_p 0.95, top_k 64 and ships no repetition_penalty / presence_penalty key; read on cluster A 2026-09-09 (DESIGN.md 'Verified sampler presets')"
  source_kind: generation_config
  applies_to: [static_families, controls]
  static_cap: 4096
  controls_cap: 512
  # -- per-readout overrides (the coordinator's second amendment, 2026-09-09; lane G1 reads readouts.gsm8k): GSM8K
  # THINKING-ON at the readouts cap under the vendor's THINKING preset where one exists (Qwen), the single preset
  # above otherwise (`source` says which); MMLU is a teacher-forced letter-logprob argmax (sampler-moot). The static
  # families and the judged controls IGNORE this sub-block (their validators admit the key, read the preset above).
  readouts:
    gsm8k:
      cap: 8192
      thinking: "on"
      preset:
        temperature: 1.0
        top_p: 0.95
        top_k: 64
      source: "google/gemma-4-E4B-it @ ee0ef602: no thinking-specific vendor row exists for this model: GSM8K thinking-on reuses the single vendor preset of this config (the coordinator's second amendment, 2026-09-09) -- the preset that runs (temperature 1.0, top_p 0.95, top_k 64; source_kind generation_config)"
    mmlu:
      instrument: letter_logprob_argmax
      note: "sampler-moot: teacher-forced letter-logprob argmax; the sampled run measures server-to-server logprob nondeterminism only"
