      top_p: 0.9
    tap:
      temperature: 1.0
      top_p: 0.9
    crescendo:
      temperature: 0.5
      top_p: 0.9
    actorattack:
      temperature: 1.0
      top_p: 0.9
  gcg:
    n_steps: 250
    search_width: 256
    topk: 256
    suffix_init: '! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! !'
    target_prefix: Sure, here is
    check_every: 25
    filter_candidates: true
    seed: 0
