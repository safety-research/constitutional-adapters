# two_si_qwen35_9b: the Qwen3.5-9B scale-12 serving config (2026-08-30).
#
# Derived from configs/two_si.yaml by overriding ONLY what the served qwen
# matrix changes: the model + revision pin, the arm set actually banked
# ({psr_kl_all, lora_r4} x {safety, constitution, irrelevant} = the 6
# fitted cells), and the object store. Every other knob (attacks, bon,
# grader, prereg, holdout, datasets) is inherited so generation behaviour
# matches the reference wave. si_ids keeps all three so the prompted
# baselines resolve.
#
# class_b/class_c arms are EMPTY: the qwen banks carry no Class B/C object,
# and enumerate_cells would report every such cell ABSENT. defenses_dir is
# the absolute banked store; the served-wave driver ALSO passes it as
# WAVE_DDIR (the authoritative override), so the two never disagree.
#
# thinking-off + prefix-caching-off for this hybrid model are composed at
# LAUNCH (build_server_launch keys on the template + architecture); they are
# not config knobs. The served geometry is 16384 x 32 (probe 243180).
si_ids:
- safety_refusal
- si_constitution
- si_irrelevant
defenses_dir: $SHARED/exp/objects/scale-12/qwen35_9b
class_a_arms:
- psr_kl_all
- lora_r4
class_b_arms: []
class_c_arms: []
class_b:
  benign_prompts_path: $SHARED/exp/jailbreak/contrast/benign_alphasteer.json
  harmful_prompts_path: $SHARED/exp/jailbreak/contrast/harmful_alphasteer.json
  benign_sha256: 24f1a69fcb46d8eaac0993be9365268d59c3ea910feb4044a3897cb0fa242298
  harmful_sha256: 7c6983fca61e13181613c14b18753ecae10cfd2b156f0a4b0104136fb641c5cf
  min_prompts: 500
  layer: 15
model: Qwen/Qwen3.5-9B
model_revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
dtype: bfloat16
attn_implementation: sdpa
layer: 15
scale: 1.0
max_len: 8192
completion_tokens: 512
max_len_by_si:
  safety_refusal: 2048
  si_constitution: 8192
  si_irrelevant: 8192
batch_size_by_si: {}
batch_size_by_arm:
  psr_kl_all: 4
  psr_mse_all: 4
  vector_all: 4
  lora_r1: 8
  loreft: 8
  lofit: 4
  token_bos: 4
  token_faithful: 4
  alphakl_null: 2
  alphakl_soft: 2
  alphakl_fisher: 2
  vector: 4
  bidpo_lora: 2
train_kwargs:
  default:
    holdout_frac: 0.1
    holdout_salt: two_si_holdout
    early_stop_patience: 2
    early_stop_min_epochs: 1
    early_stop_min_delta: 0.0
    floor_ratio_max: 3.0
    positions: all
    response_header_len: null
  alphakl_soft:
    beta: 1.0
controls:
- xstest
- or_bench_hard_1k
- mmlu
- gsm8k
pool_manifest: out/two_si/pool_manifest.json
pool:
  store_dir: $WORK/two-si-stage3/sampler/store
  static_families:
  - bon
  - pasttense
  - pap
  - encoding
  - aim
  - gcg_replay
  - amplegcg_plus
  - wildjailbreak_harmful
  train_families:
  - bon
  - pasttense
  - pap
  - encoding
  - aim
  - gcg_replay
  - amplegcg_plus
  - wildjailbreak_harmful
  eval_families:
  - pair
  - tap
  - crescendo
  - actorattack
  - artprompt
  - cipherchat
  - codeattack
  - multilingual
  - renellm
  - drattack
  replay_families:
  - pair
  - tap
  - crescendo
  - actorattack
  min_pool_size: 50
  hard_floor_pairs: 2300
  fit_floor:
    dims:
      alphakl_null: 4096
      alphakl_soft: 4096
      alphakl_fisher: 4096
    calibration_rows:
      alphakl_null: 64
      alphakl_soft: 64
      alphakl_fisher: 64
  benign_source: phtest
  benign_sources:
  - name: phtest
    loader: phtest
    split: harmless
  - name: wildjailbreak_benign
    loader: wildjailbreak_benign
  benign_fraction: 0.5
  benign_fraction_tol: 0.02
  benign_run: two_si_benign
  benign_n: null
  benign_split: harmless
  benign_seed: 0
  relaxed_stratum:
    enabled: false
  scoring_disjointness:
    or_bench_hard_1k: {}
    xstest: {}
  source_floors: {}
  constitution_run: two_si_pos_constitution
  pos_runs:
    si_constitution: two_si_pos_constitution
    si_irrelevant: two_si_pos_irrelevant
  pos_candidates:
    si_constitution: 1
    si_irrelevant: 8
  anti_neg:
    enabled: true
    anti_si_id: anti_safety_refusal
    run: two_si_anti_neg
    candidates: 8
    temperature: 1.0
  bidpo_benign:
    enabled: true
    refusal_labels:
    - I
    floor: 0
    max_benign_per_harmful: 1.0
datasets:
