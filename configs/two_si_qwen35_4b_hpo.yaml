  snapshot: 27502c8717fd5a2f8c0c77188c10c243fd4f672e
  path: $HF_HOME/hub/models--huihui-ai--Huihui-Qwen3.6-27B-abliterated/snapshots/27502c8717fd5a2f8c0c77188c10c243fd4f672e
