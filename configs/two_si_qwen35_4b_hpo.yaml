# two_si_qwen35_4b_hpo.yaml — INTERIM, hand-derived from
# two_si_llama3b_hpo.yaml (itself the gemma4e2b_probe.yaml precedent:
# NOT generated by make_fit_configs, whose byte-pin covers only the
# production configs; regenerate properly via the generator before
# any FIT wave). Purpose: the Qwen3.5-4B (thinking-off pool)
# psr_kl_all safety lane — an 8-trial Sobol lr x clip HPO
# (safety_refusal only), launched via scripts/modal/qwen35_4b_hpo.py
# (app safetysi-qwen35-4b-hpo, volume twosi-fits, pool/qwen35_4b/).
#
# Changes from the llama3b HPO config: model/revision swapped to
# Qwen/Qwen3.5-4B @ 851bf6e (gated line — the Modal hf-token secret
# covers the snapshot); layer 13/28 -> 15/32 (text_config
# num_hidden_layers=32; same relative depth as the 8B's 15/32; inert
# for the all-layer psr arms); batch_size_by_arm -> sentinel (NOT
# reused from any sibling — measure with the app's hpomem ladder,
# the sweep passes --batch-size explicitly); train_kwargs.psr_kl_all
# lr/clip -> sentinel (NO Qwen3.5 prior anchors this lane — the
# sweep box is deliberately WIDE: lr [1e-4, 4e-3] x clip
# [0.02, 0.5], log-space, wf fixed 0.15, T/wd pinned 1.0/0.01, via
# emit-trials --box-from). Everything else (max_len_by_si: safety
# 8192, epochs 10, warmup_cosine, patience 3, holdout 0.1) carries
# the frozen safety-lane regime unchanged.
#
# model: Qwen/Qwen3.5-4B @ 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
#   (thinking-off pool: $HOME/twosi_qwen35_4b_off; tokcache header
#   template_hash a4aee8afcf2e0711 verified == template_hash_of(tok)
#   at the pinned revision; response_header_len derives to 7).
# pool: $HOME/twosi_qwen35_4b_off/pairs/ — the FROZEN pool (manifest
#   sha256 64466db2e79256c1..., regime matched_intersection, 9164
#   pairs/SI) -> twosi-fits volume pool/qwen35_4b/
#   (pairs_safety_refusal.jsonl sha 297d8674f9a09f4a..., + the
#   pre-tokenized .tokcache.npz sidecar built with the pool —
#   reused, never rebuilt; its header pool sha matches).
# degenerate rows: KEPT (safety pos/neg degenerate 55/22343 = 0.25%
#   flagged at pool build) — no sibling fit filters them, so keeping
#   preserves cross-model comparability, and the rate is negligible.
#   The Pair loader reads named keys only, so the flags ride the
#   jsonl without touching the fit.
si_ids:
- safety_refusal
- si_constitution
- si_irrelevant
defenses_dir: out/two_si/defenses/cells
class_a_arms:
- psr_kl_all
- psr_mse_all
- lora_r1_all
- lora_r4
- bidpo
class_b_arms:
- antidote
- alphasteer
- caa_static_r
class_c_arms:
- psr_kl_all
- psr_mse_all
- lora_r1_all
- lora_r4
- bidpo
class_b:
  benign_prompts_path: $SHARED/exp/jailbreak/contrast/benign_alphasteer.json
  harmful_prompts_path: $SHARED/exp/jailbreak/contrast/harmful_alphasteer.json
  benign_sha256: 24f1a69fcb46d8eaac0993be9365268d59c3ea910feb4044a3897cb0fa242298
  harmful_sha256: 7c6983fca61e13181613c14b18753ecae10cfd2b156f0a4b0104136fb641c5cf
  min_prompts: 500
  layer: 15
  batch_size_by_arm: {}
model: Qwen/Qwen3.5-4B
model_revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
dtype: bfloat16
attn_implementation: sdpa
layer: 15
scale: 1.0
max_len: 16384
completion_tokens: 512
# false, as in the 27B config: HF disables use_cache under train-mode
# gradient checkpointing, so the teacher KV prefix build returns None
# (the trainer refuses the combination up front); the offline top-K
# teacher sidecar carries the teacher leg anyway.
teacher_prefix_cache: false
max_len_by_si:
  safety_refusal: 8192
  si_constitution: 16384
  si_irrelevant: 16384
batch_size_by_si: {}
batch_size_by_arm:
  # psr_kl_all: 1 = the qwen38_27b config's proven hook-arm value under
  # the fused kernels + gradient_checkpointing (2026-08-28); the HPO
  # sweep passes --batch-size explicitly from the hpomem ladder, which
  # may measure higher with kernels+ckpt.
  psr_kl_all: 1
  psr_mse_all: UNMEASURED_QWEN35_4B_RUN_HPOMEM_FIRST
  lora_r1_all: UNMEASURED_QWEN35_4B_RUN_HPOMEM_FIRST
  lora_r4: UNMEASURED_QWEN35_4B_RUN_HPOMEM_FIRST
  bidpo: UNMEASURED_QWEN35_4B_RUN_HPOMEM_FIRST
train_kwargs:
  default:
    holdout_frac: 0.1
    holdout_salt: two_si_holdout
    early_stop_patience: 3
    early_stop_min_epochs: 1
    early_stop_min_delta: 0.0
    floor_ratio_max: 1.0
    probe_n: 256
    positions: response
    response_header_len: null
    epochs: 10
  bidpo:
    floor_ratio_max: 3.0
  psr_kl_all:
    lr: PENDING_QWEN35_4B_HPO_WINNER
    lr_schedule: warmup_cosine
    warmup_frac: 0.15
    max_grad_norm: PENDING_QWEN35_4B_HPO_WINNER
    temperature: 1.0
    weight_decay: 0.01
    accum_steps: PENDING_QWEN35_4B_HPO_WINNER
    # The 27B-lane recipe for the qwen3_5 hybrid-attention hook arms
    # (compatible since the backward-inside-apply() fix, 2026-08-27):
    # checkpointed peaks are what hpomem measures and the trials run.
    gradient_checkpointing: true
  psr_mse_all:
    lr: PENDING_QWEN35_4B_HPO_WINNER
    lr_schedule: warmup_cosine
    warmup_frac: 0.15
    max_grad_norm: PENDING_QWEN35_4B_HPO_WINNER
    weight_decay: 0.01
    accum_steps: PENDING_QWEN35_4B_HPO_WINNER
  lora_r4:
    lr: PENDING_QWEN35_4B_HPO_WINNER
    lr_schedule: warmup_cosine
    warmup_frac: 0.15
    max_grad_norm: PENDING_QWEN35_4B_HPO_WINNER
    temperature: 1.0
    weight_decay: 0.01
    lora_rank: 4
    accum_steps: PENDING_QWEN35_4B_HPO_WINNER
    # Same kernels + checkpointing recipe as psr_kl_all above: without
    # it the lora arm OOMs at safety's max_len 8192 on the pool's longest
    # rows; hpomem measures (and the trials run) the checkpointed peaks.
    gradient_checkpointing: true
controls:
- xstest
- or_bench_hard_1k
- mmlu
- gsm8k
pool_manifest: out/two_si/pool_manifest.json
pool:
  store_dir: $WORK/two-si-stage3/sampler/store
  static_families:
  - bon
  - pasttense
  - codeattack
  - renellm
  - grok420
  - wildjailbreak_harmful
  train_families:
  - bon
  - pasttense
  - codeattack
  - renellm
  - grok420
  - wildjailbreak_harmful
  eval_families:
