  - tap
  - crescendo
  - actorattack
  - artprompt
  - cipherchat
  - codeattack
  - multilingual
  - renellm
  - drattack
  - bon
  - pasttense
  - grok420
  family_disjointness: false
  min_family_goal_coverage: 0.5
  pos_generation_engine: vllm
  neg_generation_engine: vllm
  replay_families:
  - pair
  - tap
  - crescendo
  - actorattack
  threshold: 0.5
  min_pool_size: 50
  hard_floor_pairs: 2300
  fit_floor:
    dims:
      alphakl_null: 4096
      alphakl_soft: 4096
      alphakl_fisher: 4096
    calibration_rows:
      alphakl_null: 64
      alphakl_soft: 64
      alphakl_fisher: 64
  benign_source: phtest
  benign_sources:
