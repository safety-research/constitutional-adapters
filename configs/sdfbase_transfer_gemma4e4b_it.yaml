# sdfbase_transfer_gemma4e4b_it.yaml — the INSTRUCT-DIRECT wave of the transfer
# battery: the objects trained
# ON the instruct checkpoint (gemma4e4b_it_doc, doc-CE on constv2-mix-full) applied to
# that SAME checkpoint DIRECTLY — no base -> instruct sibling staging — with a
# FRESH same-wave bare anchor; the head-to-head against base-fit + zero-shot
# transfer. DERIVED from configs/sdfbase_transfer_gemma4e4b_r3.yaml: every key
# below is that file's, byte-for-byte as data, EXCEPT —
#
#   * `explicit_cells` is [none, the two constv2-mix-full instruct-direct cells, the
#     re-run 1M base-fit LoRA]. `none` first is the SAME-WAVE bare anchor: greedy
#     generations differ run-to-run from numeric noise alone, so every contrast
#     is paired against a bare run generated in THIS wave, never against the
#     `_r3`, `_r2` or round-1 transcripts. The cell ids are the fitting bank's
#     (<pseudo-instruction>__<arm>); in THIS bank constv2-mix-full__* are the
#     gemma4e4b_it_doc objects (in the base key's fitting bank the same ids name
#     the base-fit full-corpus objects, which no battery wave serves).
#   * `defenses_dir` points at a NEW per-wave bank, out/transfer_gemma4e4b_it/cells,
#     which stages each gemma4e4b_it_doc cell from ITS OWN fitting bank
#     (out/gemma4e4b_it_doc/cells_all/<cell>, the COMPLETE publication) as a
#     byte-verified copy — the fit model IS the served model, so staging is a
#     copy, not a mapping. The fits were LIVE when this config was committed
#     (app sdfbase-fits-it), so the objects' sha256 are not known here; their
#     identity is pinned by the fit fingerprints fits-spawn recorded
#     ($STAGE/sdfbase/fit_calls_it.json expect_fingerprint), which the
#     staging step checks against each source COMPLETE marker before copying:
#       constv2-mix-full__psr_ce_all  fit_fingerprint 8daa591984920b7cc13da66b94505ae17d14a43e8bd3cd594c70bd184ff0cb38
#       constv2-mix-full__lora_r4_ce  fit_fingerprint e2f1028578f21afab43762e2e104ab06bc2afa233108d1ea41f72996e7f61904
#     The staged object sha256 are recorded at staging (<bank>/<cell>/
#     staged_from.json + $STAGE/sdfbase/it_battery_expected_sha.json).
#     The battery launcher derives the container's TT_TWO_SI_DEFENSES_DIR from
#     the wave and refuses a config whose defenses_dir disagrees with it.
#   * gemma ALSO carries the base-fit 1M LoRA cell constv2-mix-1m__lora_r4_ce
#     (gemma4e4b_base) — its NEW object from the chained continuation (cap 34 -> 60,
#     early-stopped at 58; sha256
#       370c075545fdffb1e49a60a2e76598ce1254334b59724075635f9945e4b0d8fa
#     supersedes the cap-34 object 0121c3393e5634e7… the `_r3` row served,
#     one generation stale). It is staged base -> instruct exactly as the `_r3`
#     bank was (out/gemma4e4b_base/cells_all -> this bank, sha-verified), so
#     the stale row gets its current-object replacement inside THIS wave,
#     against THIS wave's bare anchor. The cell id is the fitting bank's, as
#     in every other wave; the bank says which object it is.
#   * out_dir / private_run get the fresh `_it` namespace, so this wave's
#     transcripts, aggregates and judge cache can never mix with, or clobber,
#     the `_r3`, `_r2` or round-1 trees. The `_r3` bare transcripts stay
#     read-only where they are; the drift inset REGRADES them in this wave's
#     judge pass (as `none_r3`) — that import is the harvest's job, not this
#     config's.
#
# serving target (== rounds 1, 2 and 3's pin, AND the gemma4e4b_it_doc fit model): google/gemma-4-E4B-it @ ee0ef6023621cff504d758262d4e04895a5af4a2

# -- the explicit cell enumeration (ordered; the registry is EXACTLY this) ---
explicit_cells:
- none
# the INSTRUCT-DIRECT full-corpus objects (both CE arms), trained on and served
# by the instruct checkpoint above — staged from out/gemma4e4b_it_doc/cells_all
- constv2-mix-full__psr_ce_all
- constv2-mix-full__lora_r4_ce
# the base-fit 1M LoRA's NEW object (sha 370c0755…; staged base -> instruct
# from out/gemma4e4b_base/cells_all — the one cell of this wave that IS a transfer)
- constv2-mix-1m__lora_r4_ce

