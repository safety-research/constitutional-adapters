# sdfbase_full22_qwen35_4b.padobj_roster.yaml — the PADDED STATIC leg's STEERED family: the LANE-OWNED roster of ONE wave-bank view,
# `qwen35_4b/padobj` (docs/static_padding.md). GENERATED by scripts/sdfbase/full22/static_padding/make_padding_configs.py —
# never hand-edited (tests/test_static_padding_wave.py requires byte-identity). NOT a production roster and never a
# production view: the production roster names no `padobj` view (common.sh f22_bank_view refuses a non-production
# roster that names a production view — the bank view $SHARED/exp/objects/sdfbase/full22/qwen35_4b/cells_view/padobj is shared
# state keyed by name). The sbatch (target_static_padded_obj.sbatch) sets F22_ROSTER to this file before f22_init, so
# every roster reader of the job (roster_cell_count.py, make_bank_view.py) reads THIS view.
#
# THE CELLS (9 served: 7 staged objects + 2 prompted baselines; the
# configs list them after the same-wave `none` anchor):
#   * the five fitted s1 objects map to the SAME staged ids the production roster's `s1` view maps (read from it,
#     pinned in configs/sdfbase_full22_pins.json) — the string form, byte for byte the production mechanism;
#   * `arditi_allpos` and `constv2-mix-full__psr_ce_all_minus_ctl` are named through the CROSS-BANK PIN FORM (2 entries;
#     f22_roster.PIN_FORM_KEYS, make_bank_view.plan_pin_entry): the view entry is a symlink to the OWNING lane's staged copy
#     (exp/objects/arditi_allpos/qwen35_4b/ladder/cells/ar_c0p3__arditi_allpos, exp/objects/paired_write/qwen35_4b/cells/
#     paired_s1__constv2-mix-full__psr_ce_all_minus_ctl) whose bytes are re-hashed to the pin; no bytes are copied into the wave bank,
#     and the form has no staged_id / rung field, so no roster edit can substitute a rung. The Arditi RUNG (c = 0.3)
#     is the pin's, never the cell id's: the harness id is the bare Class B `arditi_allpos`. The paired write is the
#     FULL-dose seed-1 fitted object (object_sha256 f98f0349…, the same bytes the production `s1p` view stages as
#     paired_eb64s1__constv2-mix-full__psr_ce_all_minus_ctl — held equal by the generator); the half-dose view and every *_distilled
#     object are OUT; served_layer 0 is the pin's own (the first of its 32 served blocks).
#   * the two prompted baselines map to null (the SI text as the system prompt; no object, no view entry).
# Wave-wide keys and the target's model pins are the production roster's AS DATA; `lane_flags` is empty because no lane
# rides this view.
