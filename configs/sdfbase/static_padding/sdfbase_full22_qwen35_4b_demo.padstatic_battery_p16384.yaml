  controls_max_new_tokens: 512
  attacker_max_new_tokens: 1024
  # full22: the static/replayable single-shot families (pasttense, codeattack,
  # renellm, grok420) decode to THIS cap (jailbreak_run._static_max_new_tokens)
  # PADDED LEG (docs/static_padding.md): the cap is the static ladder's CEILING (16,384; ladder_decide.CEILING), not
  # the campaign's 4,096 the comment above describes — at EVERY level, the p0 control included, so padded and unpadded
  # are contrasted at ONE cap. WHY: this leg is PREFILL-bound (a hybrid target with no prefix caching re-prefills the whole
  # pad on every request) and a cap costs only for tokens actually generated, so the ceiling's marginal price is the decode
  # of the items that would have hit 4,096 — while an escalation rung would re-pay the FULL pad prefill for every
  # re-drawn item, and the rung driver (escalate_static.assert_base_unpadded) refuses a padded base outright, so a >1 % at-cap
  # share could only be met by regenerating the whole level. The ceiling cap makes the leg single-pass: run once, never climb.
  static_max_new_tokens: 16384
# STATIC PADDING (docs/static_padding.md): the store's pinned contract — 16,384 neutral PG-19 filler tokens ADDED to
# every item's user turn, placement `before` (between a prompted cell's system instruction and the payload; a long
# prefix for the bare anchor), mode `fixed` (one filler text, grown with the target). The filler PATH rides the sbatch's
# argv (--static-padding-filler, sha-verified first) and the tolerance is the library default (2 %); neither is restated
# here. reserve 8,192: the window preflight's headroom for SI + payload + template (the constitution SI alone renders
# to 5,973 tokens; the library default 2,048 would admit a run the server then refuses). One contract per store: the
# harness refuses to mix padded / unpadded rows or two blocks in one responses file — hence this config's own private_run.
