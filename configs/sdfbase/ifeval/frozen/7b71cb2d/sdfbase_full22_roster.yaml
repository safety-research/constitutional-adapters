# sdfbase_full22_roster.yaml — THE cell roster of the full22 wave (sdf-base-steering-r2,
# sdf-base-steering-r2): four served targets, every staged object, and how each one is (or is not)
# expressible to the code that serves it. Source of truth for
#   * scripts/sdfbase/make_full22_configs.py  -> configs/sdfbase_full22_*.yaml (explicit_cells)
#                                              -> configs/capeval/manifests/petri_full22_*.yaml
#   * scripts/sdfbase/full22/make_bank_view.py -> the per-config object bank the standup consumes
#   * scripts/sdfbase/full22/submit_full22.sh  -> which (target, view) pairs have anything to serve
#   * scripts/sdfbase/full22/submit_newmodels.sh -> the nemotron3nano4b / glm46vflash legs' plan
# EVERY reader resolves a (target, view)'s served cells through ONE function,
# scripts/sdfbase/full22/f22_roster.py served_cells(): the view's `cells` plus every lane whose
# flag is on — so a flag flip regenerates the configs, the bank views, the job-side count guard
# and the printers together, never one without the others.
#
# WHY A ROSTER AND NOT JUST explicit_cells. The staging layout is
# $SHARED/exp/objects/sdfbase/full22/<target>/cells/<lane>__<cell_id>/ (lane prefixes because the
# base-lane and instruct-direct cells share ids). The code's cell-id grammar
# (sisteer.eval.defense_cell: none | prompted__<si> | <si>__<arm> | stacked__<si>__<arm>) has NO
# lane slot, and the Petri harness vocabulary (si_<si>__<method>, manifest.PETRI_SI_IDS,
# defense_cells.CLASS_A_METHODS, registry_adapter.ARM_OBJECT_KINDS) cannot name a lane either.
# So a config lists cells in the code's grammar, and THIS file maps each config cell to the
# staged directory it is served from, via a per-config bank VIEW (cells_view/<view>/<cell_id>
# -> ../../cells/<staged_id>, sha-verified against staging_manifest.json). Two lanes whose ids
# collide (base vs instruct-direct) therefore live in two configs, each with its own same-wave
# `none` anchor — the `_it` battery precedent (battery_it_recipe.md), never a lane-prefixed id
# the registry would refuse.
#
# status vocabulary (per cell):
#   served               listed in a config's explicit_cells; bank view resolves it
#   pending_fit          not yet fitted (a Slurm fit still RUNNING); enable by staging the object
#                        (stage_full22.sh BANK_CELLS), refreshing the pins (--pins-from
#                        <staging_manifest>), moving the entry into views.<view>.cells, regenerating
#   pending_stage        built elsewhere and code-servable, but not yet staged on the clusters (so
#                        it carries no pin). A target-level `pending_stage:` map, same shape as
#                        `pending_fit:` (config cell id -> staged id); enabling it is mechanical
#                        and needs no code — refresh the pins (--pins-from <staging_manifest>),
#                        move the entry into views.<view>.cells, regenerate
#   pending_decision     a fit that ended WITHOUT an object and whose fate is an open decision, not
#                        a mechanical step (a deliberate STOP; a floor-ratio refusal). A
#                        target-level `pending_decision:` map, config cell id -> {staged_id,
#                        waits_on, state}. Enabling one = the user's go, then (re)fit -> stage ->
#                        --pins-from -> move into views.<view>.cells -> regenerate. It is NEVER
#                        auto-enabled by a fit landing.
#   prompted             a PROMPTED BASELINE, `prompted__<si>: null` in a view's cells (2026-09-08):
#                        the SI text as the system prompt, NO object and NO staged dir, so it is
#                        served (in explicit_cells, the manifest, the count guard) but never in the
#                        bank view or the pins (f22_roster.staged_cells is the object consumers'
#                        subset; roster_cell_count.py --staged is the view's reference count). The
#                        served path verifies the SI bytes per request against the manifest's
#                        prompted_prefix_hashes (H8)
#   lane (behind a flag) a whole lane wired per target under `lanes.<lane>.cells` but admitted to
#                        the configs / manifests / views ONLY while `lane_flags.<lane>.enabled` is
#                        true (f22_roster.served_cells). The flip is one line + regenerate; the
#                        flag's `preconditions` name what must be true first, and the wave test
#                        refuses a flag that is on while this tree cannot translate the lane's SI
#                        ids for the Petri harness. Today: candsi, OFF.
#
# The object identity of every served cell is pinned in configs/sdfbase_full22_pins.json
# (object_sha256 per staged_id, copied from the staging manifest by make_full22_configs.py
# --pins-from) and echoed into each config header; the bank view builder refuses a staged object
# whose sha differs from the pin.
wave: full22
bank_root: exp/objects/sdfbase/full22            # under $SHARED on either cluster
staging_manifest: exp/objects/sdfbase/full22/staging_manifest.json
# the serving-implementation commit the Petri manifests freeze: the LAST commit touching
# src/sisteer/capeval/serving/*.py or tiers/petri_runner.py on the wave tree. Re-pinned at
# landing (README "Re-pin at landing"), regenerated into every manifest by the generator.
serving_impl_commit: 94e294c445dc5eec6ebe0ce3a3e25553004cd4b0
# the lens reduction mode of the whole wave — every standup pins AND asserts it (never per_row)
lens_reduction_mode: stacked
# the static/replayable single-shot families' completion cap (attacks.static_max_new_tokens)
static_max_new_tokens: 4096
# the MULTI-TURN TARGET's per-reply cap (attacks.target_max_new_tokens; Crescendo / PAIR /
# ActorAttack through jailbreak_run._target_max_new_tokens). 512 was mt1's and every filed
# full22 multi-turn store's; the 4,096-cap re-runs of 2026-09-11 (71 % of the filed
# replies sat exactly at 512, and at 4,096 the SAME cells truncate 0-1 % with the p99 reply at
# ~1.6k) made 4,096 the canonical instrument (2026-09-11). The BoN cap
# (bon.max_new_tokens) is NOT this knob: it stays 512, the base of the 512 -> 4,096 climb.
target_max_new_tokens: 4096
# the judged OVER-REFUSAL controls' completion cap (attacks.controls_max_new_tokens; XSTest / OR-Bench
# through served_capability_run and sisteer.eval.cell_controls.controls_cap, the ONE reader): 512, the
# root of the sampled ladder 512 -> 2,048 -> 8,192 and every filed greedy control store's cap. Its OWN
# key since 2026-09-11: the controls used to read target_max_new_tokens (the shared completion cap),
# so the multi-turn ruling above would have re-capped and re-keyed them silently; they do not move with it.
controls_max_new_tokens: 512
# THE CONTROLS STANDUP'S WINDOW FOR A gsm8k-BEARING TABLE VIEW (2026-09-14). The wave's ONE
# controls standup (target_static.sbatch: capability:short serving gsm8k + mmlu + xstest + or_bench_hard_1k)
# stood every table view up at 2,048 tokens, a window sized for the RETIRED 0-shot gsm8k leg (<= 1.1k prompts).
# The standard Inspect gsm8k control's 10-SHOT system turn renders to 2,310 / 2,373 / 2,336 / 2,128 tokens bare
# on gemma4e4b / qwen35_4b / nemotron3nano4b / glm46vflash and up to 2,462 under the prompted__safety_refusal
# turn (geometry capability:gen_long_gsm8k_rung, measured 2026-09-10); + the 512 cap = 2,974 > 2,048, so vLLM
# refused the long items and the wave's own gsm8k control never produced a row on those 31 views. THE CAP
# NEVER SHRINKS TO FIT A WINDOW (the standing truncation rule): the window widens, S follows from the budget.
# Read by f22_roster.gsm8k_controls_window -> view_windows(...)["controls_gsm8k"] for a TABLE view whose
# controls list carries gsm8k (roster_view.py `window gsm8k`; target_static.sbatch / smoke_full22.sbatch
# CTL_L; submit_newmodels.py); a view's own serving override is its own pin and is not touched. Data here
# because roster_view.py runs under plain python3; held to the table by tests/test_f22_gsm8k_controls_window.py
# and, at job time, by common.sh f22_gsm8k_window_check (>= the derived minimum, by name, before the standup).
controls_window:
  gsm8k: 4608
  source: "geometry.derived_window('capability:gen_long_gsm8k_rung', controls_max_new_tokens=512, from_field='max_prompt') = align128(next_block(2,462 + 512)) = 3072 is the MINIMUM (the GSM8K paired-200 prompt budget's pooled MAX prompt, qwen35_4b under the safety turn, thinking-ON render; the thinking-OFF render the controls run under differs by -2..+4 tokens); the window is the geometry table's capability:gen_long max_model_len = 4608 -- the window the GSM8K lane's paired-200 cap-512 leg (gsm8k-paired200-paper-objects, thinking OFF) stood up at on all four models, and where nemotron3nano4b's hybrid concurrency ceiling is MEASURED (HYBRID_WINDOW_SEQS_CEILINGS: 167 at 4608, job 483254_2), so the standup cannot refuse at readiness on an unmeasured hybrid capacity. S at 4608: gemma4e4b 128 / qwen35_4b 161 / nemotron3nano4b 167 / glm46vflash 170. Measured 2026-09-14: smoke 503471 refused 34 of 200 gsm8k items at 2048 on the llama render (max 1,537)."
# CONTROLS RETIRED FROM THE WAVE'S CONTROLS LEG, WAVE-WIDE (2026-09-14; f22_roster.controls_retired ->
# view_controls drops them from EVERY view's list: the wave's and the smoke's controls driver, the sampled sbatch's
# gsm8k gate, the printers). Distinct from a target's capability_omitted ON PURPOSE: that key also rewrites the sampled
# lane's readouts.gsm8k to an omission record (make_sampled_configs.expected_readouts) and the drivers' run records
# (sisteer.eval.capability_omissions) -- the FROZEN instrument of runs that already happened (the sixteen live main
# sampled configs are pinned as data by tests/test_sdfbase_full22_sampled.py); a wave-wide retirement leaves those
# records alone. The controls_window.gsm8k block above stays as a dormant guard.
controls_retired:
  gsm8k: "retired 2026-09-14: the paper uses ONE GSM8K instrument -- the evaluation lane's inspect/gsm8k_paired200 lane (thinking ON, 8,192 cap with a 16,384 rung, k=1, served at its own windows), which covers every paper cell -- so the wave's controls-leg gsm8k (the same 200 items, thinking OFF, greedy, cap 512, riding the capability:short controls standup) is a second, non-canonical GSM8K measurement and is RETIRED on every target (the llama8b precedent of 2026-09-10, made wave-wide). It had produced no row on the four gsm8k-bearing targets since gsm8k became the 10-shot Inspect control: its prompts (max 2,462 with the safety turn) + the 512 cap overflowed the 2,048 controls window (smoke 503471 refused 34 of 200 items there), and keeping it would have held the whole controls phase at the 4,608 window. The controls standup returns to capability:short's 2,048 with full S; controls_window.gsm8k stays as a dormant guard for a roster that drops this retirement. This key is deliberately NOT a per-target capability_omitted: that key also rewrites the sampled lane's readouts.gsm8k and the drivers' run records -- the frozen instrument of runs that already happened -- which this wave-wide retirement leaves alone"
# THE CANONICAL BEST-OF-N (2026-09-11): the 512 store PLUS the 4,096 CLIMB of its
# cap-coherent at-cap draws, re-drawn with the SAME per-draw seed AT THE SAMPLER THE STORE RECORDS
# (`bon_climb_decode: as_drawn`, sisteer.eval.attacks.bon_climb.CLIMB_DECODE). `bon.max_new_tokens`
# stays 512 -- it is the BASE of the climb, not a competing cap -- and `bon.climb_cap` is where the
# escalation lands. A cell with NO 512 store (the Llama lane) runs best-of-N NATIVELY at the climb cap
# instead; scripts/sdfbase/full22/bon_climb_plan.py decides that per cell and records which.
# Loop-flagged draws are NOT regenerated, by ruling (a repeating draw repeats further): an accepted
# component of the residual floor, counted and reported, never silently dropped.
# THE SAMPLER (2026-09-17, replacing the wave-wide `bon_climb_temperature: 1.0`): best-of-N
# draws at EACH SERVED MODEL'S VENDOR PRESET -- the results registry's `<model>|bon|off|vendor_preset` row
# (configs/registry/decode_policy_seed.yaml; the same numbers the sampled static lane sends, Qwen's
# presence_penalty 1.5 included), never a per-lane temperature -- so no scalar can stand here. Every
# store drawn BEFORE that ruling was drawn at the grandfathered temperature 1.0 (the registry's
# superseded `|bon|off|grandfathered_T1` rows, readable by name); a climb re-draws those stores' at-cap
# slots under exactly the sampler their rows record (a legacy store: the grandfathered row, by name),
# and a native pass draws at the vendor preset like any new store. The store and its climb are never
# at different samplers; the per-draw seed rule and the augmentation are untouched.
bon_climb_cap: 4096
bon_climb_decode: as_drawn
# the attacker's serving defaults, recorded so every cell of every target is generated under the
# SAME attacker: configs/attacker_serving.json on this tree = prefix_caching true, quantization
# none (the sbatch passes --prefix-caching on explicitly; recorded in attacker_engine.json)
attacker_prefix_caching: true
attacker_quantization: none

# LANE FLAGS (2026-09-07). A lane listed here is wired for every target that maps it
# (`targets.<key>.lanes.<lane>.cells`, config cell id -> staged id) and enters that target's
# configs only while `enabled` is true. Flipping a flag is the WHOLE enablement on the roster
# side: regenerate (make_full22_configs.py), rebuild the bank views, re-pin the wave sha.
lane_flags:
  candsi:
    enabled: false
    view: main                                   # the lane's cells are the served model's own fits
    blocker: >
      The candidate-SI ids A10 / B3 / C16 are registered only by the candidate-si-refit
      lineage (origin/candidate-si-refit, 230 commits ahead of main, mid-integration as
      INT-1 by a live peer session): data/instructions.py loads them from a private text file
      under the env-guarded loader (SISTEER_LOAD_CANDIDATE_SIS -> sisteer.data.candidate_sis),
      and the Petri vocabulary maps them as safety_a10 / constitution_b3 / irrelevant_c16
      (registry_adapter.HARNESS_TO_TRAINTEST_SI, manifest PROMPTED_*). NONE of that is on
      lens-grouped-scope or sdfbase-mt, so on this tree `A10__psr_kl_all` fails
      resolve_instruction and the registry refuses it. Serving these cells needs that lineage
      merged into the wave tree AND the candidate SI text file present on every node that
      stands up a server (the pseudo-instruction must resolve at standup).
    preconditions:
      - the candidate-si-refit lineage is merged into the wave tree, so registry_adapter
        translates A10 / B3 / C16 <-> safety_a10 / constitution_b3 / irrelevant_c16 and
        data/instructions.py resolves them (tests/test_sdfbase_full22_wave.py refuses the flag
        while this is false), and the candidate SI text file is present on every standup node
      - every candsi staged dir declares exactly ONE identity sidecar. VERIFIED 2026-09-07 on
        cluster A, all 12 nemotron3nano4b / glm46vflash dirs (and the gemma / qwen ones are the
        same lineage) carry BOTH fit_provenance.json AND train_budget_meta.json — the refit
        lineage's fit writes both — which make_bank_view.py / train_budget.object_identity_kind
        REFUSE as ambiguous. Pick the authoritative spelling and re-stage without the other
        (both record the same object_sha256, so this is a bookkeeping choice, not a data one)
      - the pins already exist (configs/sdfbase_full22_pins.json, 6 per target, verified on both
        clusters) — nothing to re-stage for the bytes themselves

targets:
  gemma4e4b:
    model: google/gemma-4-E4B-it
    model_revision: ee0ef6023621cff504d758262d4e04895a5af4a2
    body_config: configs/sdfbase_transfer_gemma4e4b_r3.yaml      # battery keys, byte-for-byte as data
    # the strength frontier's TWO ladder families on this ONE served instruct model (2026-09-15): `it_d<tok>` = the
    # instruct-direct objects (the batch-64 refit lineage), bare `d<tok>` = the paper's BASE-FIT objects (the `main` view's
    # base__ / derived__ parents, batch-8) TRANSFERRED onto the instruct target — constitution, CONTROL and subtraction, six doses.
    dose_families: [it, main]
    views:
      main:
        config: configs/sdfbase_full22_gemma4e4b.yaml
        manifest: configs/capeval/manifests/petri_full22_gemma4e4b.yaml
        cells:                                    # config cell id -> staged id (ordered)
          constv2-mix-full__psr_ce_all: base__constv2-mix-full__psr_ce_all
          constv2-mix-full__lora_r4_ce: base__constv2-mix-full__lora_r4_ce
          constv2ctl2-full__psr_ce_all: base__constv2ctl2-full__psr_ce_all
          constv2ctl2-full__lora_r4_ce: base__constv2ctl2-full__lora_r4_ce
          safety_refusal__psr_kl_all: si12__safety_refusal__psr_kl_all
          safety_refusal__lora_r4: si12__safety_refusal__lora_r4
          # the CONSTITUTION-SI PROMPTED BASELINE (2026-09-12): one of the paper's six
          # arms; Figure 2's single-shot panel reads the SAMPLED instrument, so the arm exists there. The registry's
          # si_constitution text (harness alias `constitution`, registry_adapter) as the system prompt on the served
          # target — NO object, NO staged dir: served (explicit_cells, the manifest as `prompted__constitution`, the
          # count guard), never in the bank view or the pins; H8-verified per request against
          # PREFIX_HASHES.constitution 21e06f482a6559b3 = the hex16 of sha256
          # 21e06f482a6559b39309c4f1128f0411230c88e02b3a9eaa7b5d50829e6a9a0f over the 31,222 SI bytes (the full
          # sha rides in every sampled standup's si_prefix_record.json). Its system turn is ~6k tokens, so the
          # sampled jobs serve it at the LONG-SI windows (common_sampled.sh f22s_base_window / f22s_rung_window
          # under F22S_LONG_SI), never the :short ones. Listed BEFORE the derived pair, which stays LAST on this view.
          prompted__si_constitution: null
          # the DERIVED pair (code-unblocked 2026-09-06; staged for this target 02:01Z the same
          # day, sha-verified on both clusters). Same construction as qwen35_4b's, NOT the same
          # quality — read before treating the two targets' decompositions symmetrically. From
          # the gemma residual's own staged derived_meta.json / report.json / gate_liveness.json:
          #   distill EARLY-STOPPED at best epoch 48 (ran 53/60; no held-out improvement for 5
          #   epochs), best held-out loss 6.757; qwen's ran to the cap (best epoch 59), 0.5455.
          #   gate liveness over 42 layers: derived_meta block min 0.030 / mean 0.653 with 11
          #   layers below 0.5 (gate_liveness.json min 0.035); qwen's 32 layers min 0.675 /
          #   mean 0.955, none below 0.5 (gate_liveness.json min 0.813). recovery_verdict is
          #   `recovered` on both. Servable and worth serving; any cross-target comparison of
          #   the residual must carry this asymmetry.
          constv2-mix-full__psr_ce_all_minus_ctl_distilled: derived__constv2-mix-full__psr_ce_all_minus_ctl_distilled
          constv2-mix-full__lora_r4_ce_minus_ctl: derived__constv2-mix-full__lora_r4_ce_minus_ctl
      it:
        config: configs/sdfbase_full22_gemma4e4b_it.yaml
        manifest: configs/capeval/manifests/petri_full22_gemma4e4b_it.yaml
        cells:
          constv2-mix-full__psr_ce_all: itdoc__constv2-mix-full__psr_ce_all
          constv2-mix-full__lora_r4_ce: itdoc__constv2-mix-full__lora_r4_ce
          # the BATCH-64 INSTRUCT-DIRECT lane (`itdoc64__` / `derived_itdoc64__`; the 64 names the parents' effective batch,
          # record key gemma4e4b_it_doc_eb64; staged + sha-verified on both clusters 2026-09-13 — staging_manifest rows from
          # 71_stage_parents_full22.py / 72_stage_derived_gemma_full22.py): the register-matched CONTROL LoRA fit and the DERIVED
          # LoRA subtraction of the two itdoc64 parents (constitution minus control; sidecar derived_meta.json, held to the
          # same derived verdict as main's pair). ADDED, never repointed: `constv2-mix-full__lora_r4_ce` above still names
          # the batch-8 `itdoc__` object every filed it-view store points at (2026-09-13: mixing batch-8 and
          # batch-64 is fine for now; the coordinator withdrew the repoint). Mirrors qwen35_4b/it (PR #102). Objects before the
          # prompted cells, which stay LAST. The bank view cells_view/it on both clusters must hold these two entries at the
          # same commit: make_bank_view.py refuses a view short of, or wider than, the roster, so they land and revert together.
          constv2ctl2-full__lora_r4_ce: itdoc64__constv2ctl2-full__lora_r4_ce
          constv2-mix-full__lora_r4_ce_minus_ctl: derived_itdoc64__constv2-mix-full__lora_r4_ce_minus_ctl
          # the MATCHED PROMPTED SAFETY-SI CELL on the instruct-direct view (lane F of the sampled re-run, 2026-09-09;
          # the roster's prompted grammar `prompted__<si>: null`, as nemotron3nano4b/main and glm46vflash/main): the
          # safety_refusal SI as the system prompt on the served instruct target, NO object and NO staged dir — served
          # (explicit_cells, the manifest as `prompted__safety`, the count guard), never in the bank view or the pins.
          # The greedy wave already ran this cell on both `it` views (the prompted lane, older config grammar; its flags /
          # grades / transcripts are filed under the *_prompted run-state roots); this entry makes the roster say so, so
          # the sampled re-run's `_it` configs serve none + the two itdoc objects + this baseline. Listed LAST.
          prompted__safety_refusal: null
          # the CONSTITUTION-SI PROMPTED BASELINE on the instruct-direct view (2026-09-12;
          # the same cell as the main views'): the registry's si_constitution text as the system prompt, NO object and NO
          # staged dir — served, never in the bank view or the pins; H8 hash 21e06f482a6559b3 (sha256 21e06f48…6a9a0f,
          # 31,222 bytes). Served at the LONG-SI windows (F22S_LONG_SI). Listed LAST, after the prompted safety cell.
          prompted__si_constitution: null
      # --- DOSE LADDER (2026-09-10; the STRENGTH FRONTIER, paper Figure 5): the constitution LoRA — and,
      # on the chat-checkpoint lanes, its control-subtracted difference — served at doses -1, 0.1, 0.25, 0.5, 1 and
      # 1.5 of the fitted object, ONE VIEW PER DOSE so every dose gets its OWN same-pass `none` anchor from the
      # generator (the halfdose precedent on nemotron3nano4b; the strength-frontier rule) and the config's
      # cell-id grammar never has to name "which copy". The rules, in force for every dose view of every target:
      #   * NAMING: `d<tok>`, <tok> the dose with `p` for the point and `m` for the minus sign (0.1 -> d0p1,
      #     0.25 -> d0p25, 0.5 -> d0p5, 1 -> d1, 1.5 -> d1p5, 2 -> d2, 4 -> d4, -1 -> dm1), prefixed `it_` on the instruct-direct
      #     lanes (gemma4e4b, qwen35_4b). The dose is PARSEABLE from the view name, and the view's `dose:` key
      #     must agree with it — make_full22_configs.py refuses a mismatch in either direction (a dose-named
      #     view without the key, a keyed view whose name says another dose).
      #   * DOSE 1.0 IS RE-SERVED, NOT BORROWED: `d1` / `it_d1` map the UNSCALED staged objects (`itdoc__`,
      #     `base__`, `derived__`) AGAIN — the ep16re precedent, the same object served in the same pass — so the
      #     frontier's 1.0 point comes from the same code, the same day, the same anchor and the same instrument
      #     as its neighbours; the campaign's `it` / `main` rows are NOT this point and never stand in for it.
      #   * DOSE 0.5 REUSES THE HALFDOSE BYTES: `d0p5` / `it_d0p5` map the existing `halfdose__` /
      #     `halfdoseit__` LoRA copies — B x 0.5 is the same bytes whatever lane serves them — so no 0.5 object
      #     was rebuilt; only the view (its anchor, its sampled instrument) is new. A staged id therefore
      #     appears in MORE than one view exactly here (d1, d0p5, and nemotron3nano4b's halfdose): the wave
      #     test admits a repeat only as a view cell under the same config cell id, never from a lane or a
      #     pending map.
      #   * THE SCALING (scripts/sdfbase/scale_lora_dose.py, as halfdose): the served o_proj edit (x @ A) @ B^T is
      #     linear in the write basis, so a dose copy scales B ONLY (B_pos and B_neg together for the
      #     subtraction) and leaves A untouched. Each copy is its own object — own sha; parent sha, scale,
      #     method and a three-level verification (tensors, served ops, served activation) in its sidecar's
      #     dose_scaled_from and the build ledger — staged and sha-verified on both clusters before pinning.
      #   * A NEGATIVE DOSE IS THE EXACTLY-REVERSED EDIT (`dm1`: same magnitude, opposite sign), admitted
      #     because the served op is a plain multiply — nothing in the adapter or the lens assumes a sign.
      #   * BoN CAP: every dose view's generated config carries `bon.max_new_tokens: 4096` where the
      #     campaign body says 512: BoN decodes NATIVELY to the static families' cap in ONE pass at T=1.0 for
      #     every dose, instead of the campaign's two-pass 512-store-plus-climb, whose counterfactual mixes two
      #     caps inside one number and cannot be reproduced across a ladder without rebuilding each dose's 512
      #     store. `attacks.target_max_new_tokens` stays 512 (multi-turn and the judged controls read it). The
      #     frontier's BoN 1.0 point is therefore NOT the campaign's published BoN number and is never quoted as it.
      #   * NO PROMPTED CELL in a dose view: the ladder contrasts objects against the anchor, nothing else.
      # Serving code is this tree's; the only additions are these views, their pins and the generator's
      # dose-view override. Instruct-direct lane: ONE cell per view (no instruct-direct derived object exists).
      it_dm1:
