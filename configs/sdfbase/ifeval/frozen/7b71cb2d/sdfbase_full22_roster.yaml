  # --- llama8b (the sdfbase-llama8b lane, 2026-09-10): the INSTRUCT checkpoint serves every view; the
  # base-lane objects are TRANSFERRED onto it (view main), the instruct-direct objects applied natively
  # (view it), each view with its own same-wave `none` anchor. Cell ids collide across the two lanes by
  # construction (the code's grammar has no lane slot), so the lanes are two configs, never lane-prefixed
  # ids. No sdfbase transfer lineage exists for this target: the battery body is the qwen35_4b _r3 data
  # with the pins of configs/two_si_llama_fits.yaml (the nemotron precedent). The base checkpoint is a
  # fitting target only and is never served (no chat template -> the template-hash gate refuses).
  #
  # The eight fits + the derived pairs are named under each view's `pending_fit` until they land and are
  # STAGED: the generator prints them in the config header, every_staged_id counts them, and enabling one
  # is the plan's flow (fit -> stage -> --pins-from <staging_manifest> -> move into `cells` -> regenerate).
  # Pins are never invented here. What is servable NOW: the matched prompted safety baseline on main and
  # it, and the FULL-constitution prompted baseline on its own view.
  llama8b:
    model: NousResearch/Meta-Llama-3.1-8B-Instruct
    model_revision: d10aef7999a2b5ba950ab3974312feeedbfe0b77
    body_config: configs/sdfbase_transfer_qwen35_4b_r3.yaml
    pins_config: configs/two_si_llama_fits.yaml
    # THE XSTEST CONTROL SET (Scale, 2026-09-10; review P2-6): the over-refusal control is the 250 SAFE
    # prompts only — never the 200 contrast rows (a different measurement). Emitted top-level into every
    # view config of this target; the controls drivers select the half before the seeded subset, the
    # item hashes and every cap-ladder input, and a 250-row store keys apart from a 450-row one.
    xstest_subset: safe
    # THE REPLICATE-FLOOR PAIR (Evals, 2026-09-10): the two lane views share the SAME unsteered instruct
    # model, so their two `none` anchors are identical by construction and measure run-to-run noise
    # directly; any extra replicate goals go into the baseline arm, never split evenly
    replicate_floor:
      pair: [main, it]
      note: "the main and it views' `none` anchors are the same served model with no object — identical by construction; their disagreement is the per-cell replicate floor every contrast is read against"
    # -- llama8b caps: BEGIN (rendered from the lane's caps table, the coordinator's directive; regenerated by the lane's staging launcher — edit the table, not this) --
    # THE TOKEN CAPS of this lane's wave (eval-time, per leg; the canonical battery of 2026-09-11,
    # with its IFEval / BoN provenance, 16,384 rung and ActorAttack rules): applied by the generator — multiturn_target (PER FAMILY;
    # 4,096 per reply for Crescendo / PAIR / ActorAttack) becomes the per-family map attacks.multiturn_target_max_new_tokens, a
    # key ONLY the multi-turn path reads (resolved for the family it runs); each family's multi-turn serving window is DERIVED
    # from ITS cap (geometry.multiturn_window; S from the budget) unless caps.windows below PINS it wider (the pinned-window
    # mechanism; the ruling's values); bon.max_new_tokens is WRITTEN from `bon` (the NATIVE 4,096 best-of-75 pass — no 512 store,
    # no climb); every other cap is asserted EQUAL to the value the body / the roster already carries for its leg. Recorded
    # with its source in the wave manifest.
    caps:
      source: "the canonical battery of 2026-09-11 (IFEval / BoN provenance, the 16,384 rung under the 1% rule, record-only controls, ActorAttack kept at 4,096 / 49,152 x 9)"
      multiturn_target:          # FLAT per family: no ladder for multi-turn (a truncated reply feeds the next attacker turn)
        source: "the canonical battery of 2026-09-11: 4,096 per reply for every multi-turn family; ActorAttack KEPT at 4,096"
        crescendo: 4096
        pair: 4096
        actorattack: 4096
      attacker: 1024             # attacks.attacker_max_new_tokens — the attack, not the measurement
      static: 4096               # attacks.static_max_new_tokens = the base of the 4096 -> 8192 -> 16384 ladder (each rung only while > 1% truncated non-loop at the rung below)
      bon: 4096                  # bon.max_new_tokens, WRITTEN by the generator: the NATIVE 4,096 pass (route native_4096; the other lanes climbed a 512 store to 4,096 — same estimand, different route)
      controls_ladder: 512       # attacks.target_max_new_tokens = the over-refusal ladder's start (512 -> 2048 -> 8192 -> 16384, the same 1% rule)
      petri: 1024                # per target turn at the 16,384 window (petri_runner.target_response_cap = window // 16; nothing else sent)
      # the multi-turn SERVING WINDOWS PER FAMILY, PINNED over the derivation (the pinned-window mechanism; the values of the
      # canonical battery of 2026-09-11: Crescendo 49,152 = the canonical measured window, PAIR 16,384 = the canonical window,
      # ActorAttack 49,152 = the Crescendo window with ~16k margin; the re-run pins are our typed over-window safety net): a pin
      # is honoured by geometry.multiturn_window(cap, pin) / multiturn_rerun_window(cap, pin) over the family's derived value and
      # REFUSED below the derived minimum (p99 prompt + cap; measured max call + cap), off the 128-token grid, or as a re-run
      # window not wider than the first pass; S = budget_for(llama8b) // L. The generator writes them into the view configs as
      # the per-family maps attacks.multiturn_max_model_len / multiturn_rerun_max_model_len (target_attacks.sbatch + the re-run
      # pass read the family's entry; a family without a block derives). The attacker pool's own window is unchanged.
      windows:
        crescendo:
          source: "the canonical battery of 2026-09-11: Crescendo 49,152 = the canonical MEASURED window (Scale's largest target's Crescendo realized context 34,361 and climbing at cap 4,096); re-run 65,536: our typed over-window safety net"
          multiturn: 49152          # the first pass (main + it)
          multiturn_rerun: 65536    # the over-window RE-RUN pass (the first pass's error:PromptOverWindow goals)
        pair:
          source: "the canonical battery of 2026-09-11: PAIR 16,384 = the canonical window (the derived minimum 11,648 is below it); re-run 32,768 x 14: our typed over-window re-run machinery, not the canonical battery's"
          multiturn: 16384          # the first pass (main + it)
          multiturn_rerun: 32768    # the over-window RE-RUN pass (the first pass's error:PromptOverWindow goals)
        actorattack:
          source: "2026-09-11 14:23: ActorAttack KEPT at 4,096, first pass 49,152 x 9 = the canonical measured Crescendo window (at most 7 prior replies, hard worst case ~33k, ~16k margin), re-run 65,536 x 7 the typed over-window safety net; NO measured ActorAttack-at-4,096 window exists yet \u2014 the first cell's realized context is read before the rest go out"
          multiturn: 49152          # the first pass (main + it)
          multiturn_rerun: 65536    # the over-window RE-RUN pass (the first pass's error:PromptOverWindow goals)
    # the capability leg's controls on EVERY view of this target (f22_roster.target_capability_controls); a dropped
    # control is recorded with its reason, like legs_omitted — never inferred from an absent job
    capability_controls: [mmlu]
    capability_omitted:
      gsm8k: "2026-09-10, confirmed 2026-09-11: the paper uses ONE GSM8K instrument (inspect/gsm8k_paired200, thinking ON, 8,192 cap with a 16,384 rung above 3%, k=1, served, item_id pairing) owned by the evaluation lane, which adds Llama once this bank is staged; a vendor-preset thinking-OFF gsm8k here would be the retired instrument"
    # -- llama8b caps: END --
    # the strength frontier's TWO ladder families on this ONE served instruct model: `it_d<tok>` = the instruct-fit
    # objects served natively, bare `d<tok>` = the base-fit objects TRANSFERRED onto the instruct target. A roster fact the
    # wave generator reads (make_full22_configs.dose_families); without it a base-fit dose view is refused as a misspelling.
    dose_families: [it, main]
    views:
      main:                                      # the base-lane objects, transferred onto the instruct target
        config: configs/sdfbase_full22_llama8b.yaml
        manifest: configs/capeval/manifests/petri_full22_llama8b.yaml
        cells:
          # staged + pinned 2026-09-11 (the lane's staging launcher: --pins-from the clusters' staging_manifest; objects first, the prompted baseline stays LAST)
          constv2-mix-full__lora_r4_ce: base__constv2-mix-full__lora_r4_ce
          constv2ctl2-full__lora_r4_ce: base__constv2ctl2-full__lora_r4_ce
          # staged + pinned 2026-09-11 (the lane's staging launcher: --pins-from the clusters' staging_manifest; objects first, the prompted baseline stays LAST)
          constv2-mix-full__lora_r4_ce_minus_ctl: derived__constv2-mix-full__lora_r4_ce_minus_ctl
          prompted__safety_refusal: null           # the matched prompted safety-SI baseline (the harness spells it prompted__safety)
          # DECLARED, NOT SERVED HERE (2026-09-12): the constitution-SI arm exists on main / it / shortconst
          # in this roster but is SERVED on exactly ONE view per evaluation — this lane serves it through the `shortconst` view (static, sampled,
          # BoN, controls, MMLU, Petri, multi-turn); main / it carry the declaration for the per-view instruments other lanes schedule (the evaluation lane's
          # GSM8K + IFEval rows, PR #67). The wave launcher's configs step drops it from main / it before staging (stage_tools DROP_SETS), so no leg
          # of this lane serves the arm twice; the coding lane HOLDS it (admit-and-hold, PR #69). Same cell id and SI sha (21e06f482a6559b3) as shortconst's.
          prompted__si_constitution: null          # the harness spells it prompted__constitution
        # pending_fit: (none — every fit of this view is staged and pinned; the lane's staging launcher moved them into cells)
      it:                                        # the instruct-direct objects, applied natively
        config: configs/sdfbase_full22_llama8b_it.yaml
        manifest: configs/capeval/manifests/petri_full22_llama8b_it.yaml
        cells:
          # staged + pinned 2026-09-11 (the lane's staging launcher: --pins-from the clusters' staging_manifest; objects first, the prompted baseline stays LAST)
          constv2-mix-full__lora_r4_ce: itdoc__constv2-mix-full__lora_r4_ce
          constv2ctl2-full__lora_r4_ce: itdoc__constv2ctl2-full__lora_r4_ce
          # staged + pinned 2026-09-11 (the lane's staging launcher: --pins-from the clusters' staging_manifest; objects first, the prompted baseline stays LAST)
          constv2-mix-full__lora_r4_ce_minus_ctl: derived_itdoc__constv2-mix-full__lora_r4_ce_minus_ctl
          prompted__safety_refusal: null
          prompted__si_constitution: null          # declared, not served here — see the main view's note
        # pending_fit: (none — every fit of this view is staged and pinned; the lane's staging launcher moved them into cells)
      # --- the FULL constitution as a prompted baseline (2026-09-09): its own view because a
      # 34k-token system prefix needs its own serving geometry (45,056 x 10 at the measured 475,136 budget; x 5 at the former 229,376 ceiling)
      # and the user capped its legs — the static single-shot families, best-of-N, MMLU and GSM8K; NOT the
      # multi-turn attacks, NOT the over-refusal controls (xstest / or_bench and their cap ladder), NOT Petri.
      # A prompted cell has no lane, so the cell is served ONCE at its own geometry and read against the
      # `none` on ITS server (the paired anchor) and against both lane views' `none` (cross-server; the
      # geometry-parity check makes that honest). `si_constitution` is the EXCERPT and stays out of this.
      fullconst:
        config: configs/sdfbase_full22_llama8b_fullconst.yaml
        manifest: configs/capeval/manifests/petri_full22_llama8b_fullconst.yaml
        prompted_only: true                        # no object cell by design: `none` + the prompted baseline
        cells:
          prompted__si_constitution_full: null     # the harness spells it prompted__constitution_full
        serving:
          max_model_len: 45056                     # 34,395 (rendered prefix + the longest static prompt) + the 8,192 escalation rung = 42,587 <= 45,056; S = budget_for(llama8b) // 45056 = 10 at the measured 475,136 (was 5 at the 229,376 ceiling)
        legs: [static, bon, capability]
        legs_omitted:
          controls: "cheap legs only — no over-refusal (xstest / or_bench) and no cap ladder for this cell"
          attacks: "no multi-turn (Crescendo / ActorAttack / PAIR) — history would accumulate on a 34k prefix with no enforced bound"
          petri: "the Petri window is certified at 16,384 and the full text alone is 33,980 tokens"
      # --- THE PAPER'S CONSTITUTION-SI ARM (2026-09-12): the SHORT registry SI
      # `si_constitution` (31,222 bytes, 121 lines, sha256 21e06f482a6559b39309c4f1128f0411230c88e02b3a9eaa7b5d50829e6a9a0f — the
      # same bytes three lanes measured; hex16 = PREFIX_HASHES.constitution, verified per request, H8) as a prompted baseline, the
      # SAMPLED LANE'S MECHANISM: cell `prompted__si_constitution` (harness `prompted__constitution`, virtual model
      # `petri__prompted__constitution`), the text resolved ONLY through registry_adapter -> TrainTest resolve_instruction, the
      # FULL sha256 / byte length / first + last line written as si_prefix_record.json at EVERY standup (traffic refused on a
      # mismatch with the routing table). NOT fullconst: distinct cell id, windows, records and virtual model end to end
      # (`prompted__si_constitution_full` ~34k tokens is the Llama-only appendix point above). Its own prompted-only view
      # because the ~5.9k-token system turn (5,887 rendered under the pinned Llama-3.1 tokenizer, 2026-09-12) does not fit the
      # lane views' :short windows; unlike fullconst it runs EVERY leg (no `legs:` key), so its windows are PER LEG, each
      # max-prompt-sized for that leg's cap on the table's 128 grid (align_128(next_block(max rendered prompt under the SI + cap));
      # S = budget_for(llama8b) 475,136 // L) — measured 2026-09-12 with the pinned tokenizer through the served render:
      # static grok420 6,312 (pasttense 5,926 / codeattack 6,001 / renellm 5,985), BoN 2 x longest JBB goal 5,947, or_bench 5,936,
      # xstest (250 safe) 5,905, MMLU 6,624 at max_tokens 1 — so static + BoN 10,496 x 45 (6,312 + 4,096; BoN 5,947 + 4,096 =
      # 10,043 fits), controls 6,656 x 71 (6,624 + 1 the MMLU letter prefill; 5,936 + 512 the judged controls), rungs 2,048 ->
      # 8,064 x 58 (5,936 + 2,048), 8,192 -> 14,592 x 32 (6,312 + 8,192; the static max governs both ladders), 16,384 -> 22,784
      # x 20 (6,312 + 16,384). Multi-turn at the target's pins (caps.windows) — the prefix 5,784 over the safety SI leaves
      # Crescendo 41,433 + 5,784 = 47,217 <= 49,152 and ActorAttack ~33k + 5,784 <= 49,152 — EXCEPT PAIR, whose measured maximum
      # 12,825 + 5,784 = 18,609 no longer fits the 16,384 pin: its first pass is WIDENED here to 18,688 x 25 (the re-run pin 32,768
      # stands). Petri stays at the certified 16,384 x 29 (the cap 1,024 = window // 16 IS the instrument): the llama8b p99 Petri
      # prompt 11,261 + 5,784 exceeds the 15,360 a 1,024 reply leaves, so a materially larger share of target turns than the
      # lane views' will overflow to the runner's 32,768 re-run pass — recorded, not widened.
