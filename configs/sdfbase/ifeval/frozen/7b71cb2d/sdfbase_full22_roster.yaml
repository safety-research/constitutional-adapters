  # --- llama8b (the strength frontier's FOURTH paper family, since GLM was dropped and Llama added on
  # 2026-09-11). ONE served model — the INSTRUCT checkpoint — for EVERY view,
  # including both ladder families below. The Llama lane's own `main` / `it` / `fullconst` views are rostered and
  # generated on THEIR wave tree (branch sdfbase-llama8b-wave); the two views named here carry only what this tree
  # can say about them (the prompted safety baseline, which serves no object) so the ladder's spelling rule has
  # its anchors — nothing of the Llama lane's object cells is rostered, pinned or served from this tree, and the
  # `fullconst` view (prompted-only, a 45,056-token window) has nothing to ladder and is not here.
  #
  # TWO LADDER FAMILIES, ONE SERVED TARGET. The key `llama8b_base` in that lane's bank names where the
  # objects were FIT (the base checkpoint, document cross-entropy, chat template bypassed; sidecar template_hash
  # e3b0c44298fc1c14 = sha256("")), never where they are served: nothing in that wave serves the base checkpoint
  # (no chat template -> the template-hash gate refuses). So:
  #   it_d<tok>  the `llama8b_it_doc` parents (fit on NousResearch/Meta-Llama-3.1-8B-Instruct @ d10aef79) served
  #              NATIVELY — the paper's fourth family (Figures 2/3/5);
  #   d<tok>     the `llama8b_base` parents (fit on NousResearch/Meta-Llama-3.1-8B @ 1f47e50c) TRANSFERRED onto the
  #              instruct target — the base-to-instruct transfer view (the transfer figure).
  # Both families pin the SAME model / model_revision (this target's; the generator derives every config's pin from
  # the target, never from an object bank); the configs differ only in which objects they load. The object bytes
  # are target-agnostic: a LoRA blob carries A / B per layer, rank, layers, positions and response_header_len — no
  # model id — and the sidecar's model_id / model_revision record the FIT target as provenance, which no serving
  # code reads to choose a target.
  #
  # EVERY RUNG IS A LANE-OWNED STAGED ID, 1.0 INCLUDED (this differs from the four other targets' rule).
  # The parents were consumed from the Llama lane's bank ($SHARED/exp/objects/sdfbase/llama8b_full/, sha-verified
  # against their sidecars on cluster A 2026-09-11) BEFORE that lane finished staging them into this bank (the two
  # constitution LoRAs were staged by 18:14Z; the two subtractions were not). Rather than map `d1` / `it_d1` to ids
  # another lane was still staging, the 1.0 anchor is a BYTE-IDENTICAL copy of the parent (same sha; nothing
  # re-serialised; scale_lora_dose.py --anchor) under `d1__` / `d1it__`, and 0.5 is an ordinary scaled copy (no
  # halfdose exists on this target). Consequence: the exactly-once invariant holds here WITHOUT the repeat, and
  # once the Llama lane's `itdoc__` / `base__` / `derived*__` ids are all pinned, the anchor pins equal them sha
  # for sha — two ids, one object, which the pins make legible. TWO cells per view in both families: the
  # constitution LoRA and its control-subtracted difference (both lanes' subtractions exist on this target).
  # Every copy records the parent sha it descends from, the parent's origin path and its state at consumption
  # (dose_scaled_from.parent_origin / parent_consumed_state), and the three-level verification.