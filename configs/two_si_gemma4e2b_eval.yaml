# two_si_gemma4e2b_eval.yaml — EVAL config for the pt829 psr-transfer
# behavioral evaluation (2026-08-28). Derived from
# two_si_gemma4e2b_probe.yaml — the exact config that FIT the E2B
# safety_refusal__psr_kl_all object this evaluation serves (its
# train_budget_meta records this model id + revision) — with FOUR
# eval-side changes:
#   1. model: points at the STAGED weights dir. The shared HF cache does
#      not hold google/gemma-4-E2B-it at the pinned revision 3e22461f
#      (only b4a60110), so the pinned snapshot is loaded from the
#      psr-transfer verified staging copy; model_revision keeps the
#      true pin for the record (from_pretrained ignores it for a local
#      dir; every stamp still carries it).
#   2. class_a_arms: lora_r1_all/bidpo (fit-lane arms with no staged E2B
#      objects) dropped; psr_xfer_from_e4b (+_rw1 ridge ablation) added —
#      the cross-model TRANSFERRED PSR unit (E4B-fit unit mapped into this
#      model's basis; kind 'psr', positions_at_fit=response, H=3). Only
#      e4b-source transfers belong on the E2B config.
#   3. eval_gen_batch_size: 64 (see the E4B config's comment).
#   4. train_kwargs/batch_size_by_arm are fit-time and inert here; kept
#      verbatim so a diff against the probe config shows only the eval
#      deltas. NEVER launch a fit off this config.
si_ids:
- safety_refusal
- si_constitution
- si_irrelevant
defenses_dir: out/two_si/defenses/cells
class_a_arms:
- psr_kl_all
- psr_mse_all
- psr_xfer_from_e4b
- psr_xfer_from_e4b_rw1
class_b_arms:
- antidote
- alphasteer
- caa_static_r
class_c_arms:
- psr_kl_all
- psr_mse_all
class_b:
  benign_prompts_path: $SHARED/exp/jailbreak/contrast/benign_alphasteer.json
  harmful_prompts_path: $SHARED/exp/jailbreak/contrast/harmful_alphasteer.json
  benign_sha256: 24f1a69fcb46d8eaac0993be9365268d59c3ea910feb4044a3897cb0fa242298
  harmful_sha256: 7c6983fca61e13181613c14b18753ecae10cfd2b156f0a4b0104136fb641c5cf
  min_prompts: 500
  layer: 15
model: $SHARED/psr-transfer/models/google--gemma-4-E2B-it
model_revision: 3e22461f65e89153144f8adb70e3b8c2cc9845a7
dtype: bfloat16
attn_implementation: sdpa
layer: 20
scale: 1.0
max_len: 16384
# completion_tokens 512 -> 2048 (pt829 truncation fix, 2026-08-28) — see the
# E4B config for the full rationale; PILOT job 234789 ran on THIS model
# (gemma4e2b/none): grok420 p99 1734 / 0.5% at-cap at 2048 vs ~90% at 512.
# All three cap fields (this, attacks.target_max_new_tokens,
# bon.max_new_tokens) move together; 512 wave kept for refusal/benign.
completion_tokens: 2048
teacher_prefix_cache: false
max_len_by_si:
  safety_refusal: 8192
  si_constitution: 16384
  si_irrelevant: 16384
batch_size_by_si: {}
# eval_gen_batch_size: EVAL-side HF generation width (non-BoN JB legs +
# benign controls) — see the E4B config's comment. Fit widths stay below.
eval_gen_batch_size: 64
batch_size_by_arm:
  psr_kl_all: 2
  psr_mse_all: 1
  lora_r1_all: 1
  bidpo: UNMEASURED_AT_16384_RUN_MEMPROBE_FIRST
train_kwargs:
  default:
    holdout_frac: 0.1
    holdout_salt: two_si_holdout
    epochs: 10
    early_stop_patience: 3
    early_stop_min_epochs: 1
    early_stop_min_delta: 0.0
    floor_ratio_max: 1.0
    probe_n: 256
    positions: response
    response_header_len: null
  bidpo:
    floor_ratio_max: 3.0
  psr_kl_all:
    lr: 0.000481
    lr_schedule: warmup_cosine
    warmup_frac: 0.15
    max_grad_norm: 0.423
    temperature: 1.0
    weight_decay: 0.01
    accum_steps: 16
  psr_mse_all:
    lr: 0.0014216398292720336
    lr_schedule: warmup_cosine
    warmup_frac: 0.05
    max_grad_norm: 0.6712460967470124
  lora_r1_all:
