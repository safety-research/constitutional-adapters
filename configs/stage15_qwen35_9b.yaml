# Stage-1.5: cross-model replication of the Stage-1 boundary map on
# Qwen3.5-9B (post-trained; hybrid linear/full attention, nested
# text_config, reasoning template pinned off via enable_thinking=False in
# models.py). Same instruction taxonomy, prompts, arms, and budget as
# stage1_llama8b.yaml so rows are directly comparable.
model: Qwen/Qwen3.5-9B
dtype: bfloat16

instructions:
  - french
  - lowercase
  - concise
  - json
  - bullets
  - include_notably
  - no_sorry
  - pirate
  - cond_medical
  - cond_code
  - multi_french_concise
# actadd dropped for S1.5: 0/10 genuine in-budget wins on Llama-8B and it
# consumes the same eval sweep as the other diff methods; distill_hard kept
# so the hard-vs-soft supervision claim also gets a cross-model check.
methods: [instr_diff, caa, bidpo, distill_soft, distill_hard]

prompts:
  source: hf
  dataset: tatsu-lab/alpaca
  n: 600
  holdout_frac: 0.3
n_fit_prompts: 200
n_eval_prompts: 100

layers: [10, 13, 16, 19, 22, 25]   # ~30-75% of 32 layers, same band as Llama
method_layers:
  bidpo: [15]
  distill_soft: [15]
  distill_hard: [15]
scales: [0.25, 0.5, 1.0, 2.0, 4.0, 8.0]

train_kwargs:
  bidpo:
    epochs: 20
    batch_size: 4
    max_len: 768
  distill_soft:
    epochs: 6
    batch_size: 2
    max_len: 768
  distill_hard:
    epochs: 6
    batch_size: 2
    max_len: 768

capability: true
max_new_tokens: 200
out_dir: out/stage15_qwen35_9b
wandb_project: $WANDB_PROJECT
