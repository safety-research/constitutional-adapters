  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  - 128
  - 256
  sigma: 0.4
  trials: 1
  max_new_tokens: 2048   # 512 -> 2048 (pt829 truncation fix; BoN leg cap)
grader:
