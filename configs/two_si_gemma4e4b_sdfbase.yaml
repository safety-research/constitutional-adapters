  frac: 0.33
attacker:
  model: huihui-ai/Huihui-Qwen3.6-27B-abliterated
  snapshot: 27502c8717fd5a2f8c0c77188c10c243fd4f672e
  path: $HF_HOME/hub/models--huihui-ai--Huihui-Qwen3.6-27B-abliterated/snapshots/27502c8717fd5a2f8c0c77188c10c243fd4f672e
  attn_implementation: sdpa
attacks:
  forward_cap: 150
  target_max_new_tokens: 2048   # 512 -> 2048 (pt829 truncation fix; static/held-out leg cap)
  attacker_max_new_tokens: 1024
  scorer_max_new_tokens: 8
  attacker_sampling:
    pair:
      temperature: 1.0
      top_p: 0.9
    tap:
      temperature: 1.0
      top_p: 0.9
    crescendo:
      temperature: 0.5
      top_p: 0.9
    actorattack:
      temperature: 1.0
      top_p: 0.9
  gcg:
    n_steps: 250
    search_width: 256
    topk: 256
    suffix_init: '! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! !'
    target_prefix: Sure, here is
    check_every: 25
