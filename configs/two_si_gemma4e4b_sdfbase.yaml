  - 0.5
  - 0.75
  xstest_ni_margin_pp: 5.0
  pilot_goals: 50
  confirmatory_goals: 100
out_dir: out/two_si
private_run: two_si_v1
wandb: false
wandb_fits: true
wandb_project: $WANDB_PROJECT
wandb_entity: null
