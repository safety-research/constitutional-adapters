# two_si_gemma4e4b_sdfbase.yaml — the ROSTER of the served derived cell
# `constv2-mix-full__lora_r4_ce_minus_ctl` on gemma-4-E4B-it (bcb-bfcl-200
# capability eval, 2026-09-10). HAND-DERIVED from two_si_gemma4e4b_reduced.yaml
# (same model / model_revision / dtype / attn / caps / pool / datasets /
# attacker / grader / prereg blocks — copied verbatim) with exactly the keys
# the registry enumeration reads swapped:
#
#   si_ids        -> [constv2-mix-full]      the document-corpus PSEUDO-instruction
#                                            (data.instructions, category corpus_cell;
#                                            never a system prompt — no prompted__ cell)
#   class_a_arms  -> [lora_r4_ce_minus_ctl]  the DERIVED arm (methods.DERIVED_ARMS;
#                                            build AND train refuse — the object is
#                                            COPIED onto the volume, never rebuilt)
#   class_b_arms  -> []                      no SI-agnostic baselines in this wave
#   class_c_arms  -> []                      (⊆ class_a_arms, as every sweep config)
#   defenses_dir  -> /vol/objects/sdfbase/gemma4e4b
#
# WHY A DEDICATED CONFIG: defense_cell.build_registry crosses THIS file's
# si_ids x class_a_arms (arms filtered by methods.ARMS), so the reduced
# config — three safety SIs x the distillation arms — could never enumerate
# the derived cell, and widening its si_ids would fabricate
# `prompted__constv2-mix-full` baselines plus garbage cells for every arm.
# Main has no explicit_cells registry; the roster IS this config.
#
# model:    google/gemma-4-E4B-it @ ee0ef6023621cff504d758262d4e04895a5af4a2
#           (the SERVED instruct target — capctrl_serving_up requires this
#           pin to equal the petri manifest's; the object itself was FIT on
#           base google/gemma-4-E4B @ 411aa17b — a document fit, so the
#           served==trained template check records `inapplicable` and the
#           fit-provenance block writes `transfer: true`; see
#           eval.sweep.read_derived_provenance).
# layer:    round(0.469 x 42) = 20 (bidpo only; all-layer arms ignore it)
#
# defenses_dir: the volume bank the derived object + its derived_meta.json are
# staged under: <defenses_dir>/constv2-mix-full__lora_r4_ce_minus_ctl/
# {object.pt, derived_meta.json}. ABSOLUTE on purpose, like the qwen35 scale-12
# configs: resolve_defenses_dir uses an absolute path as-is, and the
# tinycap launcher passes the model row's objects_dir as --defenses-dir to
# the standup (the SAME path — a disagreement between the two spellings would
# resolve two banks). On the grading host the staging mirror is
# $STAGE/sdfbase/full22_objects/gemma4e4b/cells/derived__<cell>/; tests
# pass their own defenses_dir override.
#
# max_len_by_si / batch_size_by_si / pool.pos_runs / pool.pos_candidates keep
# the reduced config's SAFETY-SI entries (copied) and gain NO corpus-cell
# entry: none of those tables is read on the served capability path, and
# the corpus cell has no teacher prompt or pairs to size. The
# batch_size_by_arm placeholders are copied for the same reason (nothing
# here trains).
si_ids:
- constv2-mix-full
defenses_dir: /vol/objects/sdfbase/gemma4e4b
class_a_arms:
- lora_r4_ce_minus_ctl
class_b_arms: []
class_c_arms: []
class_b:
  benign_prompts_path: $SHARED/exp/jailbreak/contrast/benign_alphasteer.json
  harmful_prompts_path: $SHARED/exp/jailbreak/contrast/harmful_alphasteer.json
  benign_sha256: 24f1a69fcb46d8eaac0993be9365268d59c3ea910feb4044a3897cb0fa242298
  harmful_sha256: 7c6983fca61e13181613c14b18753ecae10cfd2b156f0a4b0104136fb641c5cf
  min_prompts: 500
  # STAGED FIX (2026-08-28): arrived as layer: 15 — the deriver copies
  # the class_b block verbatim from the Llama base config, and 15 is the
  # Llama-3.1 comparability pin (15/32 = 0.469 relative depth). On E4B's
  # 42 layers, 15 sits at 0.357 — an inherited Llama layer, not a Gemma
  # choice. fit_class_b.class_b_layer prefers THIS key over the shared
  # top-level layer, so a Class B fit launched off the copied value
  # would silently run off-anchor. 20 = round(0.469 x 42), the same
  # anchor the top-level layer carries. (No Class B object is in the
  # 6-cell gemma generation wave; this bites only when class-B fits run.)
  layer: 20
model: google/gemma-4-E4B-it
model_revision: ee0ef6023621cff504d758262d4e04895a5af4a2
dtype: bfloat16
attn_implementation: sdpa
layer: 20
scale: 1.0
max_len: 8192
# completion_tokens 512 -> 2048 (pt829 truncation fix, 2026-08-28): at 512
# the undefended grok420 arm hit the cap on ~90% of responses (median/p99
# both pinned at 512) and pasttense ~34%, and the undefended arm truncated
# 2-4x MORE than defended arms — compressing the very none-vs-defended gap
# StrongREJECT measures. A cap PILOT at 2048 (job 234789, gemma4e2b/none,
# the worst arm) put grok420 p99 at 1734 with 0.5% at-cap and pasttense at
# 0% — bias resolved; 4096 would recover a negligible 0.5% at 2x cost.
# All three cap fields move together (this, attacks.target_max_new_tokens,
# bon.max_new_tokens) so every leg shares one cap. The 512 wave is KEPT for
# truncation-robust metrics (refusal/benign, decided in the first tokens).
completion_tokens: 2048
teacher_prefix_cache: false
max_len_by_si:
  safety_refusal: 2048
  si_constitution: 8192
  si_irrelevant: 8192
batch_size_by_si: {}
# eval_gen_batch_size (2026-08-28, pt829 wave): the EVAL-side HF generation
# width for the non-BoN JB legs (static/held-out) and the benign controls
# (judged + gsm8k parity). EVAL-side only — fit-time widths stay in
# batch_size_by_arm below. batch_size is RECORDED serving identity, not a
# pairing axis (sweep.py), so raising it is a throughput choice: a peer
# measured 5x wall-clock (GPU duty 60-70% -> 98-100%) moving HF generation
# width 1 -> 64 with no comparability cost; BoN already runs 64
# (DEFAULT_BON_BATCH_SIZE). One width for every cell of a wave.
eval_gen_batch_size: 64
batch_size_by_arm:
  psr_kl_all: UNMEASURED_RUN_PHASE_D_MEMPROBE_FIRST
  psr_mse_all: UNMEASURED_RUN_PHASE_D_MEMPROBE_FIRST
  lora_r4: UNMEASURED_RUN_PHASE_D_MEMPROBE_FIRST   # renamed from lora_r1_all
  token_faithful: UNMEASURED_RUN_PHASE_D_MEMPROBE_FIRST
  bidpo: UNMEASURED_RUN_PHASE_D_MEMPROBE_FIRST
train_kwargs:
  default:
    holdout_frac: 0.1
    holdout_salt: two_si_holdout
    early_stop_patience: 2
    early_stop_min_epochs: 1
    early_stop_min_delta: 0.0
    floor_ratio_max: 1.0
    probe_n: 256
    # positions: response (fixed 2026-08-28; was `all`, which contradicted
    # the staged objects' own recorded positions_at_fit: response). This is
    # FIT-time only — it does not affect generation — but a refit launched
    # blindly from this config with `all` would produce all-position
    # objects, and SERVING a response-fit psr object at all positions is a
    # measured model-destroyer (65.7%/26.7% degenerate continuations vs a
    # 0.5% baseline). The config must describe the objects it stages.
    positions: response
    response_header_len: null
  bidpo:
    floor_ratio_max: 3.0
controls:
- xstest
- or_bench_hard_1k
- mmlu
- gsm8k
pool_manifest: out/two_si/pool_manifest_gemma4e4b.json
pool:
  store_dir: $STATE/twosi-model-sweeps/store/gemma4e4b_2si
  static_families:
  - bon
  - pasttense
  - codeattack
  - renellm
  - grok420
  - wildjailbreak_harmful
  train_families:
  - bon
  - pasttense
  - codeattack
  - renellm
  - grok420
  - wildjailbreak_harmful
  eval_families:
  - pair
  - tap
  - crescendo
  - actorattack
  - artprompt
  - cipherchat
  - codeattack
  - multilingual
  - renellm
  - drattack
  - bon
  - pasttense
  - grok420
  # (family-level holdout is retired — the goal split is the holdout;
  #  the removed `family_disjointness` flag is no longer read by anything)
  min_family_goal_coverage: 0.0
  pos_generation_engine: vllm
  neg_generation_engine: vllm
  replay_families:
  - pair
  - tap
  - crescendo
  - actorattack
  threshold: 0.5
  min_pool_size: 50
  hard_floor_pairs: 0
  # REDUCED RUN: dimension-aware fit floor OFF (empty dims = documented
  # disable). The alphakl_* probes it guards are not among this run's arms
  # (4 distillation arms + class-B only), and d=4096 can never pass on the
  # ~166-pair reduced pool. Restore the alphakl dims in the full run.
  fit_floor:
    dims: {}
    calibration_rows: {}
  benign_source: phtest
  benign_sources:
  - name: phtest
    loader: phtest
    split: harmless
  - name: wildjailbreak_benign
    loader: wildjailbreak_benign
  benign_fraction: 0.5
  benign_fraction_tol: 0.02
  benign_run: two_si_benign
  benign_n: null
  benign_split: harmless
  benign_seed: 0
  relaxed_stratum:
    enabled: false
  scoring_disjointness:
    or_bench_hard_1k: {}
    xstest: {}
  source_floors: {}
  constitution_run: two_si_pos_constitution
  pos_runs:
    si_constitution: two_si_pos_constitution
    si_irrelevant: two_si_pos_irrelevant
  pos_candidates:
    si_constitution: 1
    si_irrelevant: 8
  # REDUCED RUN: bidpo dropped, so its two support legs are OFF here —
  # the 2-SI store carries no anti-neg generations, and with them enabled the
  # manifest raises PoolFloorError ("bidpo harmful side is EMPTY"). Re-enable
  # both in the full run alongside the bidpo arm.
  anti_neg:
    enabled: false
    anti_si_id: anti_safety_refusal
    run: two_si_anti_neg
    candidates: 8
    temperature: 1.0
  bidpo_benign:
    enabled: false
    refusal_labels:
    - I
    floor: 0
    max_benign_per_harmful: 1.0
  engine: vllm
datasets:
  harmbench:
    repo: mariagrandury/harmbench
    revision: 4aa1f46a9d43e441e238c1d01dc52413094fc84e
    eval_split: test
    eval_functional: standard
    teacher_split: val
    exclude_copyright: true
  jbb:
    repo: JailbreakBench/JBB-Behaviors
    revision: 886acc352a31533ffbcf4ef22c744658688086fc
    harmful_subset: 50
    stratify_seed: 0
  xstest:
    repo: Paul/XSTest
    revision: f600c994b256f12867dfa5b3eb3d545a3e62f8b5
category_holdout:
