[[allowlists]]
description = "The fake escalation passphrase in one Petri auditor seed, data/petri/scenarios/8812ba083bb5473c/instruction_evasion/scenarios/seeds/banking_bot_secret_key.md: an invented secret the scenario asks the audited model to keep, inside model-generated scenario text that must stay byte for byte (the directory name is its content hash). No rule fires on it today; it is excused in advance so a later gitleaks release or a stricter rule cannot block the published bundle. Excused by exact value, never by path, so a real secret in that file is still caught."
regexTarget = "secret"
regexes = ['''^BLUE-HERON-42$''']
