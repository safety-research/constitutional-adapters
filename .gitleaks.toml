# Secret-scanning config (gitleaks), run via pre-commit on every commit.
# Living document: add provider rules as you encounter new key formats.
# NOTE: patterns here are Go regexes in TOML raw strings — single backslashes.

[extend]
useDefault = true

[[rules]]
id = "openrouter-api-key"
description = "Detected an OpenRouter API Key, posing a risk of unauthorized access to AI models and budget consumption."
regex = '''\b(sk-or(-v\d+)?-[a-f0-9]{64})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["sk-or"]

# Generic sk- prefix catch-all (Anthropic/OpenAI/etc.); prefer false positives
# over a leaked key.
[[rules]]
id = "generic-sk-key"
description = "Detected an API key with sk- prefix followed by 20 or more characters."
regex = '''\b(sk-[a-zA-Z0-9_\-]{20,})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["sk-"]

# Tinker (Thinking Machines) - tml- prefix
[[rules]]
id = "tinker-api-key"
description = "Detected a Tinker (Thinking Machines) API Key"
regex = '''\b(tml-[a-zA-Z0-9_\-]{60,})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["tml-"]

# HuggingFace user access tokens - hf_ prefix (this project reads HF models;
# tokens must live at HF_TOKEN_PATH, never in the repo).
[[rules]]
id = "huggingface-token"
description = "Detected a HuggingFace user access token"
regex = '''\b(hf_[a-zA-Z0-9]{30,})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["hf_"]

# RunPod API keys - rpa_ prefix
[[rules]]
id = "runpod-api-key"
description = "Detected a RunPod API Key"
regex = '''\b(rpa_[a-zA-Z0-9_\-]{20,})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["rpa_"]

# Replicate - r8_ prefix
[[rules]]
id = "replicate-api-key"
description = "Detected a Replicate API Key"
regex = '''\b(r8_[a-zA-Z0-9]{20,})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = ["r8_"]

# Weights & Biases: 40-hex key assigned to a WANDB var (entity logs runs here).
[[rules]]
id = "wandb-api-key"
description = "Detected a Weights & Biases API Key assignment"
regex = '''(?i)wandb(_api)?_?key['"\s]*[=:]['"\s]*(local-)?[a-f0-9]{40}'''
keywords = ["wandb"]

# HuggingFace OAuth / JWT-style tokens. These ALSO start with hf_ but contain
# dots and underscores, so the alnum-only rule above does NOT match them
# (verified: an 825-char oauth token of shape hf_<5>_<90>.<638>.<1>_<16>_<67>
# scanned clean before this rule existed). Entropy gate keeps dotted
# identifier chains like hf_model_config.some_attr.other from tripping it.
[[rules]]
id = "huggingface-token-oauth"
description = "Detected a HuggingFace OAuth/JWT access token"
regex = '''\b(hf_[A-Za-z0-9_\-]{4,}\.[A-Za-z0-9_\-]{30,}\.[A-Za-z0-9_\-]{4,})'''
keywords = ["hf_"]
entropy = 4.0

# Credential FILES must never be committed, whatever their contents.
[[rules]]
id = "credential-file-name"
description = "A credential file (hf_token, stored_tokens, .netrc, key) was staged"
path = '''(^|/)(hf_token|\.hf_token|stored_tokens|\.netrc|id_rsa|id_ed25519)$'''

# The Petri steered-serving smoke's fidelity PHASE KEYS ("bi0_certified",
# "bi0_certified_petri16k", "bi1_probe") sit in JSON fields named
# *_phase_key, which the default generic-api-key rule reads as a key
# assignment (the replay fixture
# tests/fixtures/modal_petri_smoke_record_completed.json, 2026-09-06).
# Allowlist the exact identifier shape, NOT the file — a real secret in that
# fixture is still caught (verified with a fake hf_ token beside the literal).
[[allowlists]]
description = "Petri smoke fidelity phase keys are identifiers, not secrets"
regexTarget = "secret"
regexes = ['''^bi[01]_(certified|probe|gating)[A-Za-z0-9_]*$''']

[[allowlists]]
description = "tests/test_mamba_backend_attestation.py LENS_KEY_BEFORE_ENGINE_API: the sha256 cache ADDRESS of the pre-engine-API lens attestation key over fixed test inputs (native-serving-default plan §1.7) — a deterministic digest, not a credential; the generic-api-key rule fires on the word KEY beside 64 hex. Excused by exact value."
regexes = ['''f695dfff5df153cd267f8b3c746334c3f57f5887f5731687b9eeeed791be7bfd''']

[[allowlists]]
description = "native-psr-serving stage 2: the staged ids / pin keys `si12__safety_refusal__psr_kl_all`, `si12__si_constitution__psr_kl_all` and the certification row key `gemma4e4b_psr2cert` are cell / row IDENTIFIERS that sit beside the words PINKEY / key in scripts/sdfbase/multilora_cert.sbatch and tests/test_multilora_cert_{records,targets_agree}.py; the generic-api-key rule reads the assignment as a key. Excused by exact value, never by path — a real secret on those lines is still caught."
regexTarget = "secret"
regexes = ['''^si12__safety_refusal__psr_kl_all$''', '''^gemma4e4b_psr2cert$''', '''^si12__si_constitution__psr_kl_all$''']

[[allowlists]]
description = "Git blob ids in the closer executed-set manifest, commit 9fe3d0230 (reproduce/lib/closer_executed_set.json, deleted later on the same branch): each value is the blob id of the named file at that commit, and the generic-api-key rule fires because the file names contain auth / api_keys / tokens. Excused by exact value, never by path."
regexTarget = "secret"
regexes = ['''^515dd0896bf0a7f68326c5d16f6a53623a617db0$''', '''^b996f60d43d12406ebd752bb7ea6770ef259b9d1$''', '''^392c9807df9e9cef902a27fac5a92d9f71d45170$''', '''^77f0e730b0c0edf202d824ecbb6ab90571f847c7$''']

